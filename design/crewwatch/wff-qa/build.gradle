// Mostrador de QA "CrewWatch · Painel de Voo" (Watch Face Format v1, só recursos, sem código).
// applicationId próprio para coexistir com o app (com.crewcheck.app) e o mostrador oficial (com.crewcheck.watch.app).
plugins {
    id 'com.android.application' version '8.11.1'
}

android {
    namespace 'com.crewcheck.qa.crewwatch'
    compileSdk 36

    defaultConfig {
        applicationId 'com.crewcheck.qa.crewwatch'
        minSdk 33          // Wear OS 4 (API 33) é o mínimo do Watch Face Format v1
        targetSdk 36
        versionCode 1
        versionName '0.1.0-qa'
    }

    buildTypes {
        // QA: só a variante debug, assinada com a chave de debug local do Android SDK.
        // R8 sem regras de keep remove as classes R geradas: o APK fica sem classes.dex,
        // como pede o Watch Face Format (hasCode=false, só recursos).
        debug {
            minifyEnabled true
            shrinkResources false
        }
    }
}
