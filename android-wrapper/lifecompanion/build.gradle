plugins {
    id 'com.android.application'
}

def storeFilePath = project.findProperty('CREWCHECK_STORE_FILE') ?: System.getenv('CREWCHECK_STORE_FILE')
def storePasswordValue = project.findProperty('CREWCHECK_STORE_PASSWORD') ?: System.getenv('CREWCHECK_STORE_PASSWORD')
def keyAliasValue = project.findProperty('CREWCHECK_KEY_ALIAS') ?: System.getenv('CREWCHECK_KEY_ALIAS')
def keyPasswordValue = project.findProperty('CREWCHECK_KEY_PASSWORD') ?: System.getenv('CREWCHECK_KEY_PASSWORD')
def hasReleaseSigning = storeFilePath && storePasswordValue && keyAliasValue && keyPasswordValue
def samsungHealthAar = file('libs/samsung-health-data-api.aar')
def generatedRes = file("$buildDir/generated/res/crewcheckBrand")

tasks.register('generateCrewLifeBrandAssets') {
    inputs.file(file('../../client/public/icons/crewcheck-icon-v2.png'))
    outputs.file(file("$generatedRes/drawable-nodpi/crewcheck_life_icon.png"))
    doLast {
        def target = file("$generatedRes/drawable-nodpi")
        target.mkdirs()
        copy {
            from file('../../client/public/icons/crewcheck-icon-v2.png')
            into target
            rename { 'crewcheck_life_icon.png' }
        }
    }
}

android {
    namespace 'com.crewcheck.life'
    compileSdk 36

    defaultConfig {
        applicationId 'com.crewcheck.life'
        minSdk 29
        targetSdk 36
        versionCode 100
        versionName '1.0.0'
        buildConfigField 'boolean', 'SAMSUNG_HEALTH_SDK_INCLUDED', samsungHealthAar.exists() ? 'true' : 'false'
    }

    sourceSets {
        main.res.srcDir generatedRes
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(storeFilePath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }

    buildTypes {
        debug {
            debuggable true
            versionNameSuffix '-dev'
        }
        release {
            minifyEnabled false
            shrinkResources false
            debuggable false
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }
}

dependencies {
    if (samsungHealthAar.exists()) {
        implementation files(samsungHealthAar)
    }
}

preBuild.dependsOn generateCrewLifeBrandAssets
