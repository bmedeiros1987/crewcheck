plugins {
    id 'com.android.application'
}

def storeFilePath = project.findProperty('CREWCHECK_STORE_FILE') ?: System.getenv('CREWCHECK_STORE_FILE')
def storePasswordValue = project.findProperty('CREWCHECK_STORE_PASSWORD') ?: System.getenv('CREWCHECK_STORE_PASSWORD')
def keyAliasValue = project.findProperty('CREWCHECK_KEY_ALIAS') ?: System.getenv('CREWCHECK_KEY_ALIAS')
def keyPasswordValue = project.findProperty('CREWCHECK_KEY_PASSWORD') ?: System.getenv('CREWCHECK_KEY_PASSWORD')
def hasReleaseSigning = storeFilePath && storePasswordValue && keyAliasValue && keyPasswordValue

def generatedCrewWatchRes = file("$buildDir/generated/res/crewcheckBrand")

tasks.register('generateCrewWatchBrandAssets') {
    inputs.file(file('../../client/public/icons/crewcheck-icon-v2.png'))
    outputs.file(file("$generatedCrewWatchRes/drawable-nodpi/crewcheck_official.png"))
    doLast {
        def target = file("$generatedCrewWatchRes/drawable-nodpi")
        target.mkdirs()
        copy {
            from file('../../client/public/icons/crewcheck-icon-v2.png')
            into target
            rename { 'crewcheck_official.png' }
        }
    }
}

android {
    namespace 'com.crewcheck.watch'
    compileSdk 36

    sourceSets {
        main.res.srcDir generatedCrewWatchRes
    }

    defaultConfig {
        applicationId 'com.crewcheck.app'
        minSdk 30
        targetSdk 36
        versionCode 144091
        versionName '14.4.09-wear'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(storeFilePath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            debuggable false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            debuggable true
            versionNameSuffix '-debug'
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
    implementation 'androidx.wear:wear:1.4.0'
    implementation 'androidx.wear.watchface:watchface-complications-data-source:1.2.1'
    // OnBackPressedDispatcher chega transitivamente via fragment, mas o botão
    // de voltar do relógio depende dele: melhor não ficar na sorte da resolução.
    implementation 'androidx.activity:activity:1.9.3'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
}

preBuild.dependsOn generateCrewWatchBrandAssets

apply from: rootProject.file('store-policy.gradle')
