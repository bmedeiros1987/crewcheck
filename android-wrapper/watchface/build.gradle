plugins {
    id 'com.android.application'
}

def storeFilePath = project.findProperty('CREWCHECK_STORE_FILE') ?: System.getenv('CREWCHECK_STORE_FILE')
def storePasswordValue = project.findProperty('CREWCHECK_STORE_PASSWORD') ?: System.getenv('CREWCHECK_STORE_PASSWORD')
def keyAliasValue = project.findProperty('CREWCHECK_KEY_ALIAS') ?: System.getenv('CREWCHECK_KEY_ALIAS')
def keyPasswordValue = project.findProperty('CREWCHECK_KEY_PASSWORD') ?: System.getenv('CREWCHECK_KEY_PASSWORD')
def hasReleaseSigning = storeFilePath && storePasswordValue && keyAliasValue && keyPasswordValue

def generatedCrewWatchFaceRes = file("$buildDir/generated/res/crewcheckBrand")

tasks.register('generateCrewWatchFaceBrandAssets') {
    inputs.file(file('../../client/public/icons/crewcheck-icon-v2.png'))
    outputs.file(file("$generatedCrewWatchFaceRes/drawable-nodpi/crewcheck_official.png"))
    doLast {
        def target = file("$generatedCrewWatchFaceRes/drawable-nodpi")
        target.mkdirs()
        copy {
            from file('../../client/public/icons/crewcheck-icon-v2.png')
            into target
            rename { 'crewcheck_official.png' }
        }
    }
}

android {
    namespace 'com.crewcheck.face'
    compileSdk 36

    sourceSets {
        main.res.srcDir generatedCrewWatchFaceRes
    }

    defaultConfig {
        applicationId 'com.crewcheck.watch.app'
        minSdk 33
        targetSdk 36
        versionCode 144092
        versionName '14.4.09-watchface'
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(storeFilePath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildFeatures {
        buildConfig false
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

preBuild.dependsOn generateCrewWatchFaceBrandAssets

apply from: rootProject.file('store-policy.gradle')
apply from: file('preview-assets.gradle')
