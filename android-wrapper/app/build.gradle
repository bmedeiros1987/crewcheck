plugins {
    id 'com.android.application'
}

def crewcheckStoreFile = project.findProperty('CREWCHECK_STORE_FILE') ?: System.getenv('CREWCHECK_STORE_FILE')
def crewcheckStorePassword = project.findProperty('CREWCHECK_STORE_PASSWORD') ?: System.getenv('CREWCHECK_STORE_PASSWORD')
def crewcheckKeyAlias = project.findProperty('CREWCHECK_KEY_ALIAS') ?: System.getenv('CREWCHECK_KEY_ALIAS')
def crewcheckKeyPassword = project.findProperty('CREWCHECK_KEY_PASSWORD') ?: System.getenv('CREWCHECK_KEY_PASSWORD')
def crewcheckSigningReady = crewcheckStoreFile && crewcheckStorePassword && crewcheckKeyAlias && crewcheckKeyPassword
def generatedCrewCheckRes = file("$buildDir/generated/res/crewcheckBrand")

tasks.register('generateCrewCheckBrandAssets') {
    inputs.file(file('../../client/public/icons/crewcheck-icon-v2.png'))
    outputs.file(file("$generatedCrewCheckRes/drawable-nodpi/crewcheck_icon_site.png"))
    doLast {
        def target = file("$generatedCrewCheckRes/drawable-nodpi")
        target.mkdirs()
        copy {
            from file('../../client/public/icons/crewcheck-icon-v2.png')
            into target
            rename { 'crewcheck_icon_site.png' }
        }
    }
}

android {
    namespace 'com.crewcheck.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.crewcheck.app'
        minSdk 26
        targetSdk 35
        versionCode 139100
        versionName '13.9.1'
    }

    sourceSets {
        main.res.srcDir generatedCrewCheckRes
    }

    def storeFilePath = project.findProperty('CREWCHECK_STORE_FILE') ?: System.getenv('CREWCHECK_STORE_FILE')
    def storePasswordValue = project.findProperty('CREWCHECK_STORE_PASSWORD') ?: System.getenv('CREWCHECK_STORE_PASSWORD')
    def keyAliasValue = project.findProperty('CREWCHECK_KEY_ALIAS') ?: System.getenv('CREWCHECK_KEY_ALIAS')
    def keyPasswordValue = project.findProperty('CREWCHECK_KEY_PASSWORD') ?: System.getenv('CREWCHECK_KEY_PASSWORD')
    def hasReleaseSigning = storeFilePath && storePasswordValue && keyAliasValue && keyPasswordValue

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(storeFilePath)
                storePassword storePasswordValue
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            debuggable false
            zipAlignEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            debuggable true
        }
    }
}

preBuild.dependsOn generateCrewCheckBrandAssets

dependencies {
    def billing_version = "9.1.0"
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")
    implementation "com.android.billingclient:billing:$billing_version"
}
