name: Next flight gate (phone + CrewWatch)
on:
  pull_request:
    paths:
      - 'client/src/lib/nextFlightGate.ts'
      - 'client/src/lib/nextFlightWatch.ts'
      - 'client/src/lib/watchContext.ts'
      - 'client/src/components/nextflight/**'
      - 'client/src/components/v1391/HomeRosterPreview.tsx'
      - 'client/src/pages/Home.tsx'
      - 'scripts/regression-next-flight-gate.mjs'
      - 'scripts/regression-next-flight-gate-prepared.mjs'
      - 'client/src/lib/canonicalRoster.ts'
      - 'client/src/lib/rosterDisplayDate.ts'
      - 'scripts/p1-566-flightdeck-radar-briefing-context/**'
      - '.github/workflows/next-flight-gate.yml'
permissions:
  contents: read
jobs:
  simulated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Simulated contract in three timezones (no network, no credentials)
        run: |
          TZ=UTC node scripts/regression-next-flight-gate.mjs
          TZ=America/Sao_Paulo node scripts/regression-next-flight-gate.mjs
          TZ=Pacific/Auckland node scripts/regression-next-flight-gate.mjs
      - name: Verify actual prepared Radar handoff, civil date and safe notices
        run: |
          node scripts/v139/apply.mjs
          TZ=UTC node scripts/regression-next-flight-gate-prepared.mjs
          TZ=America/Sao_Paulo node scripts/regression-next-flight-gate-prepared.mjs
          TZ=Pacific/Auckland node scripts/regression-next-flight-gate-prepared.mjs
