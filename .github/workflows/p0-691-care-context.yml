name: P0 #691 care context

on:
  pull_request:
    paths:
      - 'client/src/lib/scheduleActivityClassification.ts'
      - 'client/src/lib/rosterCodes.ts'
      - 'client/src/pages/Home.tsx'
      - 'client/src/components/v14349/OperationalDayTimeline.tsx'
      - 'server.mjs'
      - 'server/v1403/telegram-human.mjs'
      - 'server/v1403/premium-helpers.snippet'
      - 'server/v1403/build-reply.snippet'
      - 'scripts/v14357/OperationalDayTimeline.tsx'
      - 'scripts/p0-691-care-context/**'
      - 'scripts/v139/apply.mjs'
      - 'scripts/regression-p0-691-care-context.mjs'
      - 'scripts/regression-p0-691-care-ui.mjs'
      - '.github/workflows/p0-691-care-context.yml'
  push:
    branches: [main]
    paths:
      - 'client/src/lib/scheduleActivityClassification.ts'
      - 'client/src/lib/rosterCodes.ts'
      - 'client/src/pages/Home.tsx'
      - 'client/src/components/v14349/OperationalDayTimeline.tsx'
      - 'server.mjs'
      - 'server/v1403/telegram-human.mjs'
      - 'server/v1403/premium-helpers.snippet'
      - 'server/v1403/build-reply.snippet'
      - 'scripts/v14357/OperationalDayTimeline.tsx'
      - 'scripts/p0-691-care-context/**'
      - 'scripts/v139/apply.mjs'
      - 'scripts/regression-p0-691-care-context.mjs'
      - 'scripts/regression-p0-691-care-ui.mjs'
      - '.github/workflows/p0-691-care-context.yml'

permissions:
  contents: read

jobs:
  care-context:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Committed PR diff whitespace guard
        if: github.event_name == 'pull_request'
        run: git diff --check HEAD^1 HEAD^2
      - name: Existing activity classification regression on its source contract
        run: |
          node scripts/v14350/apply.mjs
          node scripts/regression-v14-3-50-p0-activity-classification.mjs
      - name: Prepare current canonical source from committed files
        run: |
          git restore --source=HEAD --worktree .
          node scripts/v139/apply.mjs
      - name: Materialize Care Mode twice (idempotence)
        run: |
          node scripts/p0-691-care-context/apply.mjs
          node scripts/p0-691-care-context/apply.mjs
      - name: Care semantics regression on prepared source
        run: node scripts/regression-p0-691-care-context.mjs
      - name: Formal FOLGA authority regression on prepared source
        run: node scripts/p0-691-care-context/regression-formal-folga-authority.mjs
      - name: Care UI/personality regression on prepared source
        run: CHECK_PREPARED=1 node scripts/regression-p0-691-care-ui.mjs
      - name: Existing rest versus overnight regression
        run: node scripts/regression-p0-base-rest-vs-overnight.mjs
      - name: Existing Concierge Easter Egg compatibility
        run: node scripts/regression-v14-3-15-concierge-easter-eggs.mjs
      - name: Replay full canonical preparation from committed files
        run: |
          git restore --source=HEAD --worktree .
          node scripts/v139/apply.mjs
      - name: Care semantics regression after full preparation
        run: node scripts/regression-p0-691-care-context.mjs
      - name: Formal FOLGA authority regression after full preparation
        run: node scripts/p0-691-care-context/regression-formal-folga-authority.mjs
      - name: Care UI/personality regression after full preparation
        run: CHECK_PREPARED=1 node scripts/regression-p0-691-care-ui.mjs
      - name: Easter Egg compatibility after full preparation
        run: node scripts/regression-v14-3-15-concierge-easter-eggs.mjs
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build
        run: npx vite build
