name: Concierge stay context

on:
  pull_request:
    paths:
      - 'client/src/lib/conciergeStayContext.ts'
      - 'client/src/lib/conciergeStaySync.ts'
      - 'client/src/lib/conciergeStayNotificationPlan.ts'
      - 'client/src/lib/conciergeStayNotifications.ts'
      - 'client/src/components/v1391/ConciergeStayContextCard.tsx'
      - 'client/src/components/v1391/ConciergeRoomNoiseCard.tsx'
      - 'scripts/regression-concierge-stay-context.mjs'
      - 'scripts/regression-concierge-stay-notifications.mjs'
      - '.github/workflows/concierge-stay-context.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Concierge contextual stay regression
        run: node scripts/regression-concierge-stay-context.mjs
      - name: Concierge contextual notification regression
        run: node scripts/regression-concierge-stay-notifications.mjs
      - name: TypeScript
        run: npx tsc --noEmit
