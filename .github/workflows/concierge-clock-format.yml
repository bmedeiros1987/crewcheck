name: CrewCheck Concierge clock format

on:
  pull_request:
    branches: [main]
    paths:
      - 'server/v14354/concierge-language.mjs'
      - 'server/v1404/**'
      - 'server/v1403/**'
      - 'server/v14408/**'
      - 'scripts/v139/**'
      - 'scripts/v14314/**'
      - 'scripts/regression-concierge-clock-format.mjs'
      - 'scripts/tests/concierge-activity-kind.test.mjs'
      - 'scripts/tests/concierge-departure-text.test.mjs'
      - 'scripts/tests/concierge-premium-departure-router.test.mjs'
      - 'scripts/regression-concierge-wellhub-conversation.mjs'
      - 'scripts/regression-radar-authority-followup.mjs'
      - 'scripts/v14335/departure-reply.snippet'
      - 'server/concierge/journey-programs.mjs'
      - '.github/workflows/concierge-clock-format.yml'
  push:
    branches: [main]
    paths:
      - 'server/v14354/concierge-language.mjs'
      - 'server/v1404/**'
      - 'server/v1403/**'
      - 'server/v14408/**'
      - 'scripts/v139/**'
      - 'scripts/v14314/**'
      - 'scripts/regression-concierge-clock-format.mjs'
      - 'scripts/tests/concierge-activity-kind.test.mjs'
      - 'scripts/tests/concierge-departure-text.test.mjs'
      - 'scripts/tests/concierge-premium-departure-router.test.mjs'
      - 'scripts/regression-concierge-wellhub-conversation.mjs'
      - 'scripts/regression-radar-authority-followup.mjs'
      - 'scripts/v14335/departure-reply.snippet'
      - 'server/concierge/journey-programs.mjs'
      - '.github/workflows/concierge-clock-format.yml'

permissions:
  contents: read

concurrency:
  group: concierge-clock-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clock-format:
    name: Preserve clocks before and after canonical preparation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate source clocks and voice round trips
        run: node --test scripts/regression-concierge-clock-format.mjs
      - name: Validate source activity labels and synthetic import lifecycle
        run: node scripts/tests/concierge-activity-kind.test.mjs
      - name: Validate synthetic departure dates and context before preparation
        run: node scripts/tests/concierge-departure-text.test.mjs
      - name: Prepare canonical CrewCheck sources
        run: node scripts/v139/apply.mjs
      - name: Validate prepared clocks and voice round trips
        run: node --test scripts/regression-concierge-clock-format.mjs

      - name: Validate prepared activity labels and actual Today consumer
        run: node scripts/tests/concierge-activity-kind.test.mjs --materialized
      - name: Validate actual prepared departure text without network
        run: node scripts/tests/concierge-departure-text.test.mjs --materialized
      - name: Validate actual prepared menu, core, premium producer and sender
        run: |
          set -euo pipefail
          node scripts/tests/concierge-premium-departure-router.test.mjs --materialized 2>&1 | tee "$RUNNER_TEMP/premium-departure-router.log"
          node scripts/regression-radar-authority-followup.mjs
      - name: Preserve exact activity-label sources
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/activity-kind-proof/server/v1404" "$RUNNER_TEMP/activity-kind-proof/scripts/v14314" "$RUNNER_TEMP/activity-kind-proof/scripts/tests"
          mkdir -p "$RUNNER_TEMP/activity-kind-proof/server/concierge" "$RUNNER_TEMP/activity-kind-proof/scripts/v14335"
          cp server/concierge/journey-programs.mjs server/concierge/stay-menu.mjs "$RUNNER_TEMP/activity-kind-proof/server/concierge/"
          cp scripts/v14335/departure-reply.snippet "$RUNNER_TEMP/activity-kind-proof/scripts/v14335/"
          cp scripts/tests/concierge-departure-text.test.mjs "$RUNNER_TEMP/activity-kind-proof/scripts/tests/"
          mkdir -p "$RUNNER_TEMP/activity-kind-proof/scripts/p1-concierge-journey"
          cp -R server/concierge/generated "$RUNNER_TEMP/activity-kind-proof/server/concierge/"
          cp scripts/p1-concierge-journey/bridge.mjs "$RUNNER_TEMP/activity-kind-proof/scripts/p1-concierge-journey/"
          printf '%s\n' '${{ github.event.pull_request.base.sha || github.event.before }}' > "$RUNNER_TEMP/activity-kind-proof/BASE.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/activity-kind-proof/HEAD.txt"
          cp server.mjs "$RUNNER_TEMP/activity-kind-proof/"
          mkdir -p "$RUNNER_TEMP/activity-kind-proof/server/v1403"
          cp server/v1403/premium-helpers.snippet "$RUNNER_TEMP/activity-kind-proof/server/v1403/"
          cp scripts/tests/concierge-premium-departure-router.test.mjs "$RUNNER_TEMP/activity-kind-proof/scripts/tests/"
          cp scripts/regression-concierge-wellhub-conversation.mjs scripts/regression-radar-authority-followup.mjs "$RUNNER_TEMP/activity-kind-proof/scripts/"
          test ! -f "$RUNNER_TEMP/premium-departure-router.log" || cp "$RUNNER_TEMP/premium-departure-router.log" "$RUNNER_TEMP/activity-kind-proof/"
          cp server/v1404/telegram-language.mjs "$RUNNER_TEMP/activity-kind-proof/server/v1404/"
          cp scripts/v14314/apply.mjs "$RUNNER_TEMP/activity-kind-proof/scripts/v14314/"
          cp scripts/tests/concierge-activity-kind.test.mjs "$RUNNER_TEMP/activity-kind-proof/scripts/tests/"
          sha256sum server/concierge/generated/*.mjs server/concierge/generated/source-hashes.json scripts/p1-concierge-journey/bridge.mjs server.mjs server/v1404/telegram-language.mjs server/concierge/journey-programs.mjs server/concierge/stay-menu.mjs scripts/v14314/apply.mjs scripts/v14335/departure-reply.snippet scripts/tests/concierge-departure-text.test.mjs scripts/tests/concierge-activity-kind.test.mjs server/v1403/premium-helpers.snippet scripts/tests/concierge-premium-departure-router.test.mjs scripts/regression-concierge-wellhub-conversation.mjs scripts/regression-radar-authority-followup.mjs > "$RUNNER_TEMP/activity-kind-proof/SHA256SUMS"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: concierge-activity-kind-prepared-source
          path: ${{ runner.temp }}/activity-kind-proof/
