name: Cirium Radar pure OFF contract
on:
  pull_request:
    paths:
      - 'server/cirium-radar-provider.mjs'
      - 'server/radar-sequential.mjs'
      - 'scripts/regression-radar-sequential.mjs'
      - 'docs/radar-cirium-flightaware-sequential.md'
      - 'server/cirium-flight-adapter.mjs'
      - 'server/radar-occurrence-identity.mjs'
      - 'server/radar-field-provenance.mjs'
      - 'scripts/regression-cirium-radar-provider-off.mjs'
      - '.github/workflows/cirium-radar-provider-off.yml'
      - 'server/cirium-radar-injection.mjs'
      - 'server.mjs'
      - 'scripts/cirium-radar-off/**'
      - 'scripts/v139/apply.mjs'
      - 'scripts/regression-cirium-radar-wiring-off.mjs'
      - 'scripts/check-cirium-radar-wiring-off.mjs'
      - 'docs/cirium-radar-wiring-off.md'
      - 'server/cirium-sky-transport.mjs'
      - 'scripts/regression-cirium-sky-transport-off.mjs'
      - 'docs/cirium-sky-transport-off.md'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
      - name: Pure contract in three timezones without credentials or egress
        run: |
          TZ=UTC node scripts/regression-cirium-radar-provider-off.mjs
          TZ=America/Sao_Paulo node scripts/regression-cirium-radar-provider-off.mjs
          TZ=Pacific/Auckland node scripts/regression-cirium-radar-provider-off.mjs
      - run: npm ci
      - name: Sequential primary/fallback and authenticated handler offline
        run: node scripts/regression-radar-sequential.mjs
      - name: Raw and prepared wiring, cache lifecycle and canonical regression gates
        run: node scripts/check-cirium-radar-wiring-off.mjs
      - name: Sequential routing after canonical materialization
        run: |
          node scripts/v139/apply.mjs
          node scripts/regression-radar-sequential.mjs
