name: Weather observation alert policy

on:
  pull_request:
    branches: [main]
    paths:
      - 'server.mjs'
      - 'server/weather/**'
      - 'scripts/tests/critical-weather-observation.test.mjs'
      - 'scripts/tests/operational-weather-flight.test.mjs'
      - 'client/src/pages/Home.tsx'
      - 'scripts/regression-operational-weather-browser.cjs'
      - '.github/workflows/weather-observation-alert.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  weather-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Test tracked monitor and pure policy without network
        run: |
          node --check server/weather/critical-observation.mjs
          node --check server.mjs
          node --test scripts/tests/critical-weather-observation.test.mjs
          node scripts/regression-weather-monitor-heartbeat-health.mjs
      - run: npm ci
      - name: Verify synthetic Home monitors in three timezones
        run: |
          for zone in UTC America/Sao_Paulo Pacific/Auckland; do
            TZ="$zone" node --test scripts/tests/operational-weather-flight.test.mjs
          done
      - name: Prepare production sources
        run: node scripts/v139/apply.mjs
      - name: Verify prepared monitor retains policy and authorization
        run: |
          node --check server.mjs
          node --test scripts/tests/critical-weather-observation.test.mjs
          node scripts/regression-weather-monitor-heartbeat-health.mjs
      - name: Verify prepared Home retains bounded weather monitors
        run: |
          for zone in UTC America/Sao_Paulo Pacific/Auckland; do
            TZ="$zone" node --test scripts/tests/operational-weather-flight.test.mjs
          done
      - name: Build exact-SHA client and verify actual Home weather behavior
        env:
          SOURCE_VERSION: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/p1-concierge-journey/compile.mjs
          npx tsc --noEmit
          npx vite build
          npm install --prefix "$RUNNER_TEMP/weather-flight-browser" --ignore-scripts --no-audit --no-fund playwright@1.55.0
          node "$RUNNER_TEMP/weather-flight-browser/node_modules/playwright/cli.js" install --with-deps chromium
          MENU_PLAYWRIGHT_PACKAGE="$RUNNER_TEMP/weather-flight-browser/package.json" node scripts/regression-operational-weather-browser.cjs
      - name: Save synthetic operational weather evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operational-weather-flight-${{ github.event.pull_request.head.sha }}
          path: artifacts/weather-flight
          if-no-files-found: ignore
