name: Weather observation alert policy

on:
  pull_request:
    branches: [main]
    paths:
      - 'server.mjs'
      - 'server/weather/**'
      - 'shared/weatherNoticeDetails.*'
      - 'shared/operational-weather-pulse.*'
      - 'shared/weather-observation-source-time.*'
      - 'shared/weather-station-overrides.*'
      - 'client/src/lib/operationalWeather*.ts'
      - 'client/src/lib/rosterStartup.ts'
      - 'client/src/lib/alertRosterOwnership.ts'
      - 'client/src/lib/notificationPreferences.ts'
      - 'scripts/tests/operational-weather-*.test.mjs'
      - 'scripts/tests/weather-source-time.test.mjs'
      - 'scripts/tests/weather-station-overrides.test.mjs'
      - 'scripts/tests/weather-api-provenance.test.mjs'
      - 'scripts/tests/weather-test-loader.mjs'
      - 'scripts/tests/weather-runtime-harness.mjs'
      - 'client/src/pages/Home.tsx'
      - 'client/src/components/pulse/**'
      - 'client/src/lib/alertReviewStore.ts'
      - 'scripts/tests/weather-notice-*.test.mjs'
      - 'scripts/tests/critical-weather-observation.test.mjs'
      - '.github/workflows/weather-observation-alert.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  weather-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Test tracked monitor and pure policy without network
        run: |
          node --check shared/weatherNoticeDetails.mjs
          node --test scripts/tests/weather-notice-details.test.mjs
          node --check server/weather/critical-observation.mjs
          node --check server.mjs
          node --test scripts/tests/critical-weather-observation.test.mjs
          node scripts/regression-weather-monitor-heartbeat-health.mjs
      - run: npm ci
      - name: Test tracked Home and real Pulse with synthetic device sinks
        run: |
          for TZ in UTC America/Sao_Paulo Pacific/Auckland; do
            export TZ
            node --test scripts/tests/operational-weather-*.test.mjs scripts/tests/weather-source-time.test.mjs scripts/tests/weather-station-overrides.test.mjs scripts/tests/weather-api-provenance.test.mjs scripts/tests/weather-notice-*.test.mjs
          done
      - name: Prepare production sources
        run: node scripts/v139/apply.mjs
      - name: Verify prepared monitor retains policy and authorization
        run: |
          for TZ in UTC America/Sao_Paulo Pacific/Auckland; do
            export TZ
            node --test scripts/tests/operational-weather-*.test.mjs scripts/tests/weather-source-time.test.mjs scripts/tests/weather-station-overrides.test.mjs scripts/tests/weather-api-provenance.test.mjs scripts/tests/weather-notice-*.test.mjs
          done
          node --check server.mjs
          node --test scripts/tests/critical-weather-observation.test.mjs
          node scripts/regression-weather-monitor-heartbeat-health.mjs
