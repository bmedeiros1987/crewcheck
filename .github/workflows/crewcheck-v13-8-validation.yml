name: CrewCheck web validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - agent/v14-premium-system-audit
      - agent/v14-0-1-telegram-voice-policy
      - agent/v14-0-2-google-oauth-legal
      - agent/v14-0-4-telegram-intents-grammar
      - agent/v14-0-6-smart-departure-login-finance-layout
      - agent/v14-0-7-premium-layout-audit
      - agent/v14-0-8-layout-structure-hotfix
      - agent/v14-0-9-layout-lock

permissions:
  contents: read

concurrency:
  group: crewcheck-web-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-server:
    name: Web, TypeScript and server
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - name: Prepare current CrewCheck sources
        run: node scripts/v139/apply.mjs 2>&1 | tee "$RUNNER_TEMP/crewcheck-prepare.log"
      - name: TypeScript check
        run: npx tsc --noEmit 2>&1 | tee "$RUNNER_TEMP/typescript.log"
      - name: Build web client
        run: npx vite build 2>&1 | tee "$RUNNER_TEMP/vite-build.log"
      - name: Validate aviation language and family concierge
        run: node scripts/regression-v14-3-14-aviation-family.mjs
      - name: Validate adaptive daily guide
        run: node scripts/regression-v14-3-15-daily-guide.mjs
      - name: Validate Guardian, Life, Telegram, visitor, support and Admin
        run: node scripts/regression-v14-3-16-control-center.mjs
      - name: Validate active-roster visitor scope
        run: node scripts/regression-v14-3-32-visitor-active-roster-scope.mjs
      - name: Validate official CrewRosterReport flight integrity
        run: node scripts/regression-v14-3-33-official-roster-flight-integrity.mjs 2>&1 | tee "$RUNNER_TEMP/official-roster-regression.log"
      - name: Validate theme, contrast and responsive layout
        run: node scripts/regression-v14-3-17-theme-layout.mjs
      - name: Validate structural layout and institutional menu
        run: node scripts/regression-v14-3-19-layout-structure.mjs
      - name: Validate Smart Departure and automatic client update
        run: node scripts/regression-v14-3-29-smart-departure-client-update.mjs
      - name: Validate canonical Smart Departure selection and route safety
        run: node scripts/regression-v14-3-31-smart-departure-canonical.mjs
      - name: Validate cache-first positioning flight search
        run: node scripts/regression-v14-3-34-positioning-radar-cache.mjs 2>&1 | tee "$RUNNER_TEMP/positioning-radar-regression.log"
      - name: Validate real Telegram location
        run: node scripts/regression-v14-3-35-telegram-real-location.mjs 2>&1 | tee "$RUNNER_TEMP/telegram-location-regression.log"
      - name: Validate Concierge personality and voice safety
        run: node scripts/regression-v14-3-36-concierge-personality-voice.mjs 2>&1 | tee "$RUNNER_TEMP/concierge-personality-regression.log"
      - name: Validate FlyDeck, grouped navigation and canonical brand
        run: node scripts/regression-v14-3-37-flydeck-navigation-brand.mjs 2>&1 | tee "$RUNNER_TEMP/flydeck-navigation-regression.log"
      - name: Validate roster history and departure layout audit
        run: node scripts/regression-v14-3-38-roster-history-layout-audit.mjs 2>&1 | tee "$RUNNER_TEMP/roster-history-layout-regression.log"
      - name: Validate chronological roster history UI
        run: node scripts/regression-v14-3-39-history-chronological-ui.mjs 2>&1 | tee "$RUNNER_TEMP/history-chronological-regression.log"
      - name: Test server
        run: node test-server.mjs
      - name: Upload web diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CrewCheck-web-diagnostics
          path: |
            ${{ runner.temp }}/crewcheck-prepare.log
            ${{ runner.temp }}/typescript.log
            ${{ runner.temp }}/vite-build.log
            ${{ runner.temp }}/official-roster-regression.log
            ${{ runner.temp }}/positioning-radar-regression.log
            ${{ runner.temp }}/telegram-location-regression.log
            ${{ runner.temp }}/concierge-personality-regression.log
            ${{ runner.temp }}/flydeck-navigation-regression.log
            ${{ runner.temp }}/roster-history-layout-regression.log
            ${{ runner.temp }}/history-chronological-regression.log
          if-no-files-found: ignore
          retention-days: 7
