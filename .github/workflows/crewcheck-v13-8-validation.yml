name: CrewCheck 13.8 validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/crewcheck-v13-8-platform]

permissions:
  contents: read

concurrency:
  group: crewcheck-13-8-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-server:
    name: Web, TypeScript and server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run regression:v13.8.0:platform
      - run: node test-server.mjs

  android:
    name: Android debug and release bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compile APK and unsigned AAB
        working-directory: android-wrapper
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease
