name: CrewCheck web validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - agent/v14-premium-system-audit
      - agent/v14-0-1-telegram-voice-policy
      - agent/v14-0-2-google-oauth-legal
      - agent/v14-0-4-telegram-intents-grammar
      - agent/v14-0-6-smart-departure-login-finance-layout
      - agent/v14-0-7-premium-layout-audit
      - agent/v14-0-8-layout-structure-hotfix
      - agent/v14-0-9-layout-lock

defaults:
  run:
    shell: bash -o pipefail {0}

permissions:
  contents: read

concurrency:
  group: crewcheck-web-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notification-mysql:
    name: Notification concurrency in disposable MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Start existing MySQL QA pattern without network or published ports
        run: |
          mkdir -p /tmp/crewcheck-notification-qa-socket
          docker run --detach --rm --name crewcheck-notification-qa --network none --mount type=bind,source=/tmp/crewcheck-notification-qa-socket,target=/var/run/mysqld --env MYSQL_ALLOW_EMPTY_PASSWORD=yes --env MYSQL_DATABASE=crewcheck_notification_qa mysql:8.4
          for attempt in $(seq 1 60); do
            if docker logs crewcheck-notification-qa 2>&1 | grep -q 'MySQL init process done' && docker exec crewcheck-notification-qa mysql --database=crewcheck_notification_qa --execute='SELECT 1'; then break; fi
            sleep 1
          done
          docker exec crewcheck-notification-qa mysql --database=crewcheck_notification_qa --execute='SELECT 1'
          docker exec crewcheck-notification-qa chmod 755 /var/run/mysqld
      - name: Test real SQL before and after canonical preparation
        env:
          CREWCHECK_NOTIFICATION_QA: isolated-mysql
          CREWCHECK_QA_MYSQL_SOCKET: /tmp/crewcheck-notification-qa-socket/mysqld.sock
        run: |
          node scripts/regression-free-day-held.mjs
          node scripts/regression-free-day-sources.mjs
          node scripts/regression-notification-mysql.mjs
          node scripts/regression-notification-scheduler-heartbeat-health.mjs
          node scripts/v139/apply.mjs
          node scripts/regression-free-day-held.mjs
          node scripts/regression-free-day-sources.mjs
          node scripts/regression-notification-mysql.mjs
          node scripts/regression-notification-scheduler-heartbeat-health.mjs
      - name: Remove disposable database
        if: always()
        run: docker stop crewcheck-notification-qa || true
  emergency-browser:
    name: SOS authenticated recovery browser fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install isolated browser test runner
        run: |
          npm install --prefix "$RUNNER_TEMP/emergency-browser" --ignore-scripts --no-audit --no-fund playwright@1.55.0
          node "$RUNNER_TEMP/emergency-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Test actual EmergencyCenter with fictional accounts before preparation
        env:
          MENU_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/emergency-browser/package.json
        run: |
          node scripts/regression-emergency-center-browser.mjs
          node scripts/regression-leave-confirmation-browser.mjs
          node scripts/regression-notification-readiness-browser.mjs
      - name: Prepare canonical application sources
        run: node scripts/v139/apply.mjs
      - name: Test actual EmergencyCenter after source preparation
        env:
          MENU_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/emergency-browser/package.json
        run: |
          node scripts/regression-emergency-center-browser.mjs
          node scripts/regression-leave-confirmation-browser.mjs
          node scripts/regression-notification-readiness-browser.mjs
          node scripts/regression-wakeup-session-browser.mjs
  web-and-server:
    name: Web, TypeScript and server
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate CI pipeline exit propagation
        run: node scripts/ci/check-workflow-pipefail.mjs
      - name: Validate notification safety with fictional recipients before preparation
        run: |
          node scripts/regression-bids-delivery.mjs
          node scripts/regression-bids-editing.mjs
          node scripts/regression-notification-job-safety.mjs
          node scripts/regression-free-day-held.mjs
          node scripts/regression-free-day-sources.mjs
          node scripts/regression-briefing-preferences.mjs
          node scripts/regression-browser-reminder-scheduling.mjs
      - name: Validate SOS intention and recovery with mocked Telegram
        run: node --experimental-vm-modules scripts/regression-emergency-intent.mjs
      - name: Validate source preparation cache invalidation
        run: node scripts/regression-source-preparation-cache.mjs
      - run: npm audit --omit=dev --audit-level=high
      - name: Prepare current CrewCheck sources
        run: node scripts/v139/apply.mjs 2>&1 | tee "$RUNNER_TEMP/crewcheck-prepare.log"
      - name: TypeScript check
        run: npx tsc --noEmit 2>&1 | tee "$RUNNER_TEMP/typescript.log"
      - name: Validate notification safety after source preparation
        run: |
          node scripts/regression-bids-delivery.mjs
          node scripts/regression-bids-editing.mjs
          node scripts/regression-notification-job-safety.mjs
          node scripts/regression-free-day-held.mjs
          node scripts/regression-free-day-sources.mjs
          node scripts/regression-briefing-preferences.mjs
          node scripts/regression-browser-reminder-scheduling.mjs
      - name: Validate account roster startup and concurrent explicit choices
        run: |
          node scripts/regression-roster-startup-state.mjs
          node scripts/regression-roster-choice-settlement.mjs
          node scripts/regression-roster-history-strict.mjs
          node scripts/regression-roster-two-tab-bootstrap.mjs
          node scripts/regression-v14-3-82-active-roster-bootstrap.mjs
          node scripts/regression-home-standby-departure.mjs
          node scripts/regression-p1-ownerless-legacy-history-fail-closed.mjs
          node scripts/regression-p1-offline-history-identity-scope.mjs
          node scripts/regression-active-roster-runtime.mjs
          node scripts/regression-roster-contract-forward-compatibility.mjs
          node scripts/regression-roster-followup-guards.mjs
          node scripts/regression-roster-auth-storage.mjs
          node scripts/regression-transit-availability.mjs
          node scripts/regression-transit-availability-ui.mjs
          node scripts/regression-transit-review-blockers.mjs
      - name: Build web client
        run: npx vite build 2>&1 | tee "$RUNNER_TEMP/vite-build.log"
      - name: Validate SOS after source preparation
        run: node --experimental-vm-modules scripts/regression-emergency-intent.mjs
      - name: Smoke configured Render build and start without credentials or egress
        run: node scripts/ci/smoke-render-build-start.mjs
      - name: Validate aviation language and family concierge
        run: node scripts/regression-v14-3-14-aviation-family.mjs
      - name: Validate adaptive daily guide
        run: node scripts/regression-v14-3-15-daily-guide.mjs
      - name: Validate Guardian, Life, Telegram, visitor, support and Admin
        run: node scripts/regression-v14-3-16-control-center.mjs
      - name: Validate active-roster visitor scope
        run: node scripts/regression-v14-3-32-visitor-active-roster-scope.mjs
      - name: Validate official CrewRosterReport flight integrity
        run: node scripts/regression-v14-3-33-official-roster-flight-integrity.mjs 2>&1 | tee "$RUNNER_TEMP/official-roster-regression.log"
      - name: Validate theme, contrast and responsive layout
        run: node scripts/regression-v14-3-17-theme-layout.mjs
      - name: Validate structural layout and institutional menu
        run: node scripts/regression-v14-3-19-layout-structure.mjs
      - name: Validate Smart Departure and automatic client update
        run: node scripts/regression-v14-3-29-smart-departure-client-update.mjs
      - name: Validate canonical Smart Departure selection and route safety
        run: node scripts/regression-v14-3-31-smart-departure-canonical.mjs
      - name: Validate cache-first positioning flight search
        run: node scripts/regression-v14-3-34-positioning-radar-cache.mjs 2>&1 | tee "$RUNNER_TEMP/positioning-radar-regression.log"
      - name: Validate real Telegram location
        run: node scripts/regression-v14-3-35-telegram-real-location.mjs 2>&1 | tee "$RUNNER_TEMP/telegram-location-regression.log"
      - name: Validate Concierge personality and voice safety
        run: node scripts/regression-v14-3-36-concierge-personality-voice.mjs 2>&1 | tee "$RUNNER_TEMP/concierge-personality-regression.log"
      - name: Validate FlyDeck, grouped navigation and canonical brand
        run: node scripts/regression-v14-3-37-flydeck-navigation-brand.mjs 2>&1 | tee "$RUNNER_TEMP/flydeck-navigation-regression.log"
      - name: Validate roster history and departure layout audit
        run: node scripts/regression-v14-3-38-roster-history-layout-audit.mjs 2>&1 | tee "$RUNNER_TEMP/roster-history-layout-regression.log"
      - name: Validate chronological roster history UI
        run: node scripts/regression-v14-3-39-history-chronological-ui.mjs 2>&1 | tee "$RUNNER_TEMP/history-chronological-regression.log"
      - name: Validate permissive import, rotated Jasper and canonical logo
        run: node scripts/regression-v14-3-40-import-permissive-brand.mjs 2>&1 | tee "$RUNNER_TEMP/import-brand-regression.log"
      - name: Validate semantic Concierge and short conversational context
        run: node scripts/regression-v14-3-41-concierge-semantic-context.mjs 2>&1 | tee "$RUNNER_TEMP/concierge-semantic-regression.log"
      - name: Audit every existing functional surface
        run: node scripts/audit-functional-surface.mjs --strict --write 2>&1 | tee "$RUNNER_TEMP/functional-surface-audit.log"
      - name: Validate #568 navigation ownership and 5S inventory
        run: node scripts/regression-p1-568-navigation-inventory.mjs
      - name: Validate Google Maps monthly budget and TomTom fallback
        run: node scripts/regression-v14-3-42-google-maps-budget-fallback.mjs 2>&1 | tee "$RUNNER_TEMP/google-maps-budget-regression.log"
      - name: Validate iPad premium layout, location and reload stability
        run: node scripts/regression-v14-3-43-ipad-premium-layout-location-stability.mjs 2>&1 | tee "$RUNNER_TEMP/ipad-premium-stability-regression.log"
      - name: Validate menu icons, Settings location and end-positioned search
        run: node scripts/regression-v14-3-44-menu-location-search.mjs 2>&1 | tee "$RUNNER_TEMP/menu-location-search-regression.log"
      - name: Validate August CrewRoster offsets, MCK and continuity
        run: node scripts/regression-v14-3-45-august-roster-continuity.mjs 2>&1 | tee "$RUNNER_TEMP/august-roster-continuity-regression.log"
      - name: Validate August Jasper orientation and baseline
        run: node scripts/regression-v14-3-45-august-roster-orientation.mjs 2>&1 | tee "$RUNNER_TEMP/august-roster-orientation-regression.log"
      - name: Validate fresh Web, Android and Telegram location
        run: node scripts/regression-v14-3-46-fresh-location.mjs 2>&1 | tee "$RUNNER_TEMP/fresh-location-regression.log"
      - name: Validate Smart Departure operational airport handoff
        run: node scripts/regression-v14-3-47-smart-departure-operational-airport.mjs 2>&1 | tee "$RUNNER_TEMP/smart-departure-operational-airport-regression.log"
      - name: Validate separate ElevenLabs voices for Daniel and Bruno
        run: node scripts/regression-v14-3-48-elevenlabs-dual-voice.mjs 2>&1 | tee "$RUNNER_TEMP/elevenlabs-dual-voice-regression.log"
      - name: Menu premium (ordem, grupos e ícones)
        run: node scripts/regression-p1-menu-premium.mjs 2>&1 | tee "$RUNNER_TEMP/menu-premium-regression.log"
      - name: Compile canonical Concierge server artifact
        run: node scripts/p1-concierge-journey/compile.mjs
      - name: Test server
        run: node test-server.mjs
      - name: Publish functional audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CrewCheck-functional-audit
          path: |
            ${{ runner.temp }}/functional-surface-audit.log
            ${{ runner.temp }}/crewcheck-functional-audit
          if-no-files-found: warn
          retention-days: 14
      - name: Upload web diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CrewCheck-web-diagnostics
          path: |
            ${{ runner.temp }}/crewcheck-prepare.log
            ${{ runner.temp }}/typescript.log
            ${{ runner.temp }}/vite-build.log
            ${{ runner.temp }}/official-roster-regression.log
            ${{ runner.temp }}/positioning-radar-regression.log
            ${{ runner.temp }}/telegram-location-regression.log
            ${{ runner.temp }}/concierge-personality-regression.log
            ${{ runner.temp }}/flydeck-navigation-regression.log
            ${{ runner.temp }}/roster-history-layout-regression.log
            ${{ runner.temp }}/history-chronological-regression.log
            ${{ runner.temp }}/import-brand-regression.log
            ${{ runner.temp }}/concierge-semantic-regression.log
            ${{ runner.temp }}/functional-surface-audit.log
            ${{ runner.temp }}/crewcheck-functional-audit
            ${{ runner.temp }}/google-maps-budget-regression.log
            ${{ runner.temp }}/ipad-premium-stability-regression.log
            ${{ runner.temp }}/menu-location-search-regression.log
            ${{ runner.temp }}/august-roster-continuity-regression.log
            ${{ runner.temp }}/august-roster-orientation-regression.log
            ${{ runner.temp }}/fresh-location-regression.log
            ${{ runner.temp }}/smart-departure-operational-airport-regression.log
            ${{ runner.temp }}/elevenlabs-dual-voice-regression.log
          if-no-files-found: ignore
          retention-days: 7
