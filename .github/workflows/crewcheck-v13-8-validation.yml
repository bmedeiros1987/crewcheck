name: CrewCheck v14.0.6 validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - agent/v14-premium-system-audit
      - agent/v14-0-1-telegram-voice-policy
      - agent/v14-0-2-google-oauth-legal
      - agent/v14-0-4-telegram-intents-grammar
      - agent/v14-0-6-smart-departure-login-finance-layout

permissions:
  contents: read

concurrency:
  group: crewcheck-v14-0-6-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-server:
    name: Web, TypeScript and server
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm run build
      - run: node scripts/v139/apply.mjs
      - run: node scripts/regression-v13-9-1-launch.mjs
      - run: npm run regression:v13.9.2:telegram-atis-regulation
      - run: npm run regression:v13.9.4:telegram-layout-amil
      - run: npm run regression:v13.9.5:medical-emergency
      - run: npm run regression:v13.8.0:platform
      - run: node scripts/regression-v14-0-1-telegram-voice-policy.mjs
      - run: node scripts/regression-v14-0-2-google-oauth-legal.mjs
      - run: node scripts/regression-v14-0-3-telegram-human-concierge.mjs
      - run: node scripts/regression-v14-0-4-telegram-language.mjs
      - run: node scripts/regression-v14-0-5-google-calendar-cloud-identity.mjs
      - run: node scripts/regression-v14-0-6-smart-departure-login-finance-layout.mjs
      - run: node test-server.mjs

  android:
    name: Android signed release bundle
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_SOURCE: ${{ secrets.CREWCHECK_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 || secrets.KEYSTORE_FILE_BASE64 || secrets.SIGNING_KEY || secrets.CREWCHECK_STORE_FILE || vars.CREWCHECK_KEYSTORE_BASE64 || vars.ANDROID_KEYSTORE_BASE64 || vars.KEYSTORE_BASE64 }}
      CREWCHECK_STORE_FILE: ${{ github.workspace }}/android-wrapper/crewcheck-release.jks
      CREWCHECK_STORE_PASSWORD: ${{ secrets.CREWCHECK_STORE_PASSWORD || secrets.ANDROID_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.KEY_STORE_PASSWORD || secrets.SIGNING_STORE_PASSWORD || vars.CREWCHECK_STORE_PASSWORD }}
      CREWCHECK_KEY_ALIAS: ${{ secrets.CREWCHECK_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS || secrets.ALIAS || vars.CREWCHECK_KEY_ALIAS }}
      CREWCHECK_KEY_PASSWORD: ${{ secrets.CREWCHECK_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD || vars.CREWCHECK_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Apply CrewCheck v14.0.6 source safeguards
        run: node scripts/v139/apply.mjs
      - name: Prepare protected upload keystore
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${KEYSTORE_SOURCE:-}" ]] || missing+=("keystore base64")
          [[ -n "${CREWCHECK_STORE_PASSWORD:-}" ]] || missing+=("store password")
          [[ -n "${CREWCHECK_KEY_ALIAS:-}" ]] || missing+=("key alias")
          [[ -n "${CREWCHECK_KEY_PASSWORD:-}" ]] || missing+=("key password")
          if (( ${#missing[@]} )); then
            printf '::error::Configuração de assinatura ausente: %s\n' "$(IFS=', '; echo "${missing[*]}")"
            exit 1
          fi
          encoded="${KEYSTORE_SOURCE#base64:}"
          printf '%s' "$encoded" | tr -d '\r\n ' | base64 --decode > "$CREWCHECK_STORE_FILE"
          chmod 600 "$CREWCHECK_STORE_FILE"
          keytool -list -keystore "$CREWCHECK_STORE_FILE" -storepass "$CREWCHECK_STORE_PASSWORD" -alias "$CREWCHECK_KEY_ALIAS" >/dev/null
      - name: Compile APK and signed AAB
        working-directory: android-wrapper
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease
      - name: Verify AAB signature
        shell: bash
        run: |
          set -euo pipefail
          source_aab="android-wrapper/app/build/outputs/bundle/release/app-release.aab"
          test -s "$source_aab"
          set +e
          jarsigner -verify -strict -certs "$source_aab" > "$RUNNER_TEMP/jarsigner-verification.txt" 2>&1
          verify_status=$?
          set -e
          if [[ "$verify_status" -ne 0 && "$verify_status" -ne 4 ]]; then
            cat "$RUNNER_TEMP/jarsigner-verification.txt"
            exit "$verify_status"
          fi
          grep -Fqi "jar verified" "$RUNNER_TEMP/jarsigner-verification.txt"
          ! grep -Fqi "jar is unsigned" "$RUNNER_TEMP/jarsigner-verification.txt"
          unzip -t "$source_aab" >/dev/null
          cp "$source_aab" "$RUNNER_TEMP/CrewCheck-14.0.6-production.aab"
          (cd "$RUNNER_TEMP" && sha256sum CrewCheck-14.0.6-production.aab > CrewCheck-14.0.6-production.aab.sha256)
      - name: Package official brand assets
        shell: bash
        run: |
          cp client/public/icons/crewcheck-icon-v2.png "$RUNNER_TEMP/CrewCheck-Google-Play-512.png"
          cp client/public/icons/crewcheck-icon-v2.png "$RUNNER_TEMP/CrewCheck-PWA-512.png"
          cp client/public/icons/crewcheck-icon-v2.png "$RUNNER_TEMP/CrewCheck-Telegram-512.png"
          file "$RUNNER_TEMP/CrewCheck-Google-Play-512.png"
      - uses: actions/upload-artifact@v4
        with:
          name: CrewCheck-14.0.6-Smart-Departure-Premium-Layout
          path: |
            ${{ runner.temp }}/CrewCheck-14.0.6-production.aab
            ${{ runner.temp }}/CrewCheck-14.0.6-production.aab.sha256
            ${{ runner.temp }}/CrewCheck-Google-Play-512.png
            ${{ runner.temp }}/CrewCheck-PWA-512.png
            ${{ runner.temp }}/CrewCheck-Telegram-512.png
          if-no-files-found: error
          retention-days: 14
