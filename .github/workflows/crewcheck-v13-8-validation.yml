name: CrewCheck v13.9.5 validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - agent/v13-9-3-redemet-critical-weather
      - agent/v13-9-4-telegram-layout-amil-network
      - agent/v13-9-5-medical-emergency-care

permissions:
  contents: read

concurrency:
  group: crewcheck-13-9-5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-server:
    name: Web, TypeScript and server
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm run build
      - run: node scripts/regression-v13-9-1-launch.mjs
      - run: npm run regression:v13.9.2:telegram-atis-regulation
      - run: npm run regression:v13.9.3:redemet-weather
      - run: npm run regression:v13.9.4:telegram-layout-amil
      - run: npm run regression:v13.9.5:medical-emergency
      - run: npm run regression:v13.8.0:platform
      - run: npm run regression:v13.8.5:audit
      - run: npm run regression:v13.8.6:internal
      - run: npm run regression:v13.8.7:mysql
      - run: npm run regression:v13.8.8:audit
      - run: node test-server.mjs

  android:
    name: Android signed release bundle
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_SOURCE: ${{ secrets.CREWCHECK_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 || secrets.KEYSTORE_FILE_BASE64 || secrets.SIGNING_KEY || secrets.CREWCHECK_STORE_FILE || vars.CREWCHECK_KEYSTORE_BASE64 || vars.ANDROID_KEYSTORE_BASE64 || vars.KEYSTORE_BASE64 }}
      CREWCHECK_STORE_FILE: ${{ github.workspace }}/android-wrapper/crewcheck-release.jks
      CREWCHECK_STORE_PASSWORD: ${{ secrets.CREWCHECK_STORE_PASSWORD || secrets.ANDROID_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.KEY_STORE_PASSWORD || secrets.SIGNING_STORE_PASSWORD || vars.CREWCHECK_STORE_PASSWORD }}
      CREWCHECK_KEY_ALIAS: ${{ secrets.CREWCHECK_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS || secrets.ALIAS || vars.CREWCHECK_KEY_ALIAS }}
      CREWCHECK_KEY_PASSWORD: ${{ secrets.CREWCHECK_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD || vars.CREWCHECK_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Apply v13.9.5 source safeguards
        run: node scripts/v139/apply.mjs
      - name: Prepare protected upload keystore
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${KEYSTORE_SOURCE:-}" ]] || missing+=("keystore base64")
          [[ -n "${CREWCHECK_STORE_PASSWORD:-}" ]] || missing+=("store password")
          [[ -n "${CREWCHECK_KEY_ALIAS:-}" ]] || missing+=("key alias")
          [[ -n "${CREWCHECK_KEY_PASSWORD:-}" ]] || missing+=("key password")
          if (( ${#missing[@]} )); then
            printf '::error::Configuração de assinatura ausente: %s\n' "$(IFS=', '; echo "${missing[*]}")"
            exit 1
          fi
          encoded="${KEYSTORE_SOURCE#base64:}"
          if ! printf '%s' "$encoded" | tr -d '\r\n ' | base64 --decode > "$CREWCHECK_STORE_FILE"; then
            echo "::error::O keystore configurado não está em Base64 válido."
            exit 1
          fi
          chmod 600 "$CREWCHECK_STORE_FILE"
          keytool -list -keystore "$CREWCHECK_STORE_FILE" -storepass "$CREWCHECK_STORE_PASSWORD" -alias "$CREWCHECK_KEY_ALIAS" >/dev/null
      - name: Compile APK and signed AAB
        working-directory: android-wrapper
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease
      - name: Verify AAB signature
        shell: bash
        run: |
          set -euo pipefail
          source_aab="android-wrapper/app/build/outputs/bundle/release/app-release.aab"
          test -s "$source_aab"
          set +e
          jarsigner -verify -strict -certs "$source_aab" > "$RUNNER_TEMP/jarsigner-verification.txt" 2>&1
          verify_status=$?
          set -e
          if [[ "$verify_status" -ne 0 && "$verify_status" -ne 4 ]]; then
            cat "$RUNNER_TEMP/jarsigner-verification.txt"
            echo "::error::A assinatura do AAB é inválida ou o certificado não está válido."
            exit "$verify_status"
          fi
          grep -Fqi "jar verified" "$RUNNER_TEMP/jarsigner-verification.txt"
          ! grep -Fqi "jar is unsigned" "$RUNNER_TEMP/jarsigner-verification.txt"
          unzip -t "$source_aab" >/dev/null
          cp "$source_aab" "$RUNNER_TEMP/CrewCheck-13.9.5-production.aab"
          (cd "$RUNNER_TEMP" && sha256sum CrewCheck-13.9.5-production.aab > CrewCheck-13.9.5-production.aab.sha256)
      - name: Generate Google Play 512 icon from current site logo
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/ResizeCrewCheckIcon.java" <<'JAVA'
          import java.awt.Graphics2D;
          import java.awt.RenderingHints;
          import java.awt.image.BufferedImage;
          import java.io.File;
          import javax.imageio.ImageIO;
          public class ResizeCrewCheckIcon {
            public static void main(String[] args) throws Exception {
              BufferedImage source = ImageIO.read(new File(args[0]));
              BufferedImage target = new BufferedImage(512, 512, BufferedImage.TYPE_INT_ARGB);
              Graphics2D graphics = target.createGraphics();
              graphics.setRenderingHint(RenderingHints.KEY_INTERPOLATION, RenderingHints.VALUE_INTERPOLATION_BICUBIC);
              graphics.setRenderingHint(RenderingHints.KEY_RENDERING, RenderingHints.VALUE_RENDER_QUALITY);
              graphics.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON);
              graphics.drawImage(source, 0, 0, 512, 512, null);
              graphics.dispose();
              ImageIO.write(target, "png", new File(args[1]));
            }
          }
          JAVA
          javac "$RUNNER_TEMP/ResizeCrewCheckIcon.java"
          java -Djava.awt.headless=true -cp "$RUNNER_TEMP" ResizeCrewCheckIcon client/public/icons/crewcheck-icon-v2.png "$RUNNER_TEMP/CrewCheck-Google-Play-512.png"
          cp client/public/icons/crewcheck-icon-v2.png "$RUNNER_TEMP/CrewCheck-PWA-1024.png"
          file "$RUNNER_TEMP/CrewCheck-Google-Play-512.png"
      - uses: actions/upload-artifact@v4
        with:
          name: CrewCheck-13.9.5-Google-Play-and-brand
          path: |
            ${{ runner.temp }}/CrewCheck-13.9.5-production.aab
            ${{ runner.temp }}/CrewCheck-13.9.5-production.aab.sha256
            ${{ runner.temp }}/CrewCheck-Google-Play-512.png
            ${{ runner.temp }}/CrewCheck-PWA-1024.png
          if-no-files-found: error
          retention-days: 14
