name: Telegram operational briefing OFF
on:
  pull_request:
    paths:
      - 'scripts/ci/prefer-ubuntu-archive.py'
      - 'scripts/ci/test-prefer-ubuntu-archive.py'
      - 'scripts/ci/test-browser-mirror-coverage.py'
      - 'server/concierge/**'
      - 'server/notification-job-safety.mjs'
      - 'server/telegram-fast-ack.mjs'
      - 'server/v139/notificationStateDeletion.mjs'
      - 'scripts/p1-concierge-journey/**'
      - 'scripts/tests/*briefing*.mjs'
      - 'scripts/tests/telegram-operational-change.test.mjs'
      - 'scripts/regression-telegram-operational-change-mysql.mjs'
      - 'scripts/regression-telegram-briefing-mysql.mjs'
      - 'scripts/regression-operational-briefing-browser.mjs'
      - 'scripts/regression-briefing-concierge-composition.mjs'
      - 'client/src/components/notifications/**'
      - '.github/workflows/telegram-operational-briefing.yml'
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Compile current canonical engines and test raw source
        run: |
          node scripts/p1-concierge-journey/compile.mjs
          node --test scripts/tests/operational-briefing.test.mjs scripts/tests/telegram-operational-briefing.test.mjs scripts/tests/telegram-operational-change.test.mjs
          node scripts/regression-notification-job-safety.mjs
          node scripts/regression-notification-scheduler-heartbeat-health.mjs
          node scripts/regression-wakeup-call-delivery.mjs
          node scripts/regression-wakeup-spoken-program.mjs
          node scripts/regression-elevenlabs-call-deadlines.mjs
      - name: Start existing disposable notification QA pattern without network
        run: |
          mkdir -p /tmp/crewcheck-notification-qa-socket
          docker run --detach --rm --name crewcheck-briefing-qa --network none --mount type=bind,source=/tmp/crewcheck-notification-qa-socket,target=/var/run/mysqld --env MYSQL_ALLOW_EMPTY_PASSWORD=yes --env MYSQL_DATABASE=crewcheck_notification_qa mysql:8.4
          for attempt in $(seq 1 60); do
            if docker logs crewcheck-briefing-qa 2>&1 | grep -q 'MySQL init process done' && docker exec crewcheck-briefing-qa mysql --database=crewcheck_notification_qa --execute='SELECT 1'; then break; fi
            sleep 1
          done
          docker exec crewcheck-briefing-qa mysql --database=crewcheck_notification_qa --execute='SELECT 1'
          docker exec crewcheck-briefing-qa chmod 755 /var/run/mysqld
      - name: Counterproof old consistent source read under REPEATABLE READ
        run: |
          cp server/concierge/telegram-briefing.mjs "$RUNNER_TEMP/telegram-briefing-current.mjs"
          trap 'cp "$RUNNER_TEMP/telegram-briefing-current.mjs" server/concierge/telegram-briefing.mjs' EXIT
          python3 - <<'PYCODE'
          from pathlib import Path
          path = Path('server/concierge/telegram-briefing.mjs')
          text = path.read_text()
          assert 'includeInternal: true, lockSource: true' in text
          path.write_text(text.replace('includeInternal: true, lockSource: true', 'includeInternal: true, lockSource: false'))
          PYCODE
          set +e
          node scripts/regression-telegram-briefing-mysql.mjs > "$RUNNER_TEMP/briefing-old-snapshot.log" 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          grep 'STALE_SOURCE_RACE: committed source revision must cancel' "$RUNNER_TEMP/briefing-old-snapshot.log"
        env:
          CREWCHECK_NOTIFICATION_QA: isolated-mysql
          CREWCHECK_QA_MYSQL_SOCKET: /tmp/crewcheck-notification-qa-socket/mysqld.sock
      - name: Operational change stale-reader counterproof (isolated database only)
        run: |
          set +e
          node scripts/regression-telegram-operational-change-mysql.mjs > "$RUNNER_TEMP/change-old-snapshot.log" 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          grep 'CHANGE_STALE_SOURCE_RACE: current read must cancel committed revision' "$RUNNER_TEMP/change-old-snapshot.log"
        env:
          CREWCHECK_NOTIFICATION_QA: isolated-mysql
          CREWCHECK_QA_MYSQL_SOCKET: /tmp/crewcheck-notification-qa-socket/mysqld.sock
          CREWCHECK_QA_OLD_CHANGE_SOURCE_READ: '1'
      - name: Real SQL consent, competing claims and uncertain outcome
        run: |
          node scripts/regression-telegram-briefing-mysql.mjs
          node scripts/regression-telegram-operational-change-mysql.mjs
        env:
          CREWCHECK_NOTIFICATION_QA: isolated-mysql
          CREWCHECK_QA_MYSQL_SOCKET: /tmp/crewcheck-notification-qa-socket/mysqld.sock
      - name: Read-only pinned Concierge lifecycle source for composition
        uses: actions/checkout@v6
        with:
          ref: 661d27318ff6146e358492422f3249b424c318cf
          path: .ci-concierge-1203
          persist-credentials: false
      # Keep the runner's signed Ubuntu HTTPS fallbacks; avoid degraded Azure APT.
      - name: Prefer Ubuntu archive for browser system dependencies
        run: |
          python3 scripts/ci/test-prefer-ubuntu-archive.py
          python3 scripts/ci/test-browser-mirror-coverage.py
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            python3 scripts/ci/prefer-ubuntu-archive.py /etc/apt/apt-mirrors.txt > "$RUNNER_TEMP/browser-apt-mirrors.txt"
            sudo install -m 644 "$RUNNER_TEMP/browser-apt-mirrors.txt" /etc/apt/apt-mirrors.txt
          fi
      - name: Existing isolated browser fixture pattern
        run: |
          npm install --prefix "$RUNNER_TEMP/briefing-browser" --ignore-scripts --no-audit --no-fund playwright@1.55.0
          node "$RUNNER_TEMP/briefing-browser/node_modules/playwright/cli.js" install --with-deps chromium
          node scripts/regression-operational-briefing-browser.mjs
          node scripts/regression-briefing-concierge-composition.mjs
        env:
          MENU_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/briefing-browser/package.json
          CREWCHECK_CONCIERGE_COMPOSITION_SOURCE: ${{ github.workspace }}/.ci-concierge-1203
      - name: Canonical preparation and existing safeguards
        run: |
          node scripts/v139/apply.mjs
          node scripts/p1-concierge-journey/compile.mjs
          node --test scripts/tests/operational-briefing.test.mjs scripts/tests/telegram-operational-briefing.test.mjs scripts/tests/telegram-operational-change.test.mjs
          node scripts/regression-notification-job-safety.mjs
          node scripts/regression-notification-scheduler-heartbeat-health.mjs
          node scripts/regression-wakeup-call-delivery.mjs
          node scripts/regression-wakeup-spoken-program.mjs --prepared
          node scripts/regression-elevenlabs-call-deadlines.mjs
          node scripts/regression-telegram-briefing-mysql.mjs
          node scripts/regression-telegram-operational-change-mysql.mjs
          node scripts/regression-operational-briefing-browser.mjs
          node scripts/regression-briefing-concierge-composition.mjs
        env:
          MENU_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/briefing-browser/package.json
          CREWCHECK_CONCIERGE_COMPOSITION_SOURCE: ${{ github.workspace }}/.ci-concierge-1203
          CREWCHECK_NOTIFICATION_QA: isolated-mysql
          CREWCHECK_QA_MYSQL_SOCKET: /tmp/crewcheck-notification-qa-socket/mysqld.sock
      - name: Remove only disposable fixture container
        if: always()
        run: docker rm -f crewcheck-briefing-qa || true
