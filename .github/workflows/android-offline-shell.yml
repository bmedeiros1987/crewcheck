name: CrewCheck Android bundled shell

on:
  pull_request:
    paths:
      - 'android-wrapper/**'
      - 'client/**'
      - 'scripts/v139/**'
      - 'scripts/v14373/**'
      - 'scripts/regression-v14-3-73-android-bundled-shell.mjs'
      - '.github/workflows/android-offline-shell.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-bundled-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'

      - name: Apply Android bundled shell slice
        run: node scripts/v14373/apply.mjs

      - name: Validate Android bundled shell contract
        run: node scripts/regression-v14-3-73-android-bundled-shell.mjs
