name: CrewCheck Android Auto Lab

on:
  workflow_dispatch:
  push:
    branches:
      - feat/android-auto-foundation
    paths:
      - 'android-wrapper/auto/**'
      - 'android-wrapper/settings.gradle'
      - '.github/workflows/crewcheck-android-auto-lab.yml'
  pull_request:
    paths:
      - 'android-wrapper/auto/**'
      - 'android-wrapper/settings.gradle'
      - '.github/workflows/crewcheck-android-auto-lab.yml'

jobs:
  build-auto-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Build CrewCheck Drive Lab
        run: gradle -p android-wrapper --no-daemon --console=plain :auto:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: crewcheck-drive-lab-debug
          path: android-wrapper/auto/build/outputs/apk/debug/auto-debug.apk
          if-no-files-found: error
