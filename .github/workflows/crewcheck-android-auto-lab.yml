name: CrewCheck Android Auto Lab

on:
  workflow_dispatch:
  push:
    branches:
      - feat/android-auto-foundation
    paths:
      - 'android-wrapper/auto/**'
      - 'android-wrapper/settings.gradle'
      - '.github/workflows/crewcheck-android-auto-lab.yml'
  pull_request:
    paths:
      - 'android-wrapper/auto/**'
      - 'android-wrapper/settings.gradle'
      - '.github/workflows/crewcheck-android-auto-lab.yml'

jobs:
  build-auto-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build CrewCheck Drive Lab
        working-directory: android-wrapper
        run: |
          chmod +x gradlew
          ./gradlew :auto:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: crewcheck-drive-lab-debug
          path: android-wrapper/auto/build/outputs/apk/debug/auto-debug.apk
          if-no-files-found: error
