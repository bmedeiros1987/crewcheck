name: MyCrewCare v3 persistent session

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      # Discovery is broad; the auditor retains an exact allowlist.
      - '**/*[mM][yY][cC][rR][eE][wW][cC][aA][rR][eE]*'
      - '**/*[mM][yY][cC][rR][eE][wW][cC][aA][rR][eE]*/**'
      - 'scripts/ci/mcc-comparison.mjs'
      - 'scripts/regression-mcc-comparison.mjs'
      - 'shared/myCrewCareLogistics*'
      - 'shared/myCrewCarePersistentSession*'
      - 'shared/myCrewCareSyncPolicy*'
      - 'shared/myCrewCareNativeAdapter*'
      - 'shared/myCrewCareController*'
      - 'shared/myCrewCareObservedContract*'
      - 'shared/myCrewCareObservedCoordinator*'
      - 'scripts/regression-mycrewcare-observed-coordinator.mjs'
      - 'scripts/regression-mycrewcare-observed.mjs'
      - 'scripts/fixtures/mycrewcare-observed/**'
      - 'scripts/regression-mycrewcare-native-observation.mjs'
      - 'scripts/regression-mycrewcare-webview-source.mjs'
      - 'scripts/build-mycrewcare-observed-asset.mjs'
      - 'scripts/fixtures/mycrewcare-native/**'
      - 'docs/mycrewcare-observed-contract-off.md'
      - 'client/src/components/mycrewcare/**'
      - 'client/src/hooks/useMyCrewCareV3.ts'
      - 'client/src/lib/myCrewCareV3Runtime.ts'
      - 'scripts/regression-mycrewcare-controller.mjs'
      - 'client/src/lib/myCrewCareV3.ts'
      - 'android-wrapper/app/src/debug/**'
      - 'scripts/regression-mycrewcare-debug-action.mjs'
      - 'scripts/assert-mycrewcare-debug-release.mjs'
      - 'docs/mycrewcare-debug-test-off.md'
      - 'android-wrapper/app/build.gradle'
      - 'android-wrapper/app/src/main/assets/mycrewcare-transport-v3.js'
      - 'android-wrapper/app/src/main/java/com/crewcheck/app/CrewCheckMyCrewCareProfile.java'
      - 'android-wrapper/app/src/main/java/com/crewcheck/app/CrewCheckMyCrewCareSecureStore.java'
      - 'android-wrapper/app/src/main/java/com/crewcheck/app/CrewCheckMyCrewCarePortalV3.java'
      - 'android-wrapper/app/src/main/java/com/crewcheck/app/CrewCheckMyCrewCareObservedWebViewSource.java'
      - 'android-wrapper/app/src/main/java/com/crewcheck/app/CrewCheckMyCrewCareRuntimeV3.java'
      - 'docs/mycrewcare-concierge-wake-handoff-off.md'
      - 'docs/mycrewcare-partial-hotel-review-off.md'
      - 'docs/mycrewcare-snapshot-monotonic-review-off.md'
      - 'docs/mycrewcare-sso-contract-inactive.md'
      - 'scripts/fixtures/mycrewcare-sso-contract/AndroidManifest.synthetic.xml'
      - 'scripts/fixtures/mycrewcare-sso-contract/CrewCheckMyCrewCareSsoDraft.java'
      - 'scripts/fixtures/mycrewcare-sso-contract/RedirectInstrumentation.java'
      - 'scripts/fixtures/mycrewcare-sso-contract/SsoDraftHarness.java'
      - 'scripts/fixtures/mycrewcare-sso-contract/debug-inactive.patch'
      - 'scripts/regression-mycrewcare-consumer-boundary.mjs'
      - 'scripts/regression-mycrewcare-partial-hotel.mjs'
      - 'scripts/regression-mycrewcare-snapshot-monotonic.mjs'
      - 'scripts/regression-mycrewcare-sso-draft.mjs'
      - 'scripts/regression-mycrewcare-ownership-paths.mjs'
      - 'docs/mycrewcare-ci-composition-review-off.md'
      - 'scripts/regression-mycrewcare-v3.mjs'
      - 'scripts/assert-mycrewcare-v3-ownership.mjs'
      - 'docs/mycrewcare-v3-persistent-session.md'
      - '.github/workflows/mycrewcare-v3-persistence.yml'
  workflow_dispatch:
    inputs:
      base_sha:
        description: 'Immutable comparison base commit (full SHA)'
        required: true
        type: string
      head_sha:
        description: 'Immutable checked main commit (full SHA)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Resolve immutable MCC comparison (fail closed)
        run: node scripts/ci/mcc-comparison.mjs
      - run: npm ci
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Isolated synthetic DOM test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/mycrewcare-dom" --no-package-lock --ignore-scripts jsdom@22.1.0
          echo "WAKEUP_JSDOM_PACKAGE=$RUNNER_TEMP/mycrewcare-dom/package.json" >> "$GITHUB_ENV"
      - name: Focused contracts before canonical preparation
        run: |
          node scripts/assert-mycrewcare-v3-ownership.mjs
          node --test scripts/regression-mcc-comparison.mjs
          for zone in UTC America/Sao_Paulo Pacific/Auckland; do
            TZ="$zone" node --test scripts/regression-mycrewcare-v3.mjs scripts/regression-mycrewcare-controller.mjs
            TZ="$zone" node --test scripts/regression-mycrewcare-consumer-boundary.mjs scripts/regression-mycrewcare-partial-hotel.mjs scripts/regression-mycrewcare-snapshot-monotonic.mjs scripts/regression-mycrewcare-sso-draft.mjs scripts/regression-mycrewcare-session-lab.mjs scripts/regression-mycrewcare-ownership-paths.mjs
            TZ="$zone" node --test scripts/regression-mycrewcare-observed.mjs scripts/regression-mycrewcare-observed-coordinator.mjs scripts/regression-mycrewcare-native-observation.mjs scripts/regression-mycrewcare-webview-source.mjs scripts/regression-mycrewcare-debug-action.mjs
          done
      - name: Complete canonical preparation
        run: node scripts/v139/apply.mjs
      - name: Focused contracts after canonical preparation
        run: |
          node scripts/assert-mycrewcare-v3-ownership.mjs
          node --test scripts/regression-mcc-comparison.mjs
          for zone in UTC America/Sao_Paulo Pacific/Auckland; do
            TZ="$zone" node --test scripts/regression-mycrewcare-v3.mjs scripts/regression-mycrewcare-controller.mjs
            TZ="$zone" node --test scripts/regression-mycrewcare-consumer-boundary.mjs scripts/regression-mycrewcare-partial-hotel.mjs scripts/regression-mycrewcare-snapshot-monotonic.mjs scripts/regression-mycrewcare-sso-draft.mjs scripts/regression-mycrewcare-session-lab.mjs scripts/regression-mycrewcare-ownership-paths.mjs
            TZ="$zone" node --test scripts/regression-mycrewcare-observed.mjs scripts/regression-mycrewcare-observed-coordinator.mjs scripts/regression-mycrewcare-native-observation.mjs scripts/regression-mycrewcare-webview-source.mjs scripts/regression-mycrewcare-debug-action.mjs
          done
          node scripts/regression-p0-525-stay-physical-association.mjs
          node scripts/regression-p1-566-stay-wakeup-concierge-context.mjs
          node scripts/regression-concierge-stay-menu.mjs
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Web build
        run: npx vite build
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Android debug and release compilation only (no user APK)
        run: gradle -p android-wrapper --no-daemon --console=plain :app:compileDebugJavaWithJavac :app:compileReleaseJavaWithJavac :app:processDebugManifest :app:processReleaseManifest
      - name: Verify debug action absent from compiled release
        run: node scripts/assert-mycrewcare-debug-release.mjs --compiled
      - name: Compile isolated synthetic real-Profile lab (no APK or device execution)
        run: gradle -p scripts/fixtures/mycrewcare-sso-contract --no-daemon --console=plain compileDebugJavaWithJavac processDebugManifest

  synthetic-instrumentation:
    name: Synthetic Android WebView (not real login)
    needs: validate
    # Standard public-repository runner only; no larger/self-hosted/paid device runner.
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Existing isolation and KVM only (fail closed; no host changes)
        run: bash scripts/fixtures/mycrewcare-sso-contract/run-instrumentation.sh preflight
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - name: Disposable loopback-only real WebView and Profile assertions
        run: bash scripts/fixtures/mycrewcare-sso-contract/run-instrumentation.sh run
