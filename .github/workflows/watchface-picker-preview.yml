name: Watch Face picker previews
on:
  pull_request:
    paths:
      - 'android-wrapper/watchface/**'
      - 'scripts/regression-watchface*'
      - '.github/workflows/watchface-picker-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: watchface-picker-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  preview-resources:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Generate and verify source previews
        run: |
          java -Djava.awt.headless=true android-wrapper/watchface/tools/PreviewGenerator.java android-wrapper/watchface/src/main/res "$RUNNER_TEMP/preview-before" artifacts/watchface-previews/before
      - run: npm ci
      - name: Prepare sources once
        run: node scripts/v139/apply.mjs
      - name: Generate prepared previews and protect existing contracts
        run: |
          java -Djava.awt.headless=true android-wrapper/watchface/tools/PreviewGenerator.java android-wrapper/watchface/src/main/res "$RUNNER_TEMP/preview-after" artifacts/watchface-previews/after
          diff -r "$RUNNER_TEMP/preview-before" "$RUNNER_TEMP/preview-after"
          node scripts/regression-watchface-premium-layout.mjs
          node scripts/regression-crewwatch-premium-consolidated.mjs
          grep -F "apply from: file('preview-assets.gradle')" android-wrapper/watchface/build.gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build resource-only Watch Face
        run: gradle --no-daemon --console=plain -p android-wrapper :watchface:assembleDebug
      - name: Verify packaged previews, metadata and absence of executable code
        run: |
          python3 - <<'PY'
          import struct, zipfile
          from pathlib import Path
          path = Path('android-wrapper/watchface/build/outputs/apk/debug/watchface-debug.apk')
          with zipfile.ZipFile(path) as apk:
              names = apk.namelist()
              assert not any(n.endswith(('.dex', '.class', '.java')) for n in names), 'WFF must remain resource-only'
              assert 'res/xml/watch_face_info.xml' in names, 'Picker metadata not packaged'
              for style in ('signature', 'flightdeck', 'minimal'):
                  matches = [n for n in names if n.endswith('/crewcheck_preview_' + style + '.png')]
                  assert len(matches) == 1, (style, matches)
                  data = apk.read(matches[0])
                  assert data[:8] == b'\x89PNG\r\n\x1a\n'
                  assert struct.unpack('>II', data[16:24]) == (360, 360)
              print('PASS: three PNG resources + picker metadata; zero executable code')
          PY
          AAPT2="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)"
          "$AAPT2" dump xmltree --file res/xml/watch_face_info.xml android-wrapper/watchface/build/outputs/apk/debug/watchface-debug.apk > artifacts/watchface-previews/packaged-metadata.txt
          grep -F 'Preview' artifacts/watchface-previews/packaged-metadata.txt
          grep -F 'Editable' artifacts/watchface-previews/packaged-metadata.txt
          git rev-parse HEAD > artifacts/watchface-previews/TESTED_COMMIT.txt
      - name: Save technical gallery and packaging evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: watchface-picker-previews-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/watchface-previews
          if-no-files-found: error
          retention-days: 7
