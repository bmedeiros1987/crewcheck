name: Watch Face picker previews
on:
  pull_request:
    paths:
      - 'android-wrapper/watchface/**'
      - 'scripts/regression-watchface*'
      - '.github/workflows/watchface-picker-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: watchface-picker-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  preview-resources:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Generate and verify source previews
        run: |
          java -Djava.awt.headless=true android-wrapper/watchface/tools/PreviewGenerator.java android-wrapper/watchface/src/main/res "$RUNNER_TEMP/preview-before" artifacts/watchface-previews/before
      - run: npm ci
      - name: Prepare sources once
        run: node scripts/v139/apply.mjs
      - name: Generate prepared previews and protect existing contracts
        run: |
          java -Djava.awt.headless=true android-wrapper/watchface/tools/PreviewGenerator.java android-wrapper/watchface/src/main/res "$RUNNER_TEMP/preview-after" artifacts/watchface-previews/after
          diff -r "$RUNNER_TEMP/preview-before" "$RUNNER_TEMP/preview-after"
          node scripts/regression-watchface-premium-layout.mjs
          node scripts/regression-crewwatch-premium-consolidated.mjs
          grep -F "apply from: file('preview-assets.gradle')" android-wrapper/watchface/build.gradle
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build Watch Face debug and resource-only release
        run: gradle --no-daemon --console=plain -p android-wrapper :watchface:assembleDebug :watchface:assembleRelease
      - name: Verify packaged preview references and release has no executable code
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, struct, subprocess, zipfile
          from pathlib import Path
          out = Path('artifacts/watchface-previews')
          module = Path('android-wrapper/watchface')
          aapt2 = Path(os.environ['ANDROID_HOME']) / 'build-tools/35.0.0/aapt2'
          def dump(apk, *args):
              return subprocess.check_output([str(aapt2), 'dump', *args, str(apk)], text=True)
          def dex_classes(data):
              assert data[:4] == b'dex\n' and len(data) >= 112, 'Unexpected DEX header'
              u32 = lambda offset: struct.unpack_from('<I', data, offset)[0]
              strings_offset, types_offset = u32(60), u32(68)
              count, offset = u32(96), u32(100)
              result = []
              for index in range(count):
                  type_index = u32(offset + 32 * index)
                  string_index = u32(types_offset + 4 * type_index)
                  start = u32(strings_offset + 4 * string_index)
                  while data[start] & 128: start += 1
                  start += 1
                  result.append(data[start:data.index(b'\x00', start)].decode('utf-8'))
              return result
          # Inspect the debug DEX rather than mistaking AGP's generated R classes for
          # app logic. No custom class is allowed here; release below permits NO DEX.
          debug = module / 'build/outputs/apk/debug/watchface-debug.apk'
          with zipfile.ZipFile(debug) as apk:
              debug_classes = [name for entry in apk.namelist() if entry.endswith('.dex') for name in dex_classes(apk.read(entry))]
              (out / 'debug-classes.json').write_text(json.dumps(debug_classes, indent=2))
              print('Debug DEX classes:', debug_classes)
              assert all(re.fullmatch(r'Lcom/crewcheck/face/R(?:\$[A-Za-z0-9_]+)?;', name) for name in debug_classes), 'Custom executable class in debug face'
          candidates = list((module / 'build/outputs/apk/release').glob('*.apk'))
          assert len(candidates) == 1, candidates
          release = candidates[0]
          table = dump(release, 'resources')
          (out / 'release-resources.txt').write_text(table)
          manifest = dump(release, 'xmltree', '--file', 'AndroidManifest.xml')
          (out / 'release-manifest.txt').write_text(manifest)
          assert re.search(r'android:hasCode[^\n]*(?:false|0x0(?:\s|$))', manifest), 'Release must declare hasCode=false'
          def resource(kind, name):
              pattern = r'(?m)^\s*resource\s+(0x[0-9a-fA-F]+)\s+(?:[^\s:]+:)?' + re.escape(kind + '/' + name) + r'(?=\s|$)'
              match = re.search(pattern, table)
              assert match, 'Missing compiled resource ' + kind + '/' + name
              tail = table[match.end():]
              next_resource = re.search(r'(?m)^\s*resource\s+0x', tail)
              block = tail[:next_resource.start()] if next_resource else tail
              path = re.search(r'(?:\(file\)\s+)?(res/[^\s\"\)]+)', block)
              assert path, 'Missing file for ' + name
              return match.group(1), path.group(1)
          previews = {}
          with zipfile.ZipFile(release) as apk:
              names = apk.namelist()
              assert not any(n.endswith(('.dex', '.class', '.java', '.so')) for n in names), 'Release WFF must contain zero executable code'
              _, info_path = resource('xml', 'watch_face_info')
              assert info_path in names
              info = dump(release, 'xmltree', '--file', info_path)
              (out / 'packaged-metadata.txt').write_text(info)
              assert 'Editable' in info and 'MultipleInstancesAllowed' in info
              for style in ('signature', 'flightdeck', 'minimal'):
                  resource_id, file_path = resource('drawable', 'crewcheck_preview_' + style)
                  data = apk.read(file_path)
                  assert data[:8] == b'\x89PNG\r\n\x1a\n'
                  assert struct.unpack('>II', data[16:24]) == (360, 360)
                  if style == 'signature':
                      preview_block = re.search(r'(?s)E: Preview.*?(?=\n\s*E:|\Z)', info)
                      assert preview_block and resource_id.lower() in preview_block.group().lower(), 'Picker must reference Signature drawable'
                  previews[style] = {'resource_id': resource_id, 'path': file_path, 'sha256': hashlib.sha256(data).hexdigest()}
              assert len({v['sha256'] for v in previews.values()}) == 3, 'Distinct style previews required'
          (out / 'packaging.json').write_text(json.dumps({'release_apk_sha256': hashlib.sha256(release.read_bytes()).hexdigest(), 'release_executable_files': 0, 'debug_generated_classes': debug_classes, 'previews': previews}, indent=2))
          print('PASS: compiled metadata references Signature; three PNGs; release hasCode=false and zero executable files')
          PY
          git rev-parse HEAD > artifacts/watchface-previews/TESTED_COMMIT.txt
      - name: Stage APKs only if packaging investigation is required
        if: failure()
        run: |
          mkdir -p artifacts/watchface-previews/diagnostics
          find android-wrapper/watchface/build/outputs/apk -name '*.apk' -exec cp {} artifacts/watchface-previews/diagnostics/ \; || true
      - name: Save technical gallery and packaging evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: watchface-picker-previews-${{ github.event.pull_request.head.sha || github.sha }}
          path: artifacts/watchface-previews
          if-no-files-found: error
          retention-days: 7
