name: Concierge roster sync receipt
on:
  pull_request:
    paths:
      - 'server.mjs'
      - 'client/src/pages/Home.tsx'
      - 'scripts/regression-concierge-roster-sync*'
      - '.github/workflows/concierge-roster-sync.yml'
permissions:
  contents: read
jobs:
  receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.3'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/regression-concierge-roster-sync.mjs
      - run: npm run build
      - run: node scripts/regression-concierge-roster-sync.mjs
      - run: npx tsc --noEmit
      - run: npm install --prefix "$RUNNER_TEMP/concierge-browser" --no-audit --no-fund --ignore-scripts playwright@1.55.0
      - run: "$RUNNER_TEMP/concierge-browser/node_modules/.bin/playwright install --with-deps chromium"
      - run: node scripts/regression-concierge-roster-sync-browser.cjs
        env:
          MENU_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/concierge-browser/package.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SYNTHETIC-concierge-roster-sync
          path: artifacts/SYNTHETIC-concierge-roster-sync/
          if-no-files-found: warn
          retention-days: 7
