name: CrewCheck v14.3.68 Android share import

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'android-wrapper/**'
      - 'client/**'
      - 'scripts/v14365/**'
      - 'scripts/v14368/**'
      - 'scripts/regression-v14-3-68-android-share-import.mjs'
      - '.github/workflows/v14368-android-share-import.yml'

permissions:
  contents: read

jobs:
  validate-shared-pdf-import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci || npm install
      - name: Prepare canonical CrewCheck source
        run: node scripts/v139/apply.mjs
      - name: Validate Android share bridge and canonical import
        run: node scripts/regression-v14-3-68-android-share-import.mjs
      - name: TypeScript check
        run: npx tsc --noEmit
