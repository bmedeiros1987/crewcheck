name: CrewCheck shared PDF import

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'android-wrapper/**'
      - 'client/**'
      - 'scripts/v14365/**'
      - 'scripts/v14368/**'
      - 'scripts/p0-shared-pdf-durable/**'
      - 'scripts/p0-build-identity/**'
      - 'scripts/regression-v14-3-68-android-share-import.mjs'
      - 'scripts/regression-p0-pwa-share-target-pdf.mjs'
      - '.github/workflows/v14368-android-share-import.yml'

permissions:
  contents: read

jobs:
  validate-shared-pdf-import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci || npm install
      - name: Prepare canonical CrewCheck source
        run: node scripts/v139/apply.mjs
      - name: Validate Android durable inbox and canonical import
        run: node scripts/regression-v14-3-68-android-share-import.mjs
      - name: Validate PWA durable share target and ACK
        run: node scripts/regression-p0-pwa-share-target-pdf.mjs
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Compile Android mobile shell
        run: gradle -p android-wrapper --no-daemon --console=plain :app:assembleDebug --stacktrace
