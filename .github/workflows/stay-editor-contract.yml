name: Stay editor hotel APZ contract
on:
  pull_request:
    paths:
      - 'shared/stay-edit-plan.*'
      - 'shared/stay-editor-store.*'
      - 'shared/stay-alarm-adapter.*'
      - 'scripts/stay-editor/**'
      - 'scripts/v139/apply.mjs'
      - 'client/src/lib/stayEditorStore.ts'
      - 'client/src/lib/stayEditorNavigation.ts'
      - 'client/src/components/v1391/PresentationStayManagerView.tsx'
      - 'client/src/components/v1391/StayHotelAlarmPreview.tsx'
      - 'client/src/components/v1391/stay-editor.css'
      - 'client/src/components/v139/Shell.tsx'
      - 'scripts/regression-stay-edit*.mjs'
      - '.github/workflows/stay-editor-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Pure contracts in three timezones
        run: |
          TZ=UTC node --test scripts/regression-stay-edit-plan.mjs
          TZ=America/Sao_Paulo node --test scripts/regression-stay-edit-plan.mjs
          TZ=Pacific/Auckland node --test scripts/regression-stay-edit-plan.mjs
      - run: node --test scripts/regression-stay-editor-persistence.mjs
      - run: npm run check
      - run: npm run build
      - name: Install isolated browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/stay-browser" --ignore-scripts --no-audit --no-fund playwright@1.55.0
          node "$RUNNER_TEMP/stay-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Prepared Home/editor QA, local persistence, no real alarms
        env:
          STAY_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/stay-browser/package.json
        run: node scripts/regression-stay-editor-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stay-editor-synthetic
          path: artifacts/stay-editor/
