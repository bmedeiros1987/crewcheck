name: CrewCheck Wellhub Concierge plan location

on:
  pull_request:
    paths:
      - 'server/v14335/concierge-location.mjs'
      - 'server/v14410/**'
      - 'server/v14338/**'
      - 'server/v14341/**'
      - 'scripts/p1-concierge-poi/**'
      - 'scripts/p1-concierge-stay-menu/**'
      - 'scripts/v14408/reply-wrapper.snippet'
      - 'scripts/v14338/reply-wrapper.snippet'
      - 'server/whatsapp.mjs'
      - 'server.mjs'
      - 'server/v14407/wellhub.mjs'
      - 'scripts/v14410/**'
      - 'scripts/v139/apply.mjs'
      - 'scripts/regression-v14-4-10-wellhub-concierge-plan-location.mjs'
      - 'scripts/regression-concierge-wellhub-plan-recognition.mjs'
      - 'scripts/regression-concierge-wellhub-conversation.mjs'
      - '.github/workflows/wellhub-concierge-v14410.yml'
  workflow_dispatch:

jobs:
  wellhub-concierge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax
        run: |
          node --check server/v14335/concierge-location.mjs
          node --check server/v14410/wellhub-concierge.mjs
          node --check scripts/v14410/apply.mjs
          node --check scripts/regression-v14-4-10-wellhub-concierge-plan-location.mjs
      - name: Wellhub plan regression before preparation
        run: node --test scripts/regression-concierge-wellhub-plan-recognition.mjs
      - name: Raw conversation sequence and channel entrypoints
        run: node --test scripts/regression-concierge-wellhub-conversation.mjs
      - run: npm ci
      - name: Build canonical production source
        run: npm run build
      - name: Materialized syntax
        run: |
          node --check server.mjs
          node --check server/whatsapp.mjs
      - name: Regression Silver+ geo fail-closed and WhatsApp
        run: node scripts/regression-v14-4-10-wellhub-concierge-plan-location.mjs
      - name: Wellhub plan regression after preparation
        run: node scripts/regression-concierge-wellhub-plan-recognition.mjs --materialized
      - name: Compiled conversation sequence and channel entrypoints
        run: node scripts/regression-concierge-wellhub-conversation.mjs --materialized
      - name: Preserve compiled routing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wellhub-compiled-routing
          path: |
            server.mjs
            server/whatsapp.mjs
      - name: Verify materialized server
        run: |
          grep -F "cc-v14410:concierge-gyms-plan-location" server.mjs
          ! grep -F "return conciergeGymsReply(snapshot);" server.mjs
          grep -F "isWellhubPlanPreferenceMessage(value)" server.mjs
          grep -F "filterWellhubPartnersForLocation(candidatePartners" server.mjs
          grep -F "source: 'whatsapp'" server.mjs
          grep -F "conciergeLocation: true" server/whatsapp.mjs
