name: TV packaged origin safety
on:
  pull_request:
    paths: ['server/tv/**','scripts/tv-browser-origins-test.mjs','.github/workflows/tv-browser-origins.yml']
permissions:
  contents: read
jobs:
  origins:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/tv-browser-origins-test.mjs
      - run: node scripts/tv-pilot-policy-test.mjs && node scripts/tv-pilot-config-test.mjs
      - run: node scripts/tv-test.mjs
