name: Temporary audited lockfile sync

on:
  push:
    branches:
      - chatgpt/580-nominal-competence-adjacency

permissions:
  contents: write

# Temporary one-shot helper; remove after package-lock.json is synchronized.
jobs:
  sync-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/580-nominal-competence-adjacency
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Regenerate lockfile only
        run: npm install --package-lock-only --ignore-scripts
      - name: Validate synchronized dependency graph
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
      - name: Commit lockfile only when changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync audited dependency lockfile"
          git push origin HEAD:chatgpt/580-nominal-competence-adjacency
