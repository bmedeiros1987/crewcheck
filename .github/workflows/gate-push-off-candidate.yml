name: Gate push OFF candidate
on:
  pull_request:
    paths:
      - 'server/web-push/**'
      - 'server/watch-authority/mysql-authority-producer.mjs'
      - 'scripts/regression-gate-host-off.mjs'
      - 'scripts/regression-gate-source-history.mjs'
      - 'server/gate-source-update.mjs'
      - 'shared/gate-query-day.mjs'
      - 'shared/crewcheckPushContract.mjs'
      - 'client/public/sw.js'
      - 'client/src/lib/crewcheckPush*.ts'
      - 'client/src/components/notifications/CrewCheckPushDevice.tsx'
      - 'scripts/regression-web-push-*.mjs'
      - 'client/public/crewcheck-push-offline.js'
      - 'client/public/crewcheck-gate-receiver-offline.js'
      - 'scripts/regression-gate-push-candidate.mjs'
      - 'scripts/regression-gate-push-mysql.mjs'
      - 'scripts/regression-gate-receiver-*.mjs'
      - 'docs/gate-push-off-candidate-20261021.md'
      - '.github/workflows/gate-push-off-candidate.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Source, producer, existing dispatcher and PWA receiver offline
        run: |
          node --check server/web-push/gateCandidate.mjs
          TZ=UTC node scripts/regression-gate-source-history.mjs
          TZ=America/Sao_Paulo node scripts/regression-gate-source-history.mjs
          TZ=Pacific/Auckland node scripts/regression-gate-source-history.mjs
          node scripts/regression-gate-host-off.mjs
          node scripts/regression-gate-push-candidate.mjs
          node scripts/regression-gate-receiver-fence.mjs
          node scripts/regression-web-push-offline.mjs
          node scripts/regression-web-push-cancellation-contract.mjs
          node scripts/regression-web-push-reconciliation.mjs
          node scripts/regression-web-push-lifecycle.mjs
          node scripts/regression-web-push-api.mjs
          node scripts/regression-web-push-provider.mjs
          node scripts/regression-web-push-permission.mjs
          node scripts/regression-web-push-user-gesture.mjs
      - name: Canonical preparation and repeat receiver/lifecycle checks
        run: |
          npm run prepare:v139
          TZ=UTC node scripts/regression-gate-source-history.mjs
          TZ=America/Sao_Paulo node scripts/regression-gate-source-history.mjs
          TZ=Pacific/Auckland node scripts/regression-gate-source-history.mjs
          node scripts/regression-gate-host-off.mjs
          node scripts/regression-gate-push-candidate.mjs
          node scripts/regression-gate-receiver-fence.mjs
          node scripts/regression-web-push-offline.mjs
          node scripts/regression-web-push-cancellation-contract.mjs
          node scripts/regression-web-push-reconciliation.mjs
          node scripts/regression-web-push-lifecycle.mjs
          node scripts/regression-web-push-api.mjs
          node scripts/regression-web-push-provider.mjs
          node scripts/regression-web-push-permission.mjs
          node scripts/regression-web-push-user-gesture.mjs
      - name: Install isolated browser
        run: |
          npm install --prefix "$RUNNER_TEMP/gate-browser" --ignore-scripts --no-audit --no-fund playwright@1.55.0
          node "$RUNNER_TEMP/gate-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Real IndexedDB and origin lock revocation fixture, display mocked
        env:
          GATE_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/gate-browser/package.json
          MENU_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/gate-browser/package.json
        run: |
          node scripts/regression-gate-receiver-browser.mjs
          node scripts/regression-web-push-shipping-worker.mjs
          node scripts/regression-web-push-device-browser.mjs

  isolated-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Start disposable MySQL without a network
        run: |
          mkdir -p /tmp/crewcheck-gate-sql-qa-ci
          docker run --detach --rm --name crewcheck-gate-sql-qa --network none --mount type=bind,source=/tmp/crewcheck-gate-sql-qa-ci,target=/var/run/mysqld --env MYSQL_ALLOW_EMPTY_PASSWORD=yes --env MYSQL_DATABASE=crewcheck_gate_push_qa mysql:8.4 --datadir=/var/run/mysqld/data
          for attempt in $(seq 1 90); do
            if docker logs crewcheck-gate-sql-qa 2>&1 | grep -q 'MySQL init process done' && docker exec crewcheck-gate-sql-qa mysql --socket=/var/run/mysqld/mysqld.sock -u root crewcheck_gate_push_qa -e 'SELECT 1'; then break; fi
            sleep 1
          done
          docker exec crewcheck-gate-sql-qa mysql --socket=/var/run/mysqld/mysqld.sock -u root crewcheck_gate_push_qa -e 'SELECT 1'
          docker exec crewcheck-gate-sql-qa chmod 755 /var/run/mysqld
      - name: Producer through real InnoDB, durable claims and revocable fixture authority
        env:
          CREWCHECK_GATE_QA: isolated-mysql
          CREWCHECK_GATE_QA_SOCKET: /tmp/crewcheck-gate-sql-qa-ci/mysqld.sock
        run: node scripts/regression-gate-push-mysql.mjs
      - name: Restart SQL engine and prove no resend
        run: |
          docker restart crewcheck-gate-sql-qa
          for attempt in $(seq 1 90); do
            if docker logs crewcheck-gate-sql-qa 2>&1 | grep -q 'MySQL init process done' && docker exec crewcheck-gate-sql-qa mysql --socket=/var/run/mysqld/mysqld.sock -u root crewcheck_gate_push_qa -e 'SELECT 1'; then break; fi
            sleep 1
          done
          docker exec crewcheck-gate-sql-qa mysql --socket=/var/run/mysqld/mysqld.sock -u root crewcheck_gate_push_qa -e 'SELECT 1'
      - name: Recreated producer after actual engine restart
        env:
          CREWCHECK_GATE_QA: isolated-mysql
          CREWCHECK_GATE_QA_SOCKET: /tmp/crewcheck-gate-sql-qa-ci/mysqld.sock
          CREWCHECK_GATE_QA_RESTART: verify
        run: node scripts/regression-gate-push-mysql.mjs
      - name: Remove disposable SQL
        if: always()
        run: docker rm --force crewcheck-gate-sql-qa || true
