name: Financial history foundation
on:
  pull_request:
    paths:
      - 'shared/financialReadModel.mjs'
      - 'client/src/lib/financialStatementLearning.ts'
      - 'scripts/regression-financial-*.mjs'
      - '.github/workflows/financial-history-foundation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-finance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/v139/apply.mjs
      - run: node scripts/regression-financial-read-model.mjs
      - run: node scripts/regression-financial-statement-totals.mjs
      - run: npx tsc --noEmit
      - run: npx vite build
