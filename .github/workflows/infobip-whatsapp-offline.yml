name: Infobip WhatsApp authenticated OFF candidate
on:
  pull_request:
    paths:
      - 'server/infobip-whatsapp-*.mjs'
      - 'scripts/regression-infobip-whatsapp-*.mjs'
      - 'scripts/regression-infobip-whatsapp-mysql-ci.sh'
      - 'scripts/infobip-whatsapp-mysql-scenarios.mjs'
      - 'scripts/fixtures/infobip-production-sql.mjs'
      - 'scripts/fixtures/infobip-operational-pilot.mjs'
      - 'scripts/fixtures/infobip-pilot-renewal-sql.mjs'
      - 'docs/infobip-whatsapp-production-composition.md'
      - 'docs/infobip-whatsapp-host-wiring.md'
      - 'docs/infobip-whatsapp-render-activation.md'
      - 'docs/infobip-whatsapp-operational-pilot.md'
      - 'scripts/p1-infobip-whatsapp-off/**'
      - 'server/whatsapp.mjs'
      - 'server/concierge-read-only-scope.mjs'
      - 'server/concierge-promotional-*.mjs'
      - 'server/concierge-shared-credit-candidate.mjs'
      - 'scripts/regression-infobip-promotional-caller.mjs'
      - 'server/concierge/operational-question.mjs'
      - 'server/concierge/stay-menu.mjs'
      - 'scripts/regression-concierge-operational-question.mjs'
      - 'scripts/v14410/apply.mjs'
      - 'docs/infobip-whatsapp-hmac-contract-20261021.md'
      - 'docs/infobip-whatsapp-events-20261023.md'
      - '.github/workflows/infobip-whatsapp-offline.yml'
permissions:
  contents: read
jobs:
  offline-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Raw authentication and signing vector, synthetic dependencies only
        run: |
          node scripts/regression-infobip-whatsapp-hmac.mjs
          node scripts/regression-infobip-whatsapp-candidate.mjs
          node scripts/regression-infobip-whatsapp-operational-pilot.mjs
          node scripts/regression-infobip-whatsapp-pilot-renewal.mjs
          node scripts/regression-concierge-operational-question.mjs
          node scripts/regression-infobip-whatsapp-quiescence.mjs
          node scripts/regression-infobip-whatsapp-production.mjs
          node scripts/regression-infobip-promotional-caller.mjs
          node scripts/regression-infobip-whatsapp-host.mjs
          node scripts/regression-infobip-whatsapp-render.mjs
          node scripts/regression-infobip-canonical-link.mjs
          node scripts/regression-infobip-whatsapp-canonical-lifecycle.mjs
      - name: Prepare existing canonical OFF wiring
        run: |
          node scripts/v139/apply.mjs
          node scripts/p1-concierge-journey/compile.mjs
      - name: Prepared authentication, persistence and sealed runtime
        run: |
          node scripts/regression-infobip-whatsapp-hmac.mjs
          node scripts/regression-infobip-whatsapp-persistence.mjs
          node scripts/regression-infobip-whatsapp-operational-pilot.mjs
          node scripts/regression-infobip-whatsapp-pilot-renewal.mjs
          node scripts/regression-concierge-operational-question.mjs --prepared
          node scripts/regression-infobip-whatsapp-quiescence.mjs
          node scripts/regression-infobip-whatsapp-production.mjs
          node scripts/regression-infobip-promotional-caller.mjs
          node scripts/regression-infobip-whatsapp-host.mjs
          node scripts/regression-infobip-whatsapp-render.mjs --prepared
          node scripts/regression-infobip-canonical-link.mjs --prepared
          node scripts/regression-infobip-whatsapp-canonical-lifecycle.mjs
          node scripts/regression-infobip-whatsapp-runtime.mjs

  isolated-mysql-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Owned MySQL 8.4 without network, concurrency and actual restart
        run: bash scripts/regression-infobip-whatsapp-mysql-ci.sh
