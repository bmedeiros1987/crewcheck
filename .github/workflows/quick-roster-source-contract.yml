name: Quick roster raw and prepared contract
on:
  pull_request:
    paths:
      - 'scripts/ci/prefer-ubuntu-archive.py'
      - 'scripts/ci/test-prefer-ubuntu-archive.py'
      - 'scripts/ci/test-browser-mirror-coverage.py'
      - 'client/src/lib/scheduleActivityClassification.ts'
      - 'client/src/components/v1391/HomeRosterPreview.tsx'
      - 'scripts/p0-691-care-context/**'
      - 'scripts/regression-quick-roster-care-source.mjs'
      - 'scripts/roster-startup/**'
      - 'scripts/regression-home-continuity-contract.mjs'
      - 'scripts/regression-home-history-session.mjs'
      - 'scripts/regression-saved-roster-retry-session.mjs'
      - 'scripts/regression-roster-list-session.mjs'
      - 'client/src/lib/databaseClient.ts'
      - 'scripts/regression-home-crossmonth-continuity.cjs'
      - 'scripts/regression-p0-multichannel-roster-gate.mjs'
      - 'scripts/regression-p0-530-adjacent-month-retention.mjs'
      - 'scripts/regression-p2-530-adjacent-fallback-finance.mjs'
      - '.github/workflows/quick-roster-source-contract.yml'
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Verify raw TypeScript and shared contract before preparation
        run: |
          node scripts/regression-roster-list-session.mjs
          npx tsc --noEmit
          node scripts/regression-quick-roster-care-source.mjs --record "$RUNNER_TEMP/care-raw.json"
          node scripts/regression-p1-303-schedule-classification-counts.mjs
          node scripts/regression-home-continuity-contract.mjs
      - run: SOURCE_VERSION=$(git rev-parse HEAD) npm run build
      - run: npm run check
      - name: Compare prepared contract and preserve formal authority
        run: |
          node scripts/regression-quick-roster-care-source.mjs --compare "$RUNNER_TEMP/care-raw.json"
          node scripts/regression-home-continuity-contract.mjs
          node scripts/regression-home-history-session.mjs
          node scripts/regression-saved-roster-retry-session.mjs
          node scripts/regression-roster-list-session.mjs
          node scripts/regression-p0-multichannel-roster-gate.mjs
          node scripts/regression-p0-530-adjacent-month-retention.mjs
          node scripts/regression-p2-530-adjacent-fallback-finance.mjs
          node scripts/regression-p1-303-schedule-classification-counts.mjs
          node scripts/p0-691-care-context/regression-formal-folga-authority.mjs
      # Keep the runner's signed Ubuntu HTTPS fallbacks; avoid degraded Azure APT.
      - name: Prefer Ubuntu archive for browser system dependencies
        run: |
          python3 scripts/ci/test-prefer-ubuntu-archive.py
          python3 scripts/ci/test-browser-mirror-coverage.py
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            python3 scripts/ci/prefer-ubuntu-archive.py /etc/apt/apt-mirrors.txt > "$RUNNER_TEMP/browser-apt-mirrors.txt"
            sudo install -m 644 "$RUNNER_TEMP/browser-apt-mirrors.txt" /etc/apt/apt-mirrors.txt
          fi
      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/cards-browser" --ignore-scripts --no-audit --no-fund playwright@1.55.0
          "$RUNNER_TEMP/cards-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify cards against actual prepared source and bundle
        env:
          MENU_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/cards-browser/package.json
          UI_EVIDENCE_REQUIRE_COMMIT: '1'
        run: node scripts/regression-quick-roster-cards-browser.mjs
      - name: Verify authenticated cross-month HOME continuity
        env:
          MENU_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/cards-browser/package.json
        run: node scripts/regression-home-crossmonth-continuity.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quick-roster-source-contract
          path: |
            artifacts/quick-roster-cards
            artifacts/home-crossmonth-continuity
