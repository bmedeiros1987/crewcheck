name: AwesomeAPI Shared Service

on:
  pull_request:
    paths:
      - 'server/shared/awesomeapi.mjs'
      - 'server/v139/index.mjs'
      - 'scripts/regression-awesomeapi-shared.mjs'
      - '.env.example'
      - '.github/workflows/awesomeapi-shared.yml'
  push:
    branches:
      - 'feat/shared-awesomeapi-services'
    paths:
      - 'server/shared/awesomeapi.mjs'
      - 'server/v139/index.mjs'
      - 'scripts/regression-awesomeapi-shared.mjs'
      - '.env.example'
      - '.github/workflows/awesomeapi-shared.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check shared service
        run: node --check server/shared/awesomeapi.mjs
      - name: Syntax check route index
        run: node --check server/v139/index.mjs
      - name: AwesomeAPI shared regression
        run: node scripts/regression-awesomeapi-shared.mjs
