name: CrewCheck Watch CrewLife main bridge

on:
  pull_request:
    paths:
      - 'android-wrapper/app/**'
      - 'client/src/lib/watchCrewLife.ts'
      - 'client/src/pages/Home.tsx'
      - 'client/src/components/v1434/CrewCheckLifeView.tsx'
      - 'scripts/regression-watch-crewlife-main.mjs'
      - '.github/workflows/watch-crewlife-main.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crewlife-watch-main:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Install web dependencies
        run: npm ci

      - name: Prepare canonical CrewCheck sources
        run: node scripts/v139/apply.mjs

      - name: Validate CrewLife watch contract
        run: node scripts/regression-watch-crewlife-main.mjs

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build web
        run: npx vite build

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: CrewLife publisher JVM tests
        run: gradle -p android-wrapper --no-daemon --console=plain :app:testDebugUnitTest

      - name: Compile Android companion
        run: gradle -p android-wrapper --no-daemon --console=plain :app:assembleDebug
