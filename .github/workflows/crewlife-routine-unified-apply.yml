name: CrewLife Routine Unified Apply

on:
  push:
    branches:
      - feat/crewlife-routine-unified-20260923
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Confirm regression is red before implementation
        shell: bash
        run: |
          if grep -q "Integrar minha Rotina ao CrewLife" client/src/components/v1434/CrewCheckLifeView.tsx; then
            echo "Implementation already present; skipping RED confirmation."
          else
            set +e
            node scripts/regression-crewlife-routine-unified.mjs
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              echo "Expected the new regression to fail before implementation, but it passed."
              exit 1
            fi
            echo "RED confirmed for the new CrewLife integration contract."
          fi

      - name: Apply CrewLife + Rotina implementation
        run: node scripts/apply-crewlife-routine-unified.mjs

      - name: Validate current CrewLife contracts
        run: |
          node scripts/regression-crewlife-routine-unified.mjs
          node scripts/regression-crewlife-samsung-companion.mjs

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Web build
        run: npx vite build

      - name: Scope guard
        shell: bash
        run: |
          changed="$(git diff --name-only)"
          echo "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -v -E '^(client/src/components/v1434/CrewCheckLifeView\.tsx|android-wrapper/app/src/main/java/com/crewcheck/app/MainActivity\.java)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected source changes detected:"
            echo "$unexpected"
            exit 1
          fi
          if printf '%s\n' "$changed" | grep -E -i '(parser|journey|compliance|finance|allowance|roster)' >/dev/null; then
            echo "Operational core scope violation."
            exit 1
          fi

      - name: Commit validated implementation
        shell: bash
        run: |
          git add client/src/components/v1434/CrewCheckLifeView.tsx android-wrapper/app/src/main/java/com/crewcheck/app/MainActivity.java
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 0
          fi
          git config user.name "crewcheck-ci"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat: unify CrewLife routine and Samsung connection UX"
          git push
