name: CrewCheck Watch first sync

on:
  pull_request:
    paths:
      - 'android-wrapper/app/**'
      - 'scripts/regression-watch-first-sync.mjs'
      - '.github/workflows/watch-first-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch-first-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_BASE64: ${{ secrets.CREWCHECK_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 || secrets.KEYSTORE_FILE_BASE64 || secrets.SIGNING_KEY }}
      STORE_PASSWORD: ${{ secrets.CREWCHECK_STORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || secrets.ANDROID_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.KEY_STORE_PASSWORD || secrets.SIGNING_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.CREWCHECK_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS || secrets.ALIAS }}
      KEY_PASSWORD: ${{ secrets.CREWCHECK_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD }}
      CREWCHECK_STORE_FILE: ${{ github.workspace }}/android-wrapper/crewcheck-release.jks
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Install web dependencies
        run: npm ci

      - name: Prepare CrewCheck sources
        run: node scripts/v139/apply.mjs

      - name: First sync regression
        run: node scripts/regression-watch-first-sync.mjs

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build web
        run: npx vite build

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Compile Android companion
        run: gradle -p android-wrapper --no-daemon --console=plain :app:assembleDebug

      - name: Validate signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64:-}"
          test -n "${STORE_PASSWORD:-}"
          test -n "${KEY_ALIAS:-}"
          test -n "${KEY_PASSWORD:-}"

      - name: Decode upload keystore
        shell: bash
        run: |
          set -euo pipefail
          encoded="${KEYSTORE_BASE64#base64:}"
          printf '%s' "$encoded" | tr -d '\r\n ' | base64 --decode > "$CREWCHECK_STORE_FILE"
          test -s "$CREWCHECK_STORE_FILE"
          chmod 600 "$CREWCHECK_STORE_FILE"
          keytool -list -keystore "$CREWCHECK_STORE_FILE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build signed mobile + watch AABs
        working-directory: android-wrapper
        env:
          CREWCHECK_STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          CREWCHECK_KEY_ALIAS: ${{ env.KEY_ALIAS }}
          CREWCHECK_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          gradle --no-daemon --console=plain             :app:assembleRelease             :app:bundleRelease             :wear:bundleRelease             :watchface:bundleRelease

      - name: Verify and stage signed AABs
        shell: bash
        run: |
          set -euo pipefail
          mobile_apk='android-wrapper/app/build/outputs/apk/release/app-release.apk'
          mobile_aab='android-wrapper/app/build/outputs/bundle/release/app-release.aab'
          watch_aab='android-wrapper/wear/build/outputs/bundle/release/wear-release.aab'
          face_aab='android-wrapper/watchface/build/outputs/bundle/release/watchface-release.aab'

          for file in "$mobile_apk" "$mobile_aab" "$watch_aab" "$face_aab"; do
            test -s "$file"
          done

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$mobile_apk"

          for aab in "$mobile_aab" "$watch_aab" "$face_aab"; do
            log="$RUNNER_TEMP/$(basename "$aab").verify.log"
            jarsigner -verify -verbose -certs "$aab" > "$log" 2>&1
            cat "$log"
            grep -Eq '^jar verified\\.$|^jar verified, with signer errors\\.$' "$log"
            ! grep -Fqi 'jar is unsigned' "$log"
          done

          out="$RUNNER_TEMP/crewcheck-watch-first-sync"
          mkdir -p "$out"
          cp "$mobile_aab" "$out/CrewCheck-Mobile-com.crewcheck.app-Play-Console.aab"
          cp "$watch_aab" "$out/CrewCheck-CrewWatch-com.crewcheck.app-Play-Console.aab"
          cp "$face_aab" "$out/CrewCheck-WatchFace-com.crewcheck.watch.app-Play-Console.aab"

          printf '%s\\n' \\
            'CrewCheck Mobile' \\
            '  package: com.crewcheck.app' \\
            '  file: CrewCheck-Mobile-com.crewcheck.app-Play-Console.aab' \\
            '' \\
            'CrewWatch Wear OS' \\
            '  package: com.crewcheck.app' \\
            '  file: CrewCheck-CrewWatch-com.crewcheck.app-Play-Console.aab' \\
            '' \\
            'CrewCheck Watch Face' \\
            '  package: com.crewcheck.watch.app' \\
            '  file: CrewCheck-WatchFace-com.crewcheck.watch.app-Play-Console.aab' \\
            > "$out/PACKAGE_MAP.txt"
          (cd "$out" && sha256sum *.aab > SHA256SUMS.txt)

      - name: Upload signed AABs
        uses: actions/upload-artifact@v4
        with:
          name: CrewCheck-Play-Console-AABs
          path: |
            ${{ runner.temp }}/crewcheck-watch-first-sync/*.aab
            ${{ runner.temp }}/crewcheck-watch-first-sync/PACKAGE_MAP.txt
            ${{ runner.temp }}/crewcheck-watch-first-sync/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
