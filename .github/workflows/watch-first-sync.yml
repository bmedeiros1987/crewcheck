name: CrewCheck Watch first sync

on:
  pull_request:
    paths:
      - 'android-wrapper/app/**'
      - 'scripts/regression-watch-first-sync.mjs'
      - '.github/workflows/watch-first-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch-first-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_BASE64: ${{ secrets.CREWCHECK_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 || secrets.KEYSTORE_FILE_BASE64 || secrets.SIGNING_KEY }}
      STORE_PASSWORD: ${{ secrets.CREWCHECK_STORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || secrets.ANDROID_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.KEY_STORE_PASSWORD || secrets.SIGNING_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.CREWCHECK_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS || secrets.ALIAS }}
      KEY_PASSWORD: ${{ secrets.CREWCHECK_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD }}
      CREWCHECK_STORE_FILE: ${{ github.workspace }}/android-wrapper/crewcheck-release.jks
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Install web dependencies
        run: npm ci

      - name: Prepare CrewCheck sources
        run: node scripts/v139/apply.mjs

      - name: First sync regression
        run: node scripts/regression-watch-first-sync.mjs

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build web
        run: npx vite build

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Compile Android companion
        run: gradle -p android-wrapper --no-daemon --console=plain :app:assembleDebug

      - name: Validate signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64:-}"
          test -n "${STORE_PASSWORD:-}"
          test -n "${KEY_ALIAS:-}"
          test -n "${KEY_PASSWORD:-}"

      - name: Decode upload keystore
        shell: bash
        run: |
          set -euo pipefail
          encoded="${KEYSTORE_BASE64#base64:}"
          {
            echo "CrewCheck Mobile"
            echo "  package: com.crewcheck.app"
            echo "  file: CrewCheck-Mobile-com.crewcheck.app-Play-Console.aab"
            echo
            echo "CrewWatch Wear OS"
            echo "  package: com.crewcheck.app"
            echo "  file: CrewCheck-CrewWatch-com.crewcheck.app-Play-Console.aab"
            echo
            echo "CrewCheck Watch Face"
            echo "  package: com.crewcheck.watch.app"
            echo "  file: CrewCheck-WatchFace-com.crewcheck.watch.app-Play-Console.aab"
          } > "$out/PACKAGE_MAP.txt"
          (cd "$out" && sha256sum *.aab > SHA256SUMS.txt)

      - name: Upload signed AABs
        uses: actions/upload-artifact@v4
        with:
          name: CrewCheck-Play-Console-AABs
          path: |
            ${{ runner.temp }}/crewcheck-watch-first-sync/*.aab
            ${{ runner.temp }}/crewcheck-watch-first-sync/PACKAGE_MAP.txt
            ${{ runner.temp }}/crewcheck-watch-first-sync/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
