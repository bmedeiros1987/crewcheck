name: TV premium context 0.2.1
on:
  pull_request:
    paths: ['apps/tv-player/**','packages/tv-core/**','server/tv/**','scripts/tv-*','.github/workflows/tv-premium-020.yml']
permissions:
  contents: read
concurrency:
  group: tv-premium-020-${{ github.ref }}
  cancel-in-progress: true
jobs:
  premium:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/tv-broadcast-prepare.mjs && node scripts/tv-broadcast-fit.mjs
      - run: node scripts/tv-pairing-prepare.mjs && node scripts/tv-pairing-prepare.mjs
      - run: node scripts/tv-premium-020-test.mjs && node scripts/tv-trusted-client-test.mjs
      - run: node scripts/tv-test.mjs && node scripts/tv-session-receive-time-test.mjs
      - run: node scripts/tv-brand-test.mjs && node scripts/tv-screen-care-test.mjs && node scripts/tv-screen-care-opt-out-test.mjs
      - run: node scripts/tv-channel-test.mjs && node scripts/tv-broadcast-test.mjs && node scripts/tv-broadcast-fit-test.mjs
      - run: node scripts/tv-pairing-test.mjs && npx tsc --noEmit -p tsconfig.tv.json
      - name: Stage premium pilot without private binaries
        env:
          TV_PILOT_API_ORIGIN: https://crewcheck-pr-698.onrender.com
        run: |
          node scripts/tv-broadcast-stage.mjs pilot
          node --input-type=module <<'JS'
          import {readFile,writeFile} from 'node:fs/promises';
          const p='dist/lg-webos/appinfo.json';
          const a=JSON.parse(await readFile(p,'utf8'));
          a.version='0.2.1';
          a.requiredACG=[];
          await writeFile(p,JSON.stringify(a,null,2));
          const m='dist/lg-webos/tv-build.json';
          const meta=JSON.parse(await readFile(m,'utf8'));
          meta.premiumContext020=true;
          meta.trustedPersonalTv=true;
          meta.weatherContexts=['base','next-stay-private'];
          meta.airlineVisual='roster-airline-or-published-flight-prefix';
          meta.postPairProgress=true;
          meta.audioPhysicalWebosHardened=true;
          meta.note='UNFINALIZED: attach owner brand and TV-compatible soundtrack locally, then package with official webOS CLI.';
          await writeFile(m,JSON.stringify(meta,null,2));
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: CrewCheck-TV-Premium-021-UNFINALIZED
          path: |
            dist/lg-webos
            apps/tv-player/src
            packages/tv-core/src
            scripts/tv-premium-020-test.mjs
            scripts/tv-pairing-*.mjs
            apps/tv-player/music-manifest.json
          if-no-files-found: error
          retention-days: 14
