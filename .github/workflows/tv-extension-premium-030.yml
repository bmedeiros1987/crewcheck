name: TV premium extension 0.3.0
on:
  pull_request:
    paths:
      - 'apps/tv-player/**'
      - 'packages/tv-core/**'
      - 'scripts/tv-extension-premium-030-test.mjs'
      - '.github/workflows/tv-extension-premium-030.yml'
permissions:
  contents: read
jobs:
  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/tv-extension-premium-030-test.mjs
      - run: node scripts/tv-test.mjs
      - run: node scripts/tv-broadcast-prepare.mjs && node scripts/tv-broadcast-fit.mjs
      - run: node scripts/tv-pairing-prepare.mjs && node scripts/tv-pairing-prepare.mjs
      - run: node scripts/tv-channel-test.mjs && node scripts/tv-broadcast-test.mjs && node scripts/tv-broadcast-fit-test.mjs
      - run: node scripts/tv-pairing-test.mjs && npx tsc --noEmit -p tsconfig.tv.json
