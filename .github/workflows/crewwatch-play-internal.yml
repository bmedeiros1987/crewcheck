name: CrewWatch → Play Internal

on:
  pull_request:
    paths:
      - 'android-wrapper/wear/**'
      - 'scripts/android-play/crewwatch_internal.py'
      - '.github/workflows/crewwatch-play-internal.yml'
      - 'scripts/regression-play-manual-publication-gates.mjs'
  push:
    branches: [main]
    paths:
      - 'android-wrapper/wear/**'
      - 'client/public/icons/crewcheck-icon-v2.png'
      - '.github/workflows/crewwatch-play-internal.yml'
      - 'scripts/regression-play-manual-publication-gates.mjs'
  workflow_dispatch:
    inputs:
      publish_internal:
        description: 'Publicar somente CrewWatch no teste interno da Play'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      wear_only: ${{ steps.scope.outputs.wear_only }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Detect whether this push is Wear-only
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "wear_only=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only HEAD^ HEAD > "$RUNNER_TEMP/crewcheck-changed-files.txt"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          changed = [line.strip() for line in Path(__import__('os').environ['RUNNER_TEMP'], 'crewcheck-changed-files.txt').read_text().splitlines() if line.strip()]
          blockers = (
              'android-wrapper/app/',
              'android-wrapper/watchface/',
              'android-wrapper/lifecompanion/',
              'client/',
              'scripts/',
          )
          shared = {
              'android-wrapper/build.gradle',
              'android-wrapper/gradle.properties',
              'android-wrapper/settings.gradle',
              'android-wrapper/store-policy.gradle',
              '.github/workflows/android.yml',
              'package.json',
              'package-lock.json',
          }
          def blocked(path):
              if path == 'client/public/icons/crewcheck-icon-v2.png':
                  return False
              if path == 'scripts/android-play/crewwatch_internal.py':
                  return False
              return path in shared or path.startswith(blockers)
          wear_only = bool(changed) and not any(blocked(path) for path in changed)
          print('wear_only=' + ('true' if wear_only else 'false'))
          print('changed_count=' + str(len(changed)))
          PY
      - name: Validate dedicated CrewWatch release policy
        run: |
          python3 scripts/android-play/crewwatch_internal.py self-test
          node scripts/regression-play-manual-publication-gates.mjs
      - name: Prepare canonical source
        run: node scripts/v139/apply.mjs
      - name: CrewWatch regression
        run: |
          node scripts/regression-crewwatch-premium-consolidated.mjs
          node scripts/regression-watch-first-sync.mjs
      - name: Wear tests and lint
        run: |
          gradle -p android-wrapper --no-daemon --console=plain             :wear:testDebugUnitTest :wear:lintDebug :wear:assembleDebug

  publish-wear-internal:
    needs: preflight
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish_internal
    concurrency:
      group: crewcheck-play-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KEYSTORE_BASE64: ${{ secrets.CREWCHECK_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.CREWCHECK_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.CREWCHECK_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.CREWCHECK_KEY_PASSWORD }}
      CREWCHECK_STORE_FILE: ${{ github.workspace }}/android-wrapper/crewcheck-release.jks
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Require existing Play and signing credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PLAY_SERVICE_ACCOUNT_JSON"
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Install Play API client
        run: python3 -m pip install 'google-auth==2.40.3' 'requests==2.32.4'

      - name: Allocate next live versionCode for CrewWatch only
        run: python3 scripts/android-play/crewwatch_internal.py allocate

      - name: Prepare canonical source with allocated Wear version
        run: node scripts/v139/apply.mjs

      - name: Re-run CrewWatch safety gates
        run: |
          python3 scripts/android-play/crewwatch_internal.py self-test
          node scripts/regression-crewwatch-premium-consolidated.mjs
          node scripts/regression-watch-first-sync.mjs

      - name: Restore existing signing key and derive expected certificate
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "${KEYSTORE_BASE64#base64:}" | tr -d '\r\n ' | base64 --decode > "$CREWCHECK_STORE_FILE"
          keytool -exportcert             -keystore "$CREWCHECK_STORE_FILE"             -storepass:env STORE_PASSWORD             -alias "$KEY_ALIAS"             -file "$RUNNER_TEMP/upload-cert.der"
          echo "EXPECTED_UPLOAD_CERT_SHA256=$(sha256sum "$RUNNER_TEMP/upload-cert.der" | cut -d ' ' -f1)" >> "$GITHUB_ENV"

      - name: Test, lint and build signed CrewWatch AAB only
        env:
          CREWCHECK_STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          CREWCHECK_KEY_ALIAS: ${{ env.KEY_ALIAS }}
          CREWCHECK_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          gradle -p android-wrapper --no-daemon --console=plain             :wear:testDebugUnitTest :wear:lintDebug :wear:bundleRelease

      - name: Download pinned bundletool
        run: |
          curl --fail --location --retry 3             https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar             -o "$RUNNER_TEMP/bundletool.jar"

      - name: Verify signed CrewWatch artifact and destination
        run: |
          python3 scripts/android-play/crewwatch_internal.py validate             --bundletool "$RUNNER_TEMP/bundletool.jar"             --output "$RUNNER_TEMP/crewwatch-play"

      - name: Preserve verified CrewWatch evidence
        uses: actions/upload-artifact@v4
        with:
          name: CrewWatch-Play-Internal-verified
          path: ${{ runner.temp }}/crewwatch-play/
          if-no-files-found: error
          retention-days: 30

      - name: Publish CrewWatch to Wear Internal Testing only
        run: python3 scripts/android-play/crewwatch_internal.py publish "$RUNNER_TEMP/crewwatch-play"

      - name: Remove temporary signing material
        if: always()
        run: rm -f "$CREWCHECK_STORE_FILE" "$RUNNER_TEMP/upload-cert.der"
