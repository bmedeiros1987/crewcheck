name: CrewCheck v13.9.1 diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Capture checks
        shell: bash
        run: |
          set +e
          npm run check > v1391-check.log 2>&1
          echo $? > v1391-check.exit
          npm run build > v1391-build.log 2>&1
          echo $? > v1391-build.exit
          node scripts/regression-v13-9-1-launch.mjs > v1391-regression.log 2>&1
          echo $? > v1391-regression.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: crewcheck-v1391-diagnostics
          path: |
            v1391-check.log
            v1391-check.exit
            v1391-build.log
            v1391-build.exit
            v1391-regression.log
            v1391-regression.exit
          if-no-files-found: error
          retention-days: 3
