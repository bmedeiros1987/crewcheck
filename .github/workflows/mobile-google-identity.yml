name: Mobile Google identity contract

# Stacked PR composition refresh: validate against current #857 merge-ref (2026-10-01).

on:
  pull_request:
    paths:
      - 'server/mobile/google-identity-oidc.mjs'
      - 'client/src/lib/googleIdentityAuth.ts'
      - 'client/src/lib/authClient.ts'
      - 'client/src/components/GoogleIdentityLinkCard.tsx'
      - 'client/src/pages/AuthPage.tsx'
      - 'client/src/pages/Home.tsx'
      - 'scripts/mobile-google-identity/**'
      - 'scripts/regression-mobile-google-identity.mjs'
      - 'scripts/v139/apply.mjs'
      - '.github/workflows/mobile-google-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  google-identity-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/v139/apply.mjs
      - run: node scripts/regression-mobile-google-identity.mjs
      - run: npx tsc --noEmit
