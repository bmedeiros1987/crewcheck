name: Mobile Google identity contract

# Stacked PR composition refresh: validate against current #857 merge-ref (2026-10-01).

on:
  pull_request:
    paths:
      - 'server/mobile/google-identity-oidc.mjs'
      - 'client/src/lib/googleIdentityAuth.ts'
      - 'client/src/lib/authClient.ts'
      - 'client/src/components/GoogleIdentityLinkCard.tsx'
      - 'client/src/pages/AuthPage.tsx'
      - 'client/src/pages/Home.tsx'
      - 'scripts/mobile-google-identity/**'
      - 'scripts/regression-mobile-google-identity.mjs'
      - 'scripts/regression-google-identity-lifecycle.mjs'
      - 'scripts/regression-google-identity-innodb.mjs'
      - 'scripts/regression-google-identity-browser.mjs'
      - 'scripts/regression-google-identity-client-continuity.mjs'
      - 'server/v139/auth.mjs'
      - 'scripts/v139/apply.mjs'
      - '.github/workflows/mobile-google-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  google-identity-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node scripts/v139/apply.mjs
      - run: node scripts/regression-mobile-google-identity.mjs
      - run: node scripts/regression-google-identity-lifecycle.mjs
      - run: node scripts/regression-google-identity-client-continuity.mjs
      - run: node scripts/regression-google-calendar-session-fence.mjs
      - name: Install isolated browser runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/google-identity-browser" --ignore-scripts --no-audit --no-fund playwright@1.55.0
          node "$RUNNER_TEMP/google-identity-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Real browser PWA and Android bridge fixtures without provider grants
        env:
          MENU_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/google-identity-browser/package.json
        run: node scripts/regression-google-identity-browser.mjs
      - run: npx tsc --noEmit

  google-identity-innodb:
    name: Google identity concurrency in disposable InnoDB
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CREWCHECK_GOOGLE_INNODB_QA: github-disposable-mysql
      CREWCHECK_QA_MYSQL_SOCKET: /tmp/crewcheck-google-identity-qa-socket/mysqld.sock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Start disposable MySQL without network or published ports
        run: |
          mkdir -p /tmp/crewcheck-google-identity-qa-socket
          docker run --detach --rm --name crewcheck-google-identity-qa --network none --mount type=bind,source=/tmp/crewcheck-google-identity-qa-socket,target=/var/run/mysqld --env MYSQL_ALLOW_EMPTY_PASSWORD=yes --env MYSQL_DATABASE=crewcheck_google_identity_qa mysql:8.4
          for attempt in $(seq 1 60); do
            if docker logs crewcheck-google-identity-qa 2>&1 | grep -q 'MySQL init process done' && docker exec crewcheck-google-identity-qa mysql --database=crewcheck_google_identity_qa --execute='SELECT 1'; then break; fi
            sleep 1
          done
          docker exec crewcheck-google-identity-qa mysql --database=crewcheck_google_identity_qa --execute='SELECT 1'
          docker exec crewcheck-google-identity-qa chmod 755 /var/run/mysqld
      - run: node scripts/regression-google-identity-innodb.mjs
      - run: node scripts/v139/apply.mjs
      - run: node scripts/regression-google-identity-innodb.mjs
      - name: Remove disposable MySQL
        if: always()
        run: docker rm --force crewcheck-google-identity-qa || true
