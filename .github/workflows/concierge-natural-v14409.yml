name: CrewCheck Concierge natural v14.4.09

on:
  pull_request:
  push:
    branches:
      - main
      - codex/concierge-natural-v14409

jobs:
  concierge-natural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
