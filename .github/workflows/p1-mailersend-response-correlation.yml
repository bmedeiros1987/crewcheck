name: P-1 MailerSend response correlation

on:
  pull_request:
    paths:
      - 'scripts/v14382/apply.mjs'
      - 'scripts/regression-p1-mailersend-response-correlation.mjs'
      - '.github/workflows/p1-mailersend-response-correlation.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/regression-p1-mailersend-response-correlation.mjs
      - run: node --check server/v139/delivery.mjs
