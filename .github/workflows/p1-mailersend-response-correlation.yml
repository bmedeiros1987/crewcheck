name: P-1 MailerSend response correlation

on:
  pull_request:
    paths:
      - 'scripts/v14382/apply.mjs'
      - 'shared/crewcheckEmailIdentity.*'
      - 'client/src/pages/AdminPartnerAccountsPage.tsx'
      - 'scripts/regression-partner-institutional-preview.mjs'
      - 'server/v139/delivery.mjs'
      - 'server/v1410/partnerAccounts.mjs'
      - 'scripts/regression-institutional-email-signature.mjs'
      - 'client/public/assets/brand/crewcheck-app-icon-2026.png'
      - 'scripts/regression-p1-mailersend-response-correlation.mjs'
      - '.github/workflows/p1-mailersend-response-correlation.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Institutional footer in source (no external sends)
        run: node scripts/regression-institutional-email-signature.mjs
      - name: Install isolated browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/partner-preview-browser" --ignore-scripts --no-audit --no-fund playwright@1.55.0
          node "$RUNNER_TEMP/partner-preview-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Institutional admin preview (synthetic, no external requests)
        env:
          PARTNER_PREVIEW_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/partner-preview-browser/package.json
        run: node scripts/regression-partner-institutional-preview.mjs
      - name: Prepare and build shipping email assets
        run: |
          node scripts/v139/apply.mjs
          npx vite build
      - name: Institutional footer after preparation with built PNG
        run: node scripts/regression-institutional-email-signature.mjs --built
      - name: Prepared institutional admin preview
        env:
          PARTNER_PREVIEW_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/partner-preview-browser/package.json
        run: node scripts/regression-partner-institutional-preview.mjs
      - run: node scripts/regression-p1-mailersend-response-correlation.mjs
      - run: node --check server/v139/delivery.mjs
