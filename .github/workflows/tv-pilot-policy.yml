name: TV restricted pilot safety
on:
  pull_request:
    paths: ['server/tv/**', 'scripts/tv-*', '.github/workflows/tv-pilot-policy.yml']
permissions:
  contents: read
concurrency:
  group: tv-pilot-policy-${{ github.ref }}
  cancel-in-progress: true
jobs:
  pilot-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: tv-test-only
          MYSQL_DATABASE: crewcheck_tv_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h localhost -ptv-test-only" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/tv-pilot-policy-test.mjs
      - run: node scripts/tv-pilot-mysql-test.mjs
        env:
          TV_TEST_DATABASE_URL: mysql://root:tv-test-only@127.0.0.1:3306/crewcheck_tv_test
      - run: node scripts/tv-test.mjs
      - run: node scripts/tv-server-build.mjs
      - run: npx tsc --noEmit -p tsconfig.tv.json
