name: Weather theme browser

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ci/test-browser-mirror-coverage.py'
      - 'client/src/components/v1430/trust-and-conversion.css'
      - 'client/src/styles/**'
      - 'client/src/theme-v14-3-17.css'
      - 'client/src/lib/themeRuntime.ts'
      - 'client/src/main.tsx'
      - 'client/src/pages/Home.tsx'
      - 'server.mjs'
      - 'server/weather/**'
      - 'shared/weatherNoticeDetails.*'
      - 'client/src/lib/alertReviewStore.ts'
      - 'client/src/lib/operationalWeather*.ts'
      - 'client/src/lib/rosterStartup.ts'
      - 'client/src/lib/alertRosterOwnership.ts'
      - 'client/src/lib/notificationPreferences.ts'
      - 'client/src/components/pulse/**'
      - 'shared/operational-weather-pulse.*'
      - 'shared/weather-observation-source-time.*'
      - 'shared/weather-station-overrides.*'
      - 'scripts/regression-weather-pulse-lifecycle-browser.cjs'
      - 'client/src/components/navigation/OperationalLayoutSafety.tsx'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/v139/apply.mjs'
      - 'scripts/v1430/**'
      - 'scripts/v14344/**'
      - 'scripts/finalize-theme-runtime.mjs'
      - 'scripts/regression-weather-theme-browser.mjs'
      - 'client/src/components/pulse/**'
      - 'scripts/pulse-alert-experience/**'
      - 'scripts/lib/pulse-touch-target-sample.cjs'
      - 'scripts/regression-pulse-mobile-navigation.mjs'
      - 'scripts/regression-pulse-touch-target-browser.cjs'
      - 'scripts/ci/prefer-ubuntu-archive.py'
      - 'scripts/ci/test-prefer-ubuntu-archive.py'
      - '.github/workflows/weather-theme-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weather-theme-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  weather-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check raw TypeScript
        run: npx tsc --noEmit
      - name: Prepare once and preserve the weather stylesheet
        run: |
          sha256sum client/src/components/v1430/trust-and-conversion.css > "$RUNNER_TEMP/weather-css.sha256"
          node scripts/v139/apply.mjs
          sha256sum -c "$RUNNER_TEMP/weather-css.sha256"
      - name: Check prepared theme and build shipping CSS
        run: |
          node scripts/regression-p1-theme-runtime-unification.mjs
          npx tsc --noEmit
          node scripts/p1-concierge-journey/compile.mjs
          npx vite build
      # Azure can trickle APT archives for the entire job timeout. Keep the
      # runner's existing signed HTTPS Ubuntu fallbacks; no test/gate changes.
      - name: Prefer Ubuntu archive for browser system dependencies
        run: |
          python3 scripts/ci/test-prefer-ubuntu-archive.py
          python3 scripts/ci/test-browser-mirror-coverage.py
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            python3 scripts/ci/prefer-ubuntu-archive.py /etc/apt/apt-mirrors.txt > "$RUNNER_TEMP/browser-apt-mirrors.txt"
            sudo install -m 644 "$RUNNER_TEMP/browser-apt-mirrors.txt" /etc/apt/apt-mirrors.txt
          fi
      - name: Install isolated browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/weather-browser" --ignore-scripts --no-audit --no-fund playwright@1.55.0
          node "$RUNNER_TEMP/weather-browser/node_modules/playwright/cli.js" install --with-deps chromium webkit
      - name: Verify weather contrast, theme changes and mobile controls
        env:
          MENU_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/weather-browser/package.json
        run: node scripts/regression-weather-theme-browser.mjs
      - name: Verify flight-window weather lifecycle with synthetic observations
        env:
          MENU_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/weather-browser/package.json
        run: node scripts/regression-weather-pulse-lifecycle-browser.cjs
      - name: Verify real Pulse touch targets in Chromium and WebKit
        env:
          MENU_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/weather-browser/package.json
        run: |
          node scripts/regression-pulse-mobile-navigation.mjs
          node scripts/regression-pulse-touch-target-browser.cjs
      - name: Save synthetic weather viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CrewCheck-weather-theme-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/weather-theme
            artifacts/weather-pulse-lifecycle
            artifacts/pulse-touch-targets
          if-no-files-found: warn
          retention-days: 7
