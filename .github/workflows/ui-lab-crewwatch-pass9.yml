name: UI Lab CrewWatch Pass 9

on:
  pull_request:
    paths:
      - 'android-wrapper/wear/src/main/java/com/crewcheck/watch/MainActivity.java'
      - 'scripts/ui-lab-crewwatch-pass9-test.mjs'
      - '.github/workflows/ui-lab-crewwatch-pass9.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-lab-crewwatch-pass9-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hierarchy-and-sync-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: UI Lab CrewWatch pass 9 contract
        run: node scripts/ui-lab-crewwatch-pass9-test.mjs

      - name: Wear unit tests
        run: gradle -p android-wrapper :wear:testDebugUnitTest

      - name: Wear debug build
        run: gradle -p android-wrapper :wear:assembleDebug
