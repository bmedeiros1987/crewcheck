name: P1 Pernoite Wakeup Concierge context

on:
  pull_request:
    branches: [main]
    paths:
      - 'client/src/components/navigation/StayNavigationContext.tsx'
      - 'client/src/components/navigation/stay-context.css'
      - 'client/src/lib/navigationContext.ts'
      - 'client/src/pages/Home.tsx'
      - 'scripts/p1-566-stay-wakeup-concierge-context/**'
      - 'scripts/p0-build-identity/apply.mjs'
      - 'scripts/regression-p1-566-stay-wakeup-concierge-context.mjs'
      - '.github/workflows/p1-stay-wakeup-concierge-context.yml'
  push:
    branches: [main]
    paths:
      - 'client/src/components/navigation/StayNavigationContext.tsx'
      - 'client/src/components/navigation/stay-context.css'
      - 'client/src/lib/navigationContext.ts'
      - 'client/src/pages/Home.tsx'
      - 'scripts/p1-566-stay-wakeup-concierge-context/**'
      - 'scripts/p0-build-identity/apply.mjs'
      - 'scripts/regression-p1-566-stay-wakeup-concierge-context.mjs'
      - '.github/workflows/p1-stay-wakeup-concierge-context.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash -o pipefail {0}

concurrency:
  group: p1-stay-wakeup-concierge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Stay context round trip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prepare canonical client sources
        run: node scripts/v139/apply.mjs
      - name: Preserve canonical-prepare diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p1-566-stay-prepare-failure-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/android-build.log
            ${{ runner.temp }}/android-build-tail.log
            client/src/pages/Home.tsx
          if-no-files-found: warn
          retention-days: 1
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Shared Navigation Context regression
        run: node scripts/regression-p1-566-navigation-context.mjs
      - name: Pernoite Wakeup Concierge context regression
        run: node scripts/regression-p1-566-stay-wakeup-concierge-context.mjs
      - name: Hotel contextual selection regression
        run: node scripts/regression-hotel-context-selection.mjs
