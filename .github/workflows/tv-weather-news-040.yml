name: TV Weather & News 0.4
on:
  pull_request:
    paths:
      - 'apps/tv-player/**'
      - 'packages/tv-core/**'
      - 'server/tv/**'
      - 'scripts/tv-weather-news-040-test.mjs'
      - '.github/workflows/tv-weather-news-040.yml'
permissions:
  contents: read
jobs:
  weather-news:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/tv-weather-news-040-test.mjs
      - run: node scripts/tv-extension-premium-030-test.mjs
      - run: node scripts/tv-premium-020-test.mjs
      - run: node scripts/tv-test.mjs
      - run: node scripts/tv-broadcast-prepare.mjs && node scripts/tv-broadcast-fit.mjs
      - run: node scripts/tv-channel-test.mjs && node scripts/tv-broadcast-test.mjs && node scripts/tv-broadcast-fit-test.mjs
      - run: node scripts/tv-pairing-test.mjs
      - run: npx tsc --noEmit -p tsconfig.tv.json
