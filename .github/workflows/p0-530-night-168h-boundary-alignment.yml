name: P0 #530 168h boundary source-prepared parity

on:
  pull_request:
    paths:
      - 'client/src/lib/complianceEngine.ts'
      - 'scripts/v14359/**'
      - 'scripts/regression-p0-530-night-168h-boundary-alignment.mjs'
      - 'scripts/regression-p0-530-journey-instant-timezone-independence.mjs'
      - '.github/workflows/p0-530-night-168h-boundary-alignment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Source 168h boundary contract
        run: node scripts/regression-p0-530-night-168h-boundary-alignment.mjs
      - name: TypeScript
        run: npx tsc --noEmit

  prepared-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prepare canonical source
        run: node scripts/v139/apply.mjs
      - name: Prepared 168h boundary contract
        run: node scripts/regression-p0-530-night-168h-boundary-alignment.mjs
      - name: Existing official compliance gate
        run: node scripts/regression-v14-3-59-official-roster-compliance.mjs
      - name: Existing journey-counting gate
        run: node scripts/regression-p1-night-ops-journey-identity.mjs
      - name: Existing timezone gate
        run: node scripts/regression-p0-530-journey-instant-timezone-independence.mjs
      - name: TypeScript
        run: npx tsc --noEmit
