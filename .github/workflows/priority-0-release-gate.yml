name: CrewCheck Priority 0 Release Gate

on:
  workflow_run:
    workflows: ["Android signed store bundles"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID opcional da execução Android a validar"
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: crewcheck-priority-0-release-gate
  cancel-in-progress: true

jobs:
  verify-signed-release:
    name: Verify three signed AABs and manifest evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
      EVENT_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      MANUAL_RUN_ID: ${{ inputs.run_id }}

    steps:
      - name: Resolve Android workflow run
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          run_id="${MANUAL_RUN_ID:-${EVENT_RUN_ID:-}}"
          if [[ -z "$run_id" ]]; then
            run_id="$(gh api "/repos/${REPOSITORY}/actions/workflows/android.yml/runs?branch=main&status=completed&per_page=1" --jq '.workflow_runs[0].id // empty')"
          fi

          if [[ -z "$run_id" ]]; then
            echo '::error title=Prioridade 0 sem execução Android::Nenhuma execução concluída do workflow Android foi encontrada.'
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Validando execução Android $run_id"

      - name: Confirm Android workflow succeeded
        id: run
        shell: bash
        run: |
          set -euo pipefail
          run_id='${{ steps.resolve.outputs.run_id }}'
          conclusion="$(gh api "/repos/${REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion // empty')"
          html_url="$(gh api "/repos/${REPOSITORY}/actions/runs/${run_id}" --jq '.html_url // empty')"
          head_sha="$(gh api "/repos/${REPOSITORY}/actions/runs/${run_id}" --jq '.head_sha // empty')"

          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          echo "html_url=$html_url" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

          if [[ "$conclusion" != 'success' ]]; then
            echo "::error title=Build Android bloqueado::A execução ${run_id} terminou como '${conclusion:-desconhecido}'. Abra os logs, corrija a primeira etapa vermelha e execute novamente o workflow Android."
            exit 1
          fi

      - name: Verify complete bundle set from the signed workflow
        shell: bash
        run: |
          set -euo pipefail
          run_id='${{ steps.resolve.outputs.run_id }}'
          gh api "/repos/${REPOSITORY}/actions/runs/${run_id}" --jq '.path' | grep -Fx '.github/workflows/android.yml'
          artifacts_json="$(gh api "/repos/${REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100")"
          for artifact in CrewCheck-mobile-AAB CrewCheck-WearOS-AAB CrewCheck-WatchFace-AAB CrewCheck-verified-play-bundles; do
            jq -e --arg name "$artifact" '[.artifacts[] | select(.name == $name and .expired == false and .size_in_bytes > 0)] | length == 1' <<< "$artifacts_json"
          done
          {
            echo '### Verified Android store bundles'
            echo 'Mobile, Wear OS, watch face and manifest/signature evidence are present in the same successful build.'
            echo 'Commit: `${{ steps.run.outputs.head_sha }}`'
            echo 'Run: ${{ steps.run.outputs.html_url }}'
            echo 'This gate does not publish any release.'
          } >> "$GITHUB_STEP_SUMMARY"
