name: P-1 Auth artifact token index

on:
  pull_request:
    paths:
      - 'migrations/20260814_017_p1_auth_artifact_token_lookup_index.sql'
      - 'scripts/regression-p1-auth-artifact-token-index.mjs'
      - '.github/workflows/p1-auth-artifact-token-index.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/regression-p1-auth-artifact-token-index.mjs
