name: P0 client AIMS APZ parity

on:
  pull_request:
    branches: [main]
    paths:
      - 'client/src/lib/aimsParser.ts'
      - 'client/src/lib/canonicalRoster.ts'
      - 'scripts/regression-ground-duty-occurrence.mjs'
      - 'scripts/lib/ts-module-harness.mjs'
      - 'scripts/regression-p0-510-client-aims-parity-current.mjs'
      - 'scripts/regression-aims-activity-before-flight-parity.mjs'
      - 'server/rosterParser.mjs'
      - '.github/workflows/p0-510-client-aims-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-aims-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate client AIMS parity before preparation
        run: node scripts/regression-p0-510-client-aims-parity-current.mjs
      - name: Activities before flights match the server, before preparation
        run: for zone in UTC America/Sao_Paulo Pacific/Auckland; do TZ="$zone" node scripts/regression-aims-activity-before-flight-parity.mjs; done
      - name: Ground duty occurrence identity and measurement before preparation
        run: |
          set -euo pipefail
          for zone in UTC America/Sao_Paulo Pacific/Auckland; do
            TZ="$zone" node scripts/regression-ground-duty-occurrence.mjs
          done
      - name: Prepare canonical CrewCheck sources
        run: node scripts/v139/apply.mjs
      - name: Validate client AIMS parity after preparation
        run: node scripts/regression-p0-510-client-aims-parity-current.mjs
      - name: Activities before flights match the server, after preparation
        run: for zone in UTC America/Sao_Paulo Pacific/Auckland; do TZ="$zone" node scripts/regression-aims-activity-before-flight-parity.mjs; done
      - name: Ground duty occurrence identity and measurement after preparation
        run: |
          set -euo pipefail
          for zone in UTC America/Sao_Paulo Pacific/Auckland; do
            TZ="$zone" node scripts/regression-ground-duty-occurrence.mjs
          done
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Web build
        run: npx vite build
