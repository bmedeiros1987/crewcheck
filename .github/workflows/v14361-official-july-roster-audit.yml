name: v14.3.61 official July roster canonical audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/fixtures/official-roster-2026-07-canonical-anonymized.json'
      - 'scripts/regression-v14-3-61-official-july-roster.mjs'
      - '.github/workflows/v14361-official-july-roster-audit.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate anonymized July roster fixture
        run: node scripts/regression-v14-3-61-official-july-roster.mjs
