name: CrewCheck active roster identity

on:
  pull_request:
    paths:
      - 'shared/activeRosterIdentity.mjs'
      - 'scripts/regression-active-roster-identity.mjs'
      - '.github/workflows/active-roster-identity.yml'
      - 'client/src/lib/databaseClient.ts'
      - 'server/platform.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  active-roster-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
      - name: Validate APK/Web active roster identity contract
        run: node scripts/regression-active-roster-identity.mjs
