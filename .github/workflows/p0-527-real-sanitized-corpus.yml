name: P0 #527 real sanitized AIMS corpus

on:
  pull_request:
    paths:
      - 'server/rosterParser.mjs'
      - 'scripts/fixtures/p0-527/**'
      - 'scripts/regression-p0-527-real-sanitized-corpus.mjs'
      - '.github/workflows/p0-527-real-sanitized-corpus.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Real sanitized AIMS source → parser gate
        run: node scripts/regression-p0-527-real-sanitized-corpus.mjs
      - name: Existing #510 segmentation oracle
        run: node scripts/regression-p1-server-510-aims-duty-segmentation.mjs
      - name: Materialize canonical sources for sovereign #580 gate
        run: node scripts/v139/apply.mjs
      - name: Existing #580 real VC/LEGEND boundary
        run: node scripts/regression-p0-580-real-vc-legend-boundary.mjs
      - name: TypeScript
        run: npx tsc --noEmit
