name: TV owner consent and visitor context
on:
  pull_request:
    paths:
      - 'server/tv/**'
      - 'packages/tv-core/**'
      - 'scripts/tv-owner-context-test.mjs'
      - 'scripts/tv-browser-origins-test.mjs'
      - 'scripts/tv-test.mjs'
      - '.github/workflows/tv-owner-context.yml'
permissions:
  contents: read
jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/tv-owner-context-test.mjs
      - run: node scripts/tv-browser-origins-test.mjs
      - run: node scripts/tv-test.mjs
      - run: node scripts/tv-server-build.mjs
      - run: npx tsc --noEmit -p tsconfig.tv.json
