      - 'scripts/regression-regulation-automatic*.mjs'
      - 'scripts/regression-regulation-no-roster-home-browser.mjs'
      - 'scripts/regression-regulation-prefill.mjs'
      - 'scripts/regression-regulation-prefill-browser.mjs'
      - 'scripts/regression-regulation-window-selection.mjs'
      - 'scripts/p0-530-adjacent-month-retention/**'
      - 'scripts/regression-regulation-temporal-scenario.mjs'
      - 'scripts/regression-regulation-scenario-ui.cjs'
      - 'client/src/lib/navigationContext.ts'
      - 'client/src/lib/rosterFocus.ts'
      - 'client/src/pages/Home.tsx'
      - 'client/src/components/v1391/RosterLaunchView.tsx'
      - 'client/src/components/v1392/ManualRegulationView.tsx'
      - 'client/src/components/v1392/v1392.css'
      - 'client/src/components/v1432/ManualRegulationView.tsx'
      - 'scripts/p1-565-roster-regulation-context/**'
      - 'scripts/p0-build-identity/apply.mjs'
      - 'scripts/regression-p1-565-roster-regulation-navigation.mjs'
      - 'scripts/regression-rbac-sector-input.cjs'
      - '.github/workflows/p1-roster-regulation-navigation.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash -o pipefail {0}

concurrency:
  group: p1-roster-regulation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Contextual roster regulation round trip
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prepare canonical client sources
        run: node scripts/v139/apply.mjs
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Shared Navigation Context regression
        run: node scripts/regression-p1-566-navigation-context.mjs
      - name: Roster regulation contextual round trip
        run: node scripts/regression-p1-565-roster-regulation-navigation.mjs
      - name: Roster focus compatibility
        run: node scripts/regression-p1-548-dynamic-calendar.mjs
      - name: Install isolated regulation browser
        run: |
          npm install --prefix "$RUNNER_TEMP/regulation-browser" --ignore-scripts --no-audit --no-fund playwright@1.55.0
          node "$RUNNER_TEMP/regulation-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Retained legacy regulation sector editing regression
        env:
          RBAC_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/regulation-browser/package.json
        run: node scripts/regression-rbac-sector-input.cjs
      - name: Current conditional temporal scenario regression
        run: |
          node scripts/regression-regulation-automatic-scenario.mjs
          node scripts/regression-regulation-window-selection.mjs
          node scripts/regression-regulation-prefill.mjs
          node scripts/regression-regulation-source-hydration.mjs
          node scripts/regression-regulation-context-explanation.mjs
          node scripts/regression-canonical-journey-label.mjs
          node scripts/regression-regulation-temporal-scenario.mjs
          node scripts/regression-regulation-deadline-summary.mjs
          node scripts/regression-regulation-review-gates.mjs
          node scripts/regression-regulation-operational-arrival.mjs
          node scripts/regression-cirium-arrival-milestones.mjs
          node scripts/regression-regulation-arrival-provider-projection.mjs
          node scripts/regression-watch-overnight.mjs
          node scripts/regression-watch-source-pipeline.mjs
          npx vite build
      - name: Current compiled scenario UI and Home shortcut
        env:
          MENU_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/regulation-browser/package.json
        run: |
          node scripts/regression-regulation-automatic-browser.mjs
          node scripts/regression-regulation-no-roster-home-browser.mjs
          node scripts/regression-regulation-deadline-browser.mjs
          node scripts/regression-regulation-review-gates-browser.mjs
          node scripts/regression-regulation-operational-arrival-browser.mjs
          node scripts/regression-home-operational-admission-browser.mjs
          node scripts/regression-regulation-prefill-browser.mjs
          node scripts/regression-regulation-context-explanation-browser.mjs
          node scripts/regression-regulation-scenario-ui.cjs
