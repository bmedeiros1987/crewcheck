      - 'scripts/regression-regulation-operational-arrival*.mjs'
      - 'scripts/regression-regulation-arrival-provider-projection.mjs'
      - 'scripts/regression-cirium-arrival-milestones.mjs'
      - 'scripts/regression-watch-overnight.mjs'
      - 'scripts/regression-regulation-deadline-*.mjs'
      - 'scripts/regression-regulation-review-gates*.mjs'
