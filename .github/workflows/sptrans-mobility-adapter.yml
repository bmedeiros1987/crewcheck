name: CrewCheck SPTrans mobility adapter

on:
  pull_request:
    paths:
      - 'server/integrations/sptrans.mjs'
      - 'scripts/regression-sptrans-adapter.mjs'
      - '.github/workflows/sptrans-mobility-adapter.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci || npm install
      - name: SPTrans adapter regression
        run: node scripts/regression-sptrans-adapter.mjs
      - name: TypeScript
        run: npx tsc --noEmit --pretty false --project tsconfig.json
