name: Radar departure-gate arrival-fallback

on:
  pull_request:
    paths:
      - 'server.mjs'
      - 'scripts/regression-radar-departure-gate-arrival-fallback.mjs'
      - '.github/workflows/radar-departure-gate-arrival-fallback.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
      - run: node --check server.mjs
      - run: node scripts/regression-radar-departure-gate-arrival-fallback.mjs
