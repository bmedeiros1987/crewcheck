name: AIMS vertical roster
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ci/prefer-ubuntu-archive.py'
      - 'scripts/ci/test-prefer-ubuntu-archive.py'
      - 'scripts/ci/test-browser-mirror-coverage.py'
      - 'client/src/components/v1391/AimsRosterTable.tsx'
      - 'client/src/components/roster/**'
      - 'client/src/lib/crewOccurrenceAssociation.ts'
      - 'client/src/lib/aimsParser.ts'
      - 'client/src/lib/pdfParser.ts'
      - 'scripts/regression-roster-crew-*.mjs'
      - 'scripts/regression-crewtopia-crew-table-layout.mjs'
      - 'client/src/components/v1391/aims-vertical.css'
      - 'client/src/components/v1391/roster-layout.css'
      - 'client/src/lib/rosterPublication*.ts'
      - 'scripts/regression-aims-vertical-browser.mjs'
      - 'scripts/regression-publication-import-flow.cjs'
      - 'scripts/lib/roster-format-controls.cjs'
      - 'scripts/regression-roster-layout-preference.mjs'
      - '.github/workflows/aims-vertical.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aims-vertical-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  aims-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Raw source contracts and TypeScript
        run: |
          node scripts/regression-roster-crew-occurrence.mjs
          for tz in UTC America/Sao_Paulo Pacific/Auckland; do TZ="$tz" node scripts/regression-crewtopia-crew-table-layout.mjs; done
          node scripts/regression-roster-layout-preference.mjs
          npx tsc --noEmit
          sha256sum client/src/components/v1391/AimsRosterTable.tsx client/src/components/v1391/aims-vertical.css > "$RUNNER_TEMP/aims.sha256"
      - name: Canonical preparation, byte parity, TypeScript and web build
        run: |
          npm run check
          sha256sum -c "$RUNNER_TEMP/aims.sha256"
          node scripts/regression-roster-crew-occurrence.mjs
          for tz in UTC America/Sao_Paulo Pacific/Auckland; do TZ="$tz" node scripts/regression-crewtopia-crew-table-layout.mjs; done
          node scripts/regression-roster-layout-preference.mjs
          node scripts/regression-roster-publication-review.mjs
          npx vite build
      # Keep the runner's signed Ubuntu HTTPS fallbacks; avoid degraded Azure APT.
      - name: Prefer Ubuntu archive for browser system dependencies
        run: |
          python3 scripts/ci/test-prefer-ubuntu-archive.py
          python3 scripts/ci/test-browser-mirror-coverage.py
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            python3 scripts/ci/prefer-ubuntu-archive.py /etc/apt/apt-mirrors.txt > "$RUNNER_TEMP/browser-apt-mirrors.txt"
            sudo install -m 644 "$RUNNER_TEMP/browser-apt-mirrors.txt" /etc/apt/apt-mirrors.txt
          fi
      - name: Install isolated browser dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/aims-browser" --ignore-scripts --no-audit --no-fund playwright@1.55.0
          node "$RUNNER_TEMP/aims-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Actual AIMS component, theme, font, navigation and privacy checks
        env:
          MENU_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/aims-browser/package.json
        run: |
          node scripts/regression-aims-vertical-browser.mjs
          node scripts/regression-roster-crew-browser.mjs
          node scripts/regression-roster-crew-app-browser.mjs
          node scripts/regression-roster-crew-browser.mjs --crewtopia-table
          CREW_PDF_PATH=artifacts/SYNTHETIC-roster-crewtopia/SYNTHETIC-crew-three-pages.pdf CREW_APP_EVIDENCE_DIR=artifacts/SYNTHETIC-roster-crewtopia-app node scripts/regression-roster-crew-app-browser.mjs
      - name: Full app import to AIMS history regression
        env:
          MENU_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/aims-browser/package.json
        run: node scripts/regression-publication-import-flow.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aims-vertical-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/SYNTHETIC-roster-crew
            artifacts/SYNTHETIC-roster-crew-app
            artifacts/SYNTHETIC-roster-crewtopia
            artifacts/SYNTHETIC-roster-crewtopia-app
            artifacts/aims-vertical
            artifacts/publication-import-flow
          if-no-files-found: warn
          retention-days: 7
