name: CrewCheck calendar export
on:
  pull_request:
    paths:
      - 'client/src/lib/calendarExport.ts'
      - 'client/src/lib/googleCalendarSync.ts'
      - 'scripts/regression-crewcheck-calendar-format.mjs'
      - '.github/workflows/crewcheck-calendar-export.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/v139/apply.mjs
      - run: node scripts/regression-crewcheck-calendar-format.mjs
      - run: npx tsc --noEmit
      - run: npx vite build
