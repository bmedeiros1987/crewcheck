name: Medical emergency coordination OFF
on:
  pull_request:
    paths:
      - 'server/emergency/medical-coordination-off.mjs'
      - 'shared/emergency-availability.mjs'
      - 'scripts/regression-medical-coordination-off.mjs'
      - '.github/workflows/medical-emergency-coordination-off.yml'
  push:
    branches: [main]
    paths:
      - 'server/emergency/medical-coordination-off.mjs'
      - 'shared/emergency-availability.mjs'
      - 'scripts/regression-medical-coordination-off.mjs'
      - '.github/workflows/medical-emergency-coordination-off.yml'
permissions:
  contents: read
concurrency:
  group: medical-coordination-off-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: node --test scripts/regression-medical-coordination-off.mjs
