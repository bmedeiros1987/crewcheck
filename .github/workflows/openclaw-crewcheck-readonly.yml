name: OpenClaw CrewCheck read-only

on:
  pull_request:
    paths:
      - "integrations/openclaw-crewcheck/**"
      - ".github/workflows/openclaw-crewcheck-readonly.yml"
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read-only and identity isolation regression
        run: node integrations/openclaw-crewcheck/test.mjs
