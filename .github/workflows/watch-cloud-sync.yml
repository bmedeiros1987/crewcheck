name: CrewWatch cloud sync (OFF by default)
on:
  pull_request:
    paths:
      - 'server.mjs'
      - 'server/watch-cloud-sync.mjs'
      - 'client/src/lib/watchCloud.ts'
      - 'client/src/lib/watchAccount.ts'
      - 'client/src/lib/authClient.ts'
      - 'client/src/pages/Home.tsx'
      - 'android-wrapper/app/src/main/java/com/crewcheck/app/CrewCheckWatchPublisher.java'
      - 'android-wrapper/app/src/main/java/com/crewcheck/app/MainActivity.java'
      - 'android-wrapper/wear/src/main/**'
      - 'scripts/regression-watch-cloud-*.mjs'
      - 'scripts/regression-watch-account-binding.mjs'
      - '.env.example'
      - '.github/workflows/watch-cloud-sync.yml'
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Server and phone contract (in-memory store, fake server, no network or credentials)
        run: |
          node scripts/regression-watch-cloud-sync.mjs
          node scripts/regression-watch-cloud-publisher.mjs
          node scripts/regression-watch-account-binding.mjs
