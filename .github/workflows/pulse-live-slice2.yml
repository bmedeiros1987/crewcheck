name: CrewCheck Pulse live Slice 2

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/ci/prefer-ubuntu-archive.py'
      - 'scripts/ci/test-prefer-ubuntu-archive.py'
      - 'scripts/ci/test-browser-mirror-coverage.py'
      - 'client/src/components/pulse/**'
      - 'client/src/components/alerts/**'
      - 'client/src/components/v1391/RosterLaunchView.tsx'
      - 'client/src/components/navigation/InternalHeaderFrame.tsx'
      - 'client/src/lib/alert*.ts'
      - 'client/src/lib/groundAlertDispositions.ts'
      - 'client/src/lib/complianceAlertSemantics.ts'
      - 'client/src/lib/navigationContext.ts'
      - 'client/src/lib/nightAlertEvidence.ts'
      - 'client/src/lib/i18n.ts'
      - 'scripts/pulse-alert-experience/**'
      - 'scripts/regression-pulse-alert-experience.mjs'
      - 'scripts/regression-night-alert-evidence-browser.cjs'
      - 'scripts/v139/apply.mjs'
      - 'client/src/pages/Home.tsx'
      - 'scripts/regression-p1-546-pulse-*.mjs'
      - '.github/workflows/pulse-live-slice2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulse-live-slice2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pulse-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prepare canonical CrewCheck sources
        run: node scripts/v139/apply.mjs
      - name: Validate Pulse foundation
        run: node scripts/regression-p1-546-pulse-foundation.mjs
      - name: Validate Pulse live queue and notifications
        run: node scripts/regression-p1-546-pulse-live.mjs
      # Keep the runner's signed Ubuntu HTTPS fallbacks; avoid degraded Azure APT.
      - name: Prefer Ubuntu archive for browser system dependencies
        run: |
          python3 scripts/ci/test-prefer-ubuntu-archive.py
          python3 scripts/ci/test-browser-mirror-coverage.py
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            python3 scripts/ci/prefer-ubuntu-archive.py /etc/apt/apt-mirrors.txt > "$RUNNER_TEMP/browser-apt-mirrors.txt"
            sudo install -m 644 "$RUNNER_TEMP/browser-apt-mirrors.txt" /etc/apt/apt-mirrors.txt
          fi
      - name: Install isolated browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/pulse-browser" --ignore-scripts --no-audit --no-fund playwright@1.55.0
          node "$RUNNER_TEMP/pulse-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Account review and integrated header browser regression
        env:
          PULSE_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/pulse-browser/package.json
        run: |
          node scripts/regression-pulse-alert-experience.mjs
          node scripts/regression-pulse-alert-experience.mjs --case=header-close
          node scripts/regression-pulse-alert-experience.mjs --case=mark-standard
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build web
        run: npx vite build
      - name: Night alert evidence and contextual roster navigation (synthetic)
        env:
          MENU_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/pulse-browser/package.json
        run: node scripts/regression-night-alert-evidence-browser.cjs
