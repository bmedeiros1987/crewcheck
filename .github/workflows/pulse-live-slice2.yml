name: CrewCheck Pulse live Slice 2

on:
  pull_request:
    branches: [main]
    paths:
      - 'client/src/components/pulse/**'
      - 'client/src/pages/Home.tsx'
      - 'scripts/regression-p1-546-pulse-*.mjs'
      - '.github/workflows/pulse-live-slice2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulse-live-slice2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pulse-live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prepare canonical CrewCheck sources
        run: node scripts/v139/apply.mjs
      - name: Validate Pulse foundation
        run: node scripts/regression-p1-546-pulse-foundation.mjs
      - name: Validate Pulse live queue and notifications
        run: node scripts/regression-p1-546-pulse-live.mjs
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build web
        run: npx vite build
