name: CrewCheck CrewWatch Official signed release

on:
  pull_request:
    paths:
      - 'android-wrapper/wear/**'
      - 'android-wrapper/watchface/**'
      - 'android-wrapper/app/build.gradle'
      - 'android-wrapper/app/src/main/AndroidManifest.xml'
      - 'android-wrapper/app/src/main/java/com/crewcheck/app/CrewCheckWatchPublisher.java'
      - 'android-wrapper/app/src/main/java/com/crewcheck/app/CrewCheckWatchSyncService.java'
      - 'android-wrapper/app/src/main/java/com/crewcheck/app/MainActivity.java'
      - 'client/src/pages/Home.tsx'
      - 'client/src/lib/watchContext.ts'
      - 'android-wrapper/settings.gradle'
      - 'android-wrapper/build.gradle'
      - 'scripts/regression-crewwatch-v2-premium.mjs'
      - 'scripts/regression-crewwatch-official-ui.mjs'
      - 'docs/crewwatch-v2.md'
      - '.github/workflows/crewwatch-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch-pulse-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      KEYSTORE_BASE64: ${{ secrets.CREWCHECK_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 || secrets.KEYSTORE_FILE_BASE64 || secrets.SIGNING_KEY }}
      STORE_PASSWORD: ${{ secrets.CREWCHECK_STORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || secrets.ANDROID_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.KEY_STORE_PASSWORD || secrets.SIGNING_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.CREWCHECK_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS || secrets.ALIAS }}
      KEY_PASSWORD: ${{ secrets.CREWCHECK_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD }}
      CREWCHECK_STORE_FILE: ${{ github.workspace }}/android-wrapper/crewcheck-release.jks

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Validate CrewCheck signing secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${KEYSTORE_BASE64:-}" ]] || missing+=("keystore base64")
          [[ -n "${STORE_PASSWORD:-}" ]] || missing+=("store password")
          [[ -n "${KEY_ALIAS:-}" ]] || missing+=("key alias")
          [[ -n "${KEY_PASSWORD:-}" ]] || missing+=("key password")
          if (( ${#missing[@]} )); then
            printf '::error::Assinatura obrigatória ausente: %s\n' "$(IFS=', '; echo "${missing[*]}")"
            exit 1
          fi

      - name: Decode and validate CrewCheck upload keystore
        shell: bash
        run: |
          set -euo pipefail
          encoded="${KEYSTORE_BASE64#base64:}"
          printf '%s' "$encoded" | tr -d '\r\n ' | base64 --decode > "$CREWCHECK_STORE_FILE"
          test -s "$CREWCHECK_STORE_FILE"
          chmod 600 "$CREWCHECK_STORE_FILE"
          keytool -list -keystore "$CREWCHECK_STORE_FILE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Premium UX and lifecycle regression
        run: node scripts/regression-crewwatch-v2-premium.mjs

      - name: Official CrewWatch UI and notifications regression
        run: node scripts/regression-crewwatch-official-ui.mjs

      - name: Snapshot contract
        run: gradle -p android-wrapper :wear:testDebugUnitTest

      - name: Phone wellbeing publisher contract
        run: gradle -p android-wrapper :app:testDebugUnitTest

      - name: Build paired phone pilot
        run: gradle -p android-wrapper :app:assembleDebug

      - name: Build debug wearable packages
        run: |
          gradle -p android-wrapper :wear:assembleDebug
          gradle -p android-wrapper :watchface:assembleDebug

      - name: Build signed release APK and AAB
        working-directory: android-wrapper
        env:
          CREWCHECK_STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          CREWCHECK_KEY_ALIAS: ${{ env.KEY_ALIAS }}
          CREWCHECK_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --console=plain \
            :app:assembleRelease \
            :app:bundleRelease \
            :wear:assembleRelease \
            :wear:bundleRelease \
            :watchface:assembleRelease \
            :watchface:bundleRelease

      - name: Android lint
        run: gradle -p android-wrapper :wear:lintDebug

      - name: Verify Google Play package identities
        shell: bash
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$AAPT"

          app_apk='android-wrapper/app/build/outputs/apk/release/app-release.apk'
          app_aab='android-wrapper/app/build/outputs/bundle/release/app-release.aab'
          wear_apk='android-wrapper/wear/build/outputs/apk/release/wear-release.apk'
          face_apk='android-wrapper/watchface/build/outputs/apk/release/watchface-release.apk'

          "$AAPT" dump badging "$app_apk" | head -1 | grep -F "package: name='com.crewcheck.app'"
          "$AAPT" dump badging "$wear_apk" | head -1 | grep -F "package: name='com.crewcheck.app'"
          "$AAPT" dump badging "$face_apk" | head -1 | grep -F "package: name='com.crewcheck.watch.app'"

      - name: Verify APK and AAB signatures
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"

          app_apk='android-wrapper/app/build/outputs/apk/release/app-release.apk'
          app_aab='android-wrapper/app/build/outputs/bundle/release/app-release.aab'
          wear_apk='android-wrapper/wear/build/outputs/apk/release/wear-release.apk'
          wear_aab='android-wrapper/wear/build/outputs/bundle/release/wear-release.aab'
          face_apk='android-wrapper/watchface/build/outputs/apk/release/watchface-release.apk'
          face_aab='android-wrapper/watchface/build/outputs/bundle/release/watchface-release.aab'

          for file in "$app_apk" "$app_aab" "$wear_apk" "$wear_aab" "$face_apk" "$face_aab"; do
            test -s "$file"
          done

          "$APKSIGNER" verify --verbose --print-certs "$app_apk"
          "$APKSIGNER" verify --verbose --print-certs "$wear_apk"
          "$APKSIGNER" verify --verbose --print-certs "$face_apk"

          for aab in "$app_aab" "$wear_aab" "$face_aab"; do
            verify_log="$RUNNER_TEMP/$(basename "$aab").verify.log"
            jarsigner -verify -verbose -certs "$aab" > "$verify_log" 2>&1
            cat "$verify_log"
            grep -Eq '^jar verified\.|^jar verified, with signer errors\.$' "$verify_log"
            ! grep -Fqi 'jar is unsigned' "$verify_log"
          done

      - name: Stage signed CrewCheck wearable release
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/crewcheck-wear-signed"
          mkdir -p "$out"

          cp android-wrapper/wear/build/outputs/apk/release/wear-release.apk \
            "$out/CrewCheck-CrewWatch-Official-signed-release.apk"
          cp android-wrapper/wear/build/outputs/bundle/release/wear-release.aab \
            "$out/CrewCheck-CrewWatch-com.crewcheck.app-Play-Console.aab"
          cp android-wrapper/watchface/build/outputs/apk/release/watchface-release.apk \
            "$out/CrewCheck-CrewWatchFace-Official-signed-release.apk"
          cp android-wrapper/watchface/build/outputs/bundle/release/watchface-release.aab \
            "$out/CrewCheck-CrewWatchFace-com.crewcheck.watch.app-Play-Console.aab"

          printf '%s\n' \
            'CrewCheck-CrewWatch-com.crewcheck.app-Play-Console.aab -> com.crewcheck.app' \
            'CrewCheck-CrewWatchFace-com.crewcheck.watch.app-Play-Console.aab -> com.crewcheck.watch.app' \
            > "$out/PACKAGE_MAP.txt"

          (
            cd "$out"
            sha256sum \
              CrewCheck-CrewWatch-Official-signed-release.apk \
              CrewCheck-CrewWatch-com.crewcheck.app-Play-Console.aab \
              CrewCheck-CrewWatchFace-Official-signed-release.apk \
              CrewCheck-CrewWatchFace-com.crewcheck.watch.app-Play-Console.aab \
              PACKAGE_MAP.txt \
              > SHA256SUMS.txt
          )

      - name: Stage signed CrewCheck mobile watch-sync pilot
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/crewcheck-mobile-watch-sync"
          mkdir -p "$out"
          cp android-wrapper/app/build/outputs/apk/release/app-release.apk \
            "$out/CrewCheck-Mobile-WatchSync-140387-signed-release.apk"
          cp android-wrapper/app/build/outputs/bundle/release/app-release.aab \
            "$out/CrewCheck-Mobile-140387-Play-Console.aab"
          (
            cd "$out"
            sha256sum \
              CrewCheck-Mobile-WatchSync-140387-signed-release.apk \
              CrewCheck-Mobile-140387-Play-Console.aab \
              > SHA256SUMS.txt
          )

      - name: Upload signed CrewCheck mobile watch-sync pilot
        uses: actions/upload-artifact@v6
        with:
          name: crewcheck-mobile-watch-sync-140387-signed
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/crewcheck-mobile-watch-sync/CrewCheck-Mobile-WatchSync-140387-signed-release.apk
            ${{ runner.temp }}/crewcheck-mobile-watch-sync/CrewCheck-Mobile-140387-Play-Console.aab
            ${{ runner.temp }}/crewcheck-mobile-watch-sync/SHA256SUMS.txt

      - name: Upload signed wearable release
        uses: actions/upload-artifact@v6
        with:
          name: crewwatch-official-signed-release
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/crewcheck-wear-signed/CrewCheck-CrewWatch-Official-signed-release.apk
            ${{ runner.temp }}/crewcheck-wear-signed/CrewCheck-CrewWatch-com.crewcheck.app-Play-Console.aab
            ${{ runner.temp }}/crewcheck-wear-signed/CrewCheck-CrewWatchFace-Official-signed-release.apk
            ${{ runner.temp }}/crewcheck-wear-signed/CrewCheck-CrewWatchFace-com.crewcheck.watch.app-Play-Console.aab
            ${{ runner.temp }}/crewcheck-wear-signed/PACKAGE_MAP.txt
            ${{ runner.temp }}/crewcheck-wear-signed/SHA256SUMS.txt

      - name: Upload pilot/debug artifacts
        uses: actions/upload-artifact@v6
        with:
          name: crewwatch-official-pilot
          if-no-files-found: error
          retention-days: 14
          path: |
            android-wrapper/app/build/outputs/apk/debug/*.apk
            android-wrapper/wear/build/outputs/apk/debug/*.apk
            android-wrapper/watchface/build/outputs/apk/debug/*.apk
            android-wrapper/wear/build/reports/tests/testDebugUnitTest/**
