name: Manus audit scheduler

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: read
  pull-requests: read

# The scheduler only dispatches one missing audit at a time. It never decides a
# gate itself; the round-trip bridge remains the only publisher of Manus verdicts.
concurrency:
  group: manus-audit-scheduler
  cancel-in-progress: false

jobs:
  dispatch-next:
    name: Dispatch next missing Manus P0 audit
    if: github.repository == 'bmedeiros1987/crewcheck'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch next exact-SHA audit if bridge is idle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          api_get() {
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$1"
          }

          # Do not cancel or duplicate an audit that is already queued/running.
          for status in queued in_progress; do
            active="$(api_get "https://api.github.com/repos/${{ github.repository }}/actions/workflows/manus-github-audit.yml/runs?status=$status&per_page=1" | jq -r '.total_count')"
            if [ "$active" -gt 0 ]; then
              echo "Manus bridge already $status; scheduler will not duplicate it."
              exit 0
            fi
          done

          for PR_NUMBER in 605 626 627; do
            PR_JSON="$(api_get "https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER")"
            STATE="$(jq -r '.state' <<<"$PR_JSON")"
            SHA="$(jq -r '.head.sha' <<<"$PR_JSON")"

            [ "$STATE" = "open" ] || continue
            [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid SHA for PR #$PR_NUMBER" >&2; exit 1; }

            # A gate counts as returned only when the new bridge itself
            # (github-actions[bot]) published MERGE or BLOCKER for this exact SHA.
            FOUND=0
            PAGE=1
            while [ "$PAGE" -le 30 ]; do
              COMMENTS="$(api_get "https://api.github.com/repos/${{ github.repository }}/issues/$PR_NUMBER/comments?per_page=100&page=$PAGE")"
              COUNT="$(jq 'length' <<<"$COMMENTS")"
              if jq -e --arg sha "$SHA" '
                any(.[];
                  .user.login == "github-actions[bot]" and
                  (.body | contains($sha)) and
                  ((.body | contains("[MANUS-AUDIT] MANUS: MERGE")) or
                   (.body | contains("[MANUS-AUDIT] MANUS: BLOCKER")))
                )' <<<"$COMMENTS" >/dev/null; then
                FOUND=1
                break
              fi
              [ "$COUNT" -eq 100 ] || break
              PAGE=$((PAGE + 1))
            done

            if [ "$FOUND" -eq 1 ]; then
              echo "PR #$PR_NUMBER already has a round-trip Manus verdict for $SHA."
              continue
            fi

            PAYLOAD="$(jq -n --arg pr "$PR_NUMBER" '{ref:"main", inputs:{pr_number:$pr}}')"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --url "https://api.github.com/repos/${{ github.repository }}/actions/workflows/manus-github-audit.yml/dispatches" \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --header 'Content-Type: application/json' \
              --data-binary "$PAYLOAD" >/dev/null

            echo "Dispatched Manus audit for PR #$PR_NUMBER at exact SHA $SHA."
            exit 0
          done

          echo 'All tracked P0 PRs are closed or already have a round-trip Manus verdict.'
