name: CrewCheck v13.9.0 diagnostics

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Prepare v13.9.0
        run: node scripts/v139/apply.mjs
      - name: Capture TypeScript
        shell: bash
        run: |
          set +e
          npx tsc --noEmit > v139-typescript.log 2>&1
          echo $? > v139-typescript.exit
          exit 0
      - name: Capture build
        shell: bash
        run: |
          set +e
          npm run build > v139-build.log 2>&1
          echo $? > v139-build.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: crewcheck-v139-diagnostics
          path: |
            v139-typescript.log
            v139-typescript.exit
            v139-build.log
            v139-build.exit
          if-no-files-found: error
          retention-days: 3
