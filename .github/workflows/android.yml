name: Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android-wrapper/**'
      - 'client/**'
      - 'server.mjs'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install web dependencies
        run: npm ci || npm install

      - name: Build web
        run: npm run build

      - name: Run release recovery regression
        run: node scripts/regression-v14-3-3-release-recovery.mjs

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate Android signing secrets
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for value in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!value}" ]; then
              echo "Missing secret: $value"
              missing=1
            fi
          done

          if [ "$missing" -eq 0 ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Signed release artifacts will be skipped; debug APK will still be published."
          fi

      - name: Decode upload keystore
        if: steps.signing.outputs.signed == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64_VALUE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64_VALUE" | tr -d '\r\n ' | base64 --decode > android-wrapper/app/upload-keystore.jks
          test -s android-wrapper/app/upload-keystore.jks
          chmod 600 android-wrapper/app/upload-keystore.jks

      - name: Build installable debug APK
        working-directory: android-wrapper
        run: gradle --no-daemon clean :app:assembleDebug --stacktrace

      - name: Stage installable APK artifact
        shell: bash
        run: |
          set -euo pipefail
          source_apk="android-wrapper/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$source_apk"
          mkdir -p "$RUNNER_TEMP/crewcheck-android"
          cp "$source_apk" "$RUNNER_TEMP/crewcheck-android/CrewCheck-installable.apk"
          sha256sum "$RUNNER_TEMP/crewcheck-android/CrewCheck-installable.apk" > "$RUNNER_TEMP/crewcheck-android/CrewCheck-installable.apk.sha256"

      - name: Build signed release APK
        if: steps.signing.outputs.signed == 'true'
        working-directory: android-wrapper
        env:
          CREWCHECK_STORE_FILE: upload-keystore.jks
          CREWCHECK_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CREWCHECK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CREWCHECK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease --stacktrace

      - name: Stage signed release APK artifact
        if: steps.signing.outputs.signed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source_apk="android-wrapper/app/build/outputs/apk/release/app-release.apk"
          test -s "$source_apk"
          mkdir -p "$RUNNER_TEMP/crewcheck-android"
          cp "$source_apk" "$RUNNER_TEMP/crewcheck-android/CrewCheck-release.apk"
          sha256sum "$RUNNER_TEMP/crewcheck-android/CrewCheck-release.apk" > "$RUNNER_TEMP/crewcheck-android/CrewCheck-release.apk.sha256"

      - name: Build signed release AAB
        if: steps.signing.outputs.signed == 'true'
        working-directory: android-wrapper
        env:
          CREWCHECK_STORE_FILE: upload-keystore.jks
          CREWCHECK_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CREWCHECK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CREWCHECK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:bundleRelease --stacktrace

      - name: Stage signed release AAB artifact
        if: steps.signing.outputs.signed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          source_aab="android-wrapper/app/build/outputs/bundle/release/app-release.aab"
          test -s "$source_aab"
          mkdir -p "$RUNNER_TEMP/crewcheck-android"
          cp "$source_aab" "$RUNNER_TEMP/crewcheck-android/CrewCheck-release.aab"
          sha256sum "$RUNNER_TEMP/crewcheck-android/CrewCheck-release.aab" > "$RUNNER_TEMP/crewcheck-android/CrewCheck-release.aab.sha256"

      - name: List Android outputs
        if: always()
        shell: bash
        run: |
          find android-wrapper/app/build/outputs -type f 2>/dev/null || true
          find "$RUNNER_TEMP/crewcheck-android" -type f 2>/dev/null || true

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: CrewCheck-installable-apk
          path: |
            ${{ runner.temp }}/crewcheck-android/CrewCheck-installable.apk
            ${{ runner.temp }}/crewcheck-android/CrewCheck-installable.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed release APK
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CrewCheck-release-apk
          path: |
            ${{ runner.temp }}/crewcheck-android/CrewCheck-release.apk
            ${{ runner.temp }}/crewcheck-android/CrewCheck-release.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed release AAB
        if: steps.signing.outputs.signed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CrewCheck-release-aab
          path: |
            ${{ runner.temp }}/crewcheck-android/CrewCheck-release.aab
            ${{ runner.temp }}/crewcheck-android/CrewCheck-release.aab.sha256
          if-no-files-found: error
          retention-days: 14
