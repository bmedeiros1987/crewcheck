name: Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android-wrapper/**'
      - 'client/**'
      - 'server.mjs'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.CREWCHECK_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 || secrets.KEYSTORE_FILE_BASE64 || secrets.SIGNING_KEY }}
      STORE_PASSWORD: ${{ secrets.CREWCHECK_STORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || secrets.ANDROID_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.KEY_STORE_PASSWORD || secrets.SIGNING_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.CREWCHECK_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS || secrets.ALIAS }}
      KEY_PASSWORD: ${{ secrets.CREWCHECK_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD }}
      CREWCHECK_STORE_FILE: ${{ github.workspace }}/android-wrapper/crewcheck-release.jks

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Install web dependencies
        run: npm ci || npm install

      - name: Prepare canonical CrewCheck sources
        shell: bash
        run: |
          set -euo pipefail
          node scripts/v139/apply.mjs
          node scripts/fix-v14-3-10-health-settings-action.mjs

          sed -i "s/id 'com.android.application' version '[^']*'/id 'com.android.application' version '8.11.1'/" android-wrapper/build.gradle
          sed -i -E 's/compileSdk[[:space:]]+[0-9]+/compileSdk 36/' android-wrapper/app/build.gradle

          wrapper_properties='android-wrapper/gradle/wrapper/gradle-wrapper.properties'
          if [[ ! -f "$wrapper_properties" || ! -f android-wrapper/gradlew || ! -f android-wrapper/gradle/wrapper/gradle-wrapper.jar ]]; then
            echo 'Gradle wrapper ausente ou incompleto; gerando wrapper 8.13.'
            (cd android-wrapper && gradle wrapper --gradle-version 8.13 --distribution-type bin)
          fi

          sed -i -E 's#distributionUrl=.*gradle-[0-9.]+-(bin|all)\.zip#distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip#' "$wrapper_properties"
          chmod +x android-wrapper/gradlew

          grep -Fq "id 'com.android.application' version '8.11.1'" android-wrapper/build.gradle
          grep -Fq "id 'org.jetbrains.kotlin.android' version '2.0.21'" android-wrapper/build.gradle
          grep -Eq 'compileSdk[[:space:]]+36' android-wrapper/app/build.gradle
          grep -Fq 'gradle-8.13-bin.zip' "$wrapper_properties"
          test -s android-wrapper/gradle/wrapper/gradle-wrapper.jar
          grep -Fq 'private CrewCheckHealthBridge healthBridge;' android-wrapper/app/src/main/java/com/crewcheck/app/MainActivity.java
          grep -Fq 'healthBridge.install();' android-wrapper/app/src/main/java/com/crewcheck/app/MainActivity.java
          grep -Fq 'webView.addJavascriptInterface(healthBridge, "AndroidCrewCheckHealth");' android-wrapper/app/src/main/java/com/crewcheck/app/MainActivity.java
          grep -Fq 'public String healthBridgePing()' android-wrapper/app/src/main/java/com/crewcheck/app/MainActivity.java
          grep -Fq 'public boolean healthBridgePostMessage(final String raw)' android-wrapper/app/src/main/java/com/crewcheck/app/MainActivity.java
          grep -Fq 'return healthBridge.postMessage(raw);' android-wrapper/app/src/main/java/com/crewcheck/app/MainActivity.java
          grep -Fq 'getPackageManager().getPackageInfo(getPackageName(), 0).versionName' android-wrapper/app/src/main/java/com/crewcheck/app/MainActivity.java
          ! grep -Fq 'BuildConfig.VERSION_NAME' android-wrapper/app/src/main/java/com/crewcheck/app/MainActivity.java
          grep -Fq '@JavascriptInterface' android-wrapper/app/src/main/java/com/crewcheck/app/CrewCheckHealthBridge.kt
          grep -Fq 'fun ping(): String = "crewcheck-health-v1"' android-wrapper/app/src/main/java/com/crewcheck/app/CrewCheckHealthBridge.kt
          grep -Fq 'fun postMessage(raw: String?): Boolean' android-wrapper/app/src/main/java/com/crewcheck/app/CrewCheckHealthBridge.kt
          grep -Fq 'openHealthConnectSettings()' android-wrapper/app/src/main/java/com/crewcheck/app/CrewCheckHealthBridge.kt
          grep -Fq 'val primary = Intent(HealthConnectClient.ACTION_HEALTH_CONNECT_SETTINGS)' android-wrapper/app/src/main/java/com/crewcheck/app/CrewCheckHealthBridge.kt
          grep -Fq 'primary.resolveActivity(activity.packageManager)' android-wrapper/app/src/main/java/com/crewcheck/app/CrewCheckHealthBridge.kt
          grep -Fq 'getLaunchIntentForPackage(HEALTH_CONNECT_PACKAGE) ?: return false' android-wrapper/app/src/main/java/com/crewcheck/app/CrewCheckHealthBridge.kt
          ! grep -Fq 'val intents = listOf(' android-wrapper/app/src/main/java/com/crewcheck/app/CrewCheckHealthBridge.kt
          ! grep -Fq 'val intents = listOfNotNull(' android-wrapper/app/src/main/java/com/crewcheck/app/CrewCheckHealthBridge.kt
          ! grep -Fq 'HealthConnectClient.getHealthConnectSettingsAction()' android-wrapper/app/src/main/java/com/crewcheck/app/CrewCheckHealthBridge.kt
          ! grep -Fq 'HealthConnectClient.getHealthConnectManageDataIntent(activity)' android-wrapper/app/src/main/java/com/crewcheck/app/CrewCheckHealthBridge.kt
          grep -Fq 'availability", "requesting"' android-wrapper/app/src/main/java/com/crewcheck/app/CrewCheckHealthBridge.kt
          grep -Fq 'function getAndroidBridge()' client/src/components/v1434/CrewCheckLifeView.tsx
          grep -Fq 'const stable = (window as any).CrewCheckHealth' client/src/components/v1434/CrewCheckLifeView.tsx
          grep -Fq 'accepted !== false' client/src/components/v1434/CrewCheckLifeView.tsx
          grep -Fq 'function manageAndroidAccess()' client/src/components/v1434/CrewCheckLifeView.tsx
          grep -Fq 'Gerenciar acesso' client/src/components/v1434/CrewCheckLifeView.tsx
          grep -Fq 'window.setInterval' client/src/components/v1434/CrewCheckLifeView.tsx

      - name: Verify public version before build
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if(p.version!=='14.3.10') throw new Error('Expected package version 14.3.10, got '+p.version)"
          grep -Fq "version: '14.3.10'" server.mjs
          grep -Fq 'versionName "14.3.10"' android-wrapper/app/build.gradle
          grep -Fq 'versionCode 140310' android-wrapper/app/build.gradle
          grep -Fq 'crewcheckLocationReplySender' server.mjs
          grep -Fq 'crewcheckSilentLocation' server.mjs
          grep -Fq 'crewcheckTelegramUpdateClaim(update)' server.mjs

      - name: Build prepared web sources
        run: npx vite build

      - name: Run final release regression
        run: node scripts/regression-v14-3-10-health-settings-compile.mjs

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Validate mandatory Play Console signing
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${KEYSTORE_BASE64:-}" ]] || missing+=("keystore base64")
          [[ -n "${STORE_PASSWORD:-}" ]] || missing+=("store password")
          [[ -n "${KEY_ALIAS:-}" ]] || missing+=("key alias")
          [[ -n "${KEY_PASSWORD:-}" ]] || missing+=("key password")
          if (( ${#missing[@]} )); then
            printf '::error::Assinatura obrigatória ausente: %s\n' "$(IFS=', '; echo "${missing[*]}")"
            exit 1
          fi

      - name: Decode and validate upload keystore
        shell: bash
        run: |
          set -euo pipefail
          encoded="${KEYSTORE_BASE64#base64:}"
          printf '%s' "$encoded" | tr -d '\r\n ' | base64 --decode > "$CREWCHECK_STORE_FILE"
          test -s "$CREWCHECK_STORE_FILE"
          chmod 600 "$CREWCHECK_STORE_FILE"
          keytool -list -keystore "$CREWCHECK_STORE_FILE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build signed release APK and AAB
        working-directory: android-wrapper
        env:
          CREWCHECK_STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          CREWCHECK_KEY_ALIAS: ${{ env.KEY_ALIAS }}
          CREWCHECK_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        shell: bash
        run: |
          set -uo pipefail
          ./gradlew --version
          set +e
          ./gradlew --no-daemon --console=plain clean :app:assembleRelease :app:bundleRelease --stacktrace 2>&1 | tee "$RUNNER_TEMP/android-build.log"
          build_status=${PIPESTATUS[0]}
          set -e
          if [[ "$build_status" -ne 0 ]]; then
            tail -n 240 "$RUNNER_TEMP/android-build.log" > "$RUNNER_TEMP/android-build-tail.log"
            first_error="$(grep -m1 -E '^e: |^error:|FAILURE:|\* What went wrong:' "$RUNNER_TEMP/android-build.log" || true)"
            echo "::error title=Android release build failed::${first_error:-Consulte o artefato CrewCheck-android-build-diagnostics.}"
            exit "$build_status"
          fi

      - name: Upload Android build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CrewCheck-android-build-diagnostics
          path: |
            ${{ runner.temp }}/android-build.log
            ${{ runner.temp }}/android-build-tail.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Inspect Health Connect bridge inside compiled APK
        shell: bash
        run: |
          set -euo pipefail
          apk='android-wrapper/app/build/outputs/apk/release/app-release.apk'
          test -s "$apk"
          inspect_dir="$RUNNER_TEMP/crewcheck-apk-inspect"
          rm -rf "$inspect_dir"
          mkdir -p "$inspect_dir"
          unzip -q "$apk" 'classes*.dex' -d "$inspect_dir"
          find "$inspect_dir" -name 'classes*.dex' -type f -print0 | xargs -0 strings > "$inspect_dir/dex-strings.txt"
          grep -Fq 'AndroidCrewCheckHealth' "$inspect_dir/dex-strings.txt"
          grep -Fq 'CrewCheckHealthBridge' "$inspect_dir/dex-strings.txt"
          grep -Fq 'crewcheck-health-v1' "$inspect_dir/dex-strings.txt"
          grep -Fq 'healthBridgePostMessage' "$inspect_dir/dex-strings.txt"
          grep -Fq 'openHealthConnectSettings' "$inspect_dir/dex-strings.txt"
          grep -Fq 'CrewCheckHealth' "$inspect_dir/dex-strings.txt"
          grep -Fq 'postMessage' "$inspect_dir/dex-strings.txt"
          echo 'Health Connect confirmável e gerenciamento de acesso encontrados dentro do APK Release.'

      - name: Verify and stage signed artifacts
        shell: bash
        run: |
          set -euo pipefail
          apk="android-wrapper/app/build/outputs/apk/release/app-release.apk"
          aab="android-wrapper/app/build/outputs/bundle/release/app-release.aab"
          test -s "$apk"
          test -s "$aab"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$apk"

          aab_verify_log="$RUNNER_TEMP/aab-jarsigner-verify.log"
          jarsigner -verify -verbose -certs "$aab" >"$aab_verify_log" 2>&1
          cat "$aab_verify_log"
          grep -Eq '^jar verified\.|^jar verified, with signer errors\.$' "$aab_verify_log"
          grep -Fq 'CN=CrewCheck Upload Key 2026 v2' "$aab_verify_log"

          mkdir -p "$RUNNER_TEMP/crewcheck-play"
          cp "$apk" "$RUNNER_TEMP/crewcheck-play/CrewCheck-signed-release.apk"
          cp "$aab" "$RUNNER_TEMP/crewcheck-play/CrewCheck-Play-Console.aab"
          (cd "$RUNNER_TEMP/crewcheck-play" && sha256sum CrewCheck-signed-release.apk CrewCheck-Play-Console.aab > SHA256SUMS.txt)

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: CrewCheck-signed-release-apk
          path: |
            ${{ runner.temp }}/crewcheck-play/CrewCheck-signed-release.apk
            ${{ runner.temp }}/crewcheck-play/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed Play Console AAB
        uses: actions/upload-artifact@v4
        with:
          name: CrewCheck-signed-play-console-aab
          path: |
            ${{ runner.temp }}/crewcheck-play/CrewCheck-Play-Console.aab
            ${{ runner.temp }}/crewcheck-play/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
