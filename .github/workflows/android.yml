name: Android AAB

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android-wrapper/**'
      - 'client/**'
      - 'server.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install web dependencies
        run: npm ci || npm install

      - name: Build web
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Decode upload keystore
        env:
          ANDROID_KEYSTORE_BASE64_VALUE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64_VALUE}" ]; then
            echo "${ANDROID_KEYSTORE_BASE64_VALUE}" | base64 --decode > android-wrapper/app/upload-keystore.jks
            echo "Upload keystore decoded"
          else
            echo "ANDROID_KEYSTORE_BASE64 not configured; building unsigned release artifact."
          fi

      - name: Build release AAB
        working-directory: android-wrapper
        env:
          CREWCHECK_STORE_FILE: app/upload-keystore.jks
          CREWCHECK_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CREWCHECK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CREWCHECK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --version
          gradle --no-daemon clean :app:bundleRelease --stacktrace

      - name: Build release APK fallback
        if: always()
        working-directory: android-wrapper
        env:
          CREWCHECK_STORE_FILE: app/upload-keystore.jks
          CREWCHECK_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CREWCHECK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CREWCHECK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon :app:assembleRelease --stacktrace || true

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CrewCheck-v13.2.0-android
          path: |
            android-wrapper/app/build/outputs/bundle/release/*.aab
            android-wrapper/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
