name: Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android-wrapper/**'
      - 'client/**'
      - 'server.mjs'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.CREWCHECK_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 || secrets.KEYSTORE_FILE_BASE64 || secrets.SIGNING_KEY }}
      STORE_PASSWORD: ${{ secrets.CREWCHECK_STORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || secrets.ANDROID_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.KEY_STORE_PASSWORD || secrets.SIGNING_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.CREWCHECK_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS || secrets.ALIAS }}
      KEY_PASSWORD: ${{ secrets.CREWCHECK_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD }}
      CREWCHECK_STORE_FILE: ${{ github.workspace }}/android-wrapper/crewcheck-release.jks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install web dependencies
        run: npm ci || npm install

      - name: Prepare canonical CrewCheck sources
        shell: bash
        run: |
          set -euo pipefail
          node scripts/v139/apply.mjs
          node scripts/v1424/apply.mjs

          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path('android-wrapper/build.gradle')
          source = path.read_text(encoding='utf-8')
          source = re.sub(
              r"id 'com\.android\.application' version '[^']+' apply false",
              "id 'com.android.application' version '8.7.3' apply false",
              source,
              count=1,
          )
          source = re.sub(
              r"\n\s*id 'org\.jetbrains\.kotlin\.android' version '[^']+' apply false",
              '',
              source,
          )
          path.write_text(source, encoding='utf-8')
          PY

          grep -Fq "id 'com.android.application' version '8.7.3' apply false" android-wrapper/build.gradle
          if grep -Fq "id 'org.jetbrains.kotlin.android'" android-wrapper/build.gradle; then
            echo '::error::Plugin Kotlin deveria estar ausente antes do patch v1434.'
            exit 1
          fi

          node scripts/v1433/apply.mjs

          python3 <<'PY'
          from pathlib import Path

          path = Path('android-wrapper/app/src/main/java/com/crewcheck/app/CrewCheckHealthBridge.kt')
          source = path.read_text(encoding='utf-8')

          if 'import android.webkit.JavascriptInterface' not in source:
              source = source.replace(
                  'import android.webkit.WebView\n',
                  'import android.webkit.JavascriptInterface\nimport android.webkit.WebView\n',
                  1,
              )

          old_install = '''    /** Deve ser chamado antes de WebView.loadUrl(). */
          fun install(): Boolean {
              if (installed) return true
              if (!WebViewFeature.isFeatureSupported(WebViewFeature.WEB_MESSAGE_LISTENER)) return false
              WebViewCompat.addWebMessageListener(webView, JS_OBJECT_NAME, TRUSTED_ORIGINS) {
                      _, message, sourceOrigin, isMainFrame, _ ->
                  if (!isMainFrame || !isTrustedOrigin(sourceOrigin)) return@addWebMessageListener
                  handleMessage(message.data)
              }
              installed = true
              return true
          }
          '''
          new_install = '''    /** Deve ser chamado antes de WebView.loadUrl(). */
          fun install(): Boolean {
              if (installed) return true
              webView.addJavascriptInterface(this, JS_OBJECT_NAME)
              installed = true
              return true
          }

          @JavascriptInterface
          fun postMessage(raw: String?) {
              val currentUrl = webView.url ?: return
              val currentOrigin = try { Uri.parse(currentUrl) } catch (_: Exception) { return }
              if (!isTrustedOrigin(currentOrigin)) return
              handleMessage(raw)
          }
          '''
          if old_install in source:
              source = source.replace(old_install, new_install, 1)
          elif '@JavascriptInterface\n    fun postMessage(raw: String?)' not in source:
              raise SystemExit('Health Connect bridge install block not found')

          path.write_text(source, encoding='utf-8')
          PY

          sed -i "s/id 'com.android.application' version '[^']*'/id 'com.android.application' version '8.11.1'/" android-wrapper/build.gradle
          sed -i -E 's/compileSdk[[:space:]]+[0-9]+/compileSdk 36/' android-wrapper/app/build.gradle

          wrapper_properties='android-wrapper/gradle/wrapper/gradle-wrapper.properties'
          if [[ ! -f "$wrapper_properties" ]]; then
            echo '::error::Gradle wrapper properties não foi gerado pelos patches.'
            exit 1
          fi
          sed -i -E 's#distributionUrl=.*gradle-[0-9.]+-(bin|all)\.zip#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.13-bin.zip#' "$wrapper_properties"
          chmod +x android-wrapper/gradlew

          grep -Fq "id 'com.android.application' version '8.11.1'" android-wrapper/build.gradle
          grep -Fq "id 'org.jetbrains.kotlin.android' version '2.0.21'" android-wrapper/build.gradle
          grep -Eq 'compileSdk[[:space:]]+36' android-wrapper/app/build.gradle
          grep -Fq 'gradle-8.13-bin.zip' "$wrapper_properties"
          grep -Fq 'private CrewCheckHealthBridge healthBridge;' android-wrapper/app/src/main/java/com/crewcheck/app/MainActivity.java
          grep -Fq 'healthBridge.install();' android-wrapper/app/src/main/java/com/crewcheck/app/MainActivity.java
          grep -Fq '@JavascriptInterface' android-wrapper/app/src/main/java/com/crewcheck/app/CrewCheckHealthBridge.kt
          grep -Fq 'fun postMessage(raw: String?)' android-wrapper/app/src/main/java/com/crewcheck/app/CrewCheckHealthBridge.kt

      - name: Verify public version before build
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if(p.version!=='14.3.6') throw new Error('Expected package version 14.3.6, got '+p.version)"
          grep -Fq "version: '14.3.6'" server.mjs
          grep -Fq 'versionName "14.3.6"' android-wrapper/app/build.gradle
          grep -Fq 'versionCode 140306' android-wrapper/app/build.gradle
          grep -Fq 'crewcheckLocationReplySender' server.mjs
          grep -Fq 'crewcheckSilentLocation' server.mjs
          grep -Fq 'crewcheckTelegramUpdateClaim(update)' server.mjs

      - name: Build prepared web sources
        run: npx vite build

      - name: Run final release regression
        run: node scripts/regression-v14-3-6-visitor-loading.mjs

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate mandatory Play Console signing
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${KEYSTORE_BASE64:-}" ]] || missing+=("keystore base64")
          [[ -n "${STORE_PASSWORD:-}" ]] || missing+=("store password")
          [[ -n "${KEY_ALIAS:-}" ]] || missing+=("key alias")
          [[ -n "${KEY_PASSWORD:-}" ]] || missing+=("key password")
          if (( ${#missing[@]} )); then
            printf '::error::Assinatura obrigatória ausente: %s\n' "$(IFS=', '; echo "${missing[*]}")"
            exit 1
          fi

      - name: Decode and validate upload keystore
        shell: bash
        run: |
          set -euo pipefail
          encoded="${KEYSTORE_BASE64#base64:}"
          printf '%s' "$encoded" | tr -d '\r\n ' | base64 --decode > "$CREWCHECK_STORE_FILE"
          test -s "$CREWCHECK_STORE_FILE"
          chmod 600 "$CREWCHECK_STORE_FILE"
          keytool -list \
            -keystore "$CREWCHECK_STORE_FILE" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

      - name: Build signed release APK and AAB
        working-directory: android-wrapper
        env:
          CREWCHECK_STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          CREWCHECK_KEY_ALIAS: ${{ env.KEY_ALIAS }}
          CREWCHECK_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --version
          ./gradlew --no-daemon clean :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify and stage signed artifacts
        shell: bash
        run: |
          set -euo pipefail
          apk="android-wrapper/app/build/outputs/apk/release/app-release.apk"
          aab="android-wrapper/app/build/outputs/bundle/release/app-release.aab"
          test -s "$apk"
          test -s "$aab"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$apk"

          aab_verify_log="$RUNNER_TEMP/aab-jarsigner-verify.log"
          jarsigner -verify -verbose -certs "$aab" >"$aab_verify_log" 2>&1
          cat "$aab_verify_log"
          grep -Eq '^jar verified\.|^jar verified, with signer errors\.$' "$aab_verify_log"
          grep -Fq 'CN=CrewCheck Upload Key 2026 v2' "$aab_verify_log"

          mkdir -p "$RUNNER_TEMP/crewcheck-play"
          cp "$apk" "$RUNNER_TEMP/crewcheck-play/CrewCheck-signed-release.apk"
          cp "$aab" "$RUNNER_TEMP/crewcheck-play/CrewCheck-Play-Console.aab"
          (
            cd "$RUNNER_TEMP/crewcheck-play"
            sha256sum CrewCheck-signed-release.apk CrewCheck-Play-Console.aab > SHA256SUMS.txt
          )

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: CrewCheck-signed-release-apk
          path: |
            ${{ runner.temp }}/crewcheck-play/CrewCheck-signed-release.apk
            ${{ runner.temp }}/crewcheck-play/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed Play Console AAB
        uses: actions/upload-artifact@v4
        with:
          name: CrewCheck-signed-play-console-aab
          path: |
            ${{ runner.temp }}/crewcheck-play/CrewCheck-Play-Console.aab
            ${{ runner.temp }}/crewcheck-play/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
