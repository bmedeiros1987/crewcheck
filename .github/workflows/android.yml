name: Android signed store bundles

on:
  pull_request:
    paths:
      - 'android-wrapper/**'
      - 'scripts/android-play/**'
      - 'scripts/crewlife-wellness/**'
      - 'scripts/v139/apply.mjs'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'android-wrapper/**'
      - 'client/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:
    inputs:
      publish_internal_drafts:
        description: 'Save verified bundles as internal test drafts (main only; requires existing Play credential)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: crewcheck-play-release
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.CREWCHECK_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.CREWCHECK_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.CREWCHECK_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.CREWCHECK_KEY_PASSWORD }}
      CREWCHECK_STORE_FILE: ${{ github.workspace }}/android-wrapper/crewcheck-release.jks
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - run: npm ci
      - name: Prepare canonical sources and final store policy
        run: node scripts/v139/apply.mjs
      - name: Test negative publication gates
        run: python3 scripts/android-play/test_validate.py
      - name: Web and privacy validation
        run: |
          npx tsc --noEmit
          npx vite build
          node scripts/regression-crewwatch-premium-consolidated.mjs
          node scripts/regression-watch-first-sync.mjs
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - name: Restore existing signing key and derive expected certificate
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          umask 077
          printf '%s' "${KEYSTORE_BASE64#base64:}" | tr -d '\r\n ' | base64 --decode > "$CREWCHECK_STORE_FILE"
          keytool -exportcert -keystore "$CREWCHECK_STORE_FILE" -storepass:env STORE_PASSWORD -alias "$KEY_ALIAS" -file "$RUNNER_TEMP/upload-cert.der"
          echo "EXPECTED_UPLOAD_CERT_SHA256=$(sha256sum "$RUNNER_TEMP/upload-cert.der" | cut -d ' ' -f1)" >> "$GITHUB_ENV"
      - name: Compile Samsung debug adapter against official SDK
        run: gradle -p android-wrapper --no-daemon --console=plain -PcrewcheckSamsung=true :app:assembleDebug
      - name: Test and build separate signed bundles
        env:
          CREWCHECK_STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          CREWCHECK_KEY_ALIAS: ${{ env.KEY_ALIAS }}
          CREWCHECK_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          gradle -p android-wrapper --no-daemon --console=plain :wear:testDebugUnitTest :wear:lintDebug :app:bundleRelease :wear:bundleRelease :watchface:bundleRelease
      - name: Download pinned official bundletool
        run: curl --fail --location --retry 3 https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar -o "$RUNNER_TEMP/bundletool.jar"
      - name: Verify actual bundle manifests, signing and destinations
        run: python3 scripts/android-play/validate.py --bundletool "$RUNNER_TEMP/bundletool.jar" --output "$RUNNER_TEMP/play-bundles"
      - name: Upload mobile AAB
        uses: actions/upload-artifact@v4
        with:
          name: CrewCheck-mobile-AAB
          path: ${{ runner.temp }}/play-bundles/CrewCheck-app-*.aab
          if-no-files-found: error
      - name: Upload Wear OS AAB
        uses: actions/upload-artifact@v4
        with:
          name: CrewCheck-WearOS-AAB
          path: ${{ runner.temp }}/play-bundles/CrewCheck-wear-*.aab
          if-no-files-found: error
      - name: Upload watch face AAB
        uses: actions/upload-artifact@v4
        with:
          name: CrewCheck-WatchFace-AAB
          path: ${{ runner.temp }}/play-bundles/CrewCheck-watchface-*.aab
          if-no-files-found: error
      - name: Upload verified release and evidence
        uses: actions/upload-artifact@v4
        with:
          name: CrewCheck-verified-play-bundles
          path: ${{ runner.temp }}/play-bundles/
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$CREWCHECK_STORE_FILE" "$RUNNER_TEMP/upload-cert.der"

  publish-internal-drafts:
    needs: build
    if: github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.publish_internal_drafts) || (github.event_name == 'push' && vars.PLAY_INTERNAL_AUTO_PUBLISH == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
      - name: Require existing credential
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo '::error::PLAY_SERVICE_ACCOUNT_JSON is not configured. Verified AAB downloads remain available; no Play changes were made.'
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: CrewCheck-verified-play-bundles
          path: verified-bundles
      - run: python3 -m pip install 'google-auth==2.40.3' 'requests==2.32.4'
      - name: Check live version codes and save internal drafts only
        run: python3 scripts/android-play/publish.py verified-bundles
