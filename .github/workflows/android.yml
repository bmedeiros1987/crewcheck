name: Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android-wrapper/**'
      - 'client/**'
      - 'server.mjs'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.CREWCHECK_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 || secrets.KEYSTORE_FILE_BASE64 || secrets.SIGNING_KEY }}
      STORE_PASSWORD: ${{ secrets.CREWCHECK_STORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || secrets.ANDROID_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.KEY_STORE_PASSWORD || secrets.SIGNING_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.CREWCHECK_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS || secrets.ALIAS }}
      KEY_PASSWORD: ${{ secrets.CREWCHECK_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD }}
      CREWCHECK_STORE_FILE: ${{ github.workspace }}/android-wrapper/crewcheck-release.jks

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install web dependencies
        run: npm ci || npm install

      - name: Prepare canonical CrewCheck sources
        shell: bash
        run: |
          set -euo pipefail
          node scripts/v139/apply.mjs
          node scripts/v1424/apply.mjs
          node scripts/v1433/apply.mjs

      - name: Verify public version before build
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if(p.version!=='14.3.3') throw new Error('Expected package version 14.3.3, got '+p.version)"
          grep -Fq "version: '14.3.3'" server.mjs
          grep -Fq 'versionName "14.3.3"' android-wrapper/app/build.gradle
          grep -Fq 'versionCode 140303' android-wrapper/app/build.gradle
          grep -Fq 'crewcheckLocationReplySender' server.mjs
          grep -Fq 'crewcheckSilentLocation' server.mjs
          grep -Fq 'crewcheckTelegramUpdateClaim(update)' server.mjs

      - name: Build prepared web sources
        run: npx vite build

      - name: Run release recovery regression
        run: node scripts/regression-v14-3-3-release-recovery.mjs

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Validate mandatory Play Console signing
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${KEYSTORE_BASE64:-}" ]] || missing+=("keystore base64")
          [[ -n "${STORE_PASSWORD:-}" ]] || missing+=("store password")
          [[ -n "${KEY_ALIAS:-}" ]] || missing+=("key alias")
          [[ -n "${KEY_PASSWORD:-}" ]] || missing+=("key password")
          if (( ${#missing[@]} )); then
            printf '::error::Assinatura obrigatória ausente: %s\n' "$(IFS=', '; echo "${missing[*]}")"
            exit 1
          fi

      - name: Decode and validate upload keystore
        shell: bash
        run: |
          set -euo pipefail
          encoded="${KEYSTORE_BASE64#base64:}"
          printf '%s' "$encoded" | tr -d '\r\n ' | base64 --decode > "$CREWCHECK_STORE_FILE"
          test -s "$CREWCHECK_STORE_FILE"
          chmod 600 "$CREWCHECK_STORE_FILE"
          keytool -list \
            -keystore "$CREWCHECK_STORE_FILE" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

      - name: Build signed release APK and AAB
        working-directory: android-wrapper
        env:
          CREWCHECK_STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          CREWCHECK_KEY_ALIAS: ${{ env.KEY_ALIAS }}
          CREWCHECK_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon clean :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify and stage signed artifacts
        shell: bash
        run: |
          set -euo pipefail
          apk="android-wrapper/app/build/outputs/apk/release/app-release.apk"
          aab="android-wrapper/app/build/outputs/bundle/release/app-release.aab"
          test -s "$apk"
          test -s "$aab"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$apk"
          jarsigner -verify -strict -certs "$aab"

          mkdir -p "$RUNNER_TEMP/crewcheck-play"
          cp "$apk" "$RUNNER_TEMP/crewcheck-play/CrewCheck-signed-release.apk"
          cp "$aab" "$RUNNER_TEMP/crewcheck-play/CrewCheck-Play-Console.aab"
          (
            cd "$RUNNER_TEMP/crewcheck-play"
            sha256sum CrewCheck-signed-release.apk CrewCheck-Play-Console.aab > SHA256SUMS.txt
          )

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: CrewCheck-signed-release-apk
          path: |
            ${{ runner.temp }}/crewcheck-play/CrewCheck-signed-release.apk
            ${{ runner.temp }}/crewcheck-play/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed Play Console AAB
        uses: actions/upload-artifact@v4
        with:
          name: CrewCheck-signed-play-console-aab
          path: |
            ${{ runner.temp }}/crewcheck-play/CrewCheck-Play-Console.aab
            ${{ runner.temp }}/crewcheck-play/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: List Android outputs on failure
        if: failure()
        shell: bash
        run: |
          find android-wrapper/app/build/outputs -type f 2>/dev/null || true
          find "$RUNNER_TEMP/crewcheck-play" -type f 2>/dev/null || true
