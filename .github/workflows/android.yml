name: Android APK and AAB

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-wrapper/**'
      - 'client/**'
      - 'server.mjs'
      - 'server/**'
      - 'scripts/**'
      - 'migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.*'
      - '.github/workflows/android.yml'

permissions:
  contents: read

concurrency:
  group: crewcheck-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.CREWCHECK_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 || secrets.KEYSTORE_FILE_BASE64 || secrets.SIGNING_KEY }}
      STORE_PASSWORD: ${{ secrets.CREWCHECK_STORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || secrets.ANDROID_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.KEY_STORE_PASSWORD || secrets.SIGNING_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.CREWCHECK_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS || secrets.ALIAS }}
      KEY_PASSWORD: ${{ secrets.CREWCHECK_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD }}
      CREWCHECK_STORE_FILE: ${{ github.workspace }}/android-wrapper/crewcheck-release.jks

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Install web dependencies
        run: npm ci || npm install

      - name: Prepare current CrewCheck sources
        shell: bash
        run: |
          set -euo pipefail
          node scripts/v139/apply.mjs 2>&1 | tee "$RUNNER_TEMP/crewcheck-prepare.log"

          version="$(node -p "require('./package.json').version")"
          version_code="$(node -e "const [a,b,c]=require('./package.json').version.split('.').map(Number); if (![a,b,c].every(Number.isInteger)) process.exit(1); process.stdout.write(String(a*10000+b*100+c));")"
          echo "CrewCheck version: $version ($version_code)"
          echo "CREWCHECK_VERSION=$version" >> "$GITHUB_ENV"
          echo "CREWCHECK_VERSION_CODE=$version_code" >> "$GITHUB_ENV"

          sed -i -E "s/versionName[[:space:]]+\"[^\"]+\"/versionName \"$version\"/" android-wrapper/app/build.gradle
          sed -i -E "s/versionCode[[:space:]]+[0-9]+/versionCode $version_code/" android-wrapper/app/build.gradle
          sed -i "s/id 'com.android.application' version '[^']*'/id 'com.android.application' version '8.11.1'/" android-wrapper/build.gradle
          sed -i -E 's/compileSdk[[:space:]]+[0-9]+/compileSdk 36/' android-wrapper/app/build.gradle

          wrapper_properties='android-wrapper/gradle/wrapper/gradle-wrapper.properties'
          if [[ ! -f "$wrapper_properties" || ! -f android-wrapper/gradlew || ! -f android-wrapper/gradle/wrapper/gradle-wrapper.jar ]]; then
            echo 'Gradle wrapper ausente ou incompleto; gerando wrapper 8.13.'
            (cd android-wrapper && gradle wrapper --gradle-version 8.13 --distribution-type bin)
          fi
          sed -i -E 's#distributionUrl=.*gradle-[0-9.]+-(bin|all)\.zip#distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip#' "$wrapper_properties"
          chmod +x android-wrapper/gradlew

      - name: Verify current version, Control Center, Life, theme and Health Connect flow
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs'); const p=require('./package.json'); const expected=process.env.CREWCHECK_VERSION; if(p.version!==expected) throw new Error('Expected '+expected+', got '+p.version); const server=fs.readFileSync('server.mjs','utf8'); if(!server.includes(\"version: '\"+expected+\"'\")) throw new Error('server.mjs does not expose '+expected);"
          grep -Fq "versionName \"${CREWCHECK_VERSION}\"" android-wrapper/app/build.gradle
          grep -Fq "versionCode ${CREWCHECK_VERSION_CODE}" android-wrapper/app/build.gradle
          grep -Fq "id 'com.android.application' version '8.11.1'" android-wrapper/build.gradle
          grep -Fq "id 'org.jetbrains.kotlin.android' version '2.0.21'" android-wrapper/build.gradle
          grep -Eq 'compileSdk[[:space:]]+36' android-wrapper/app/build.gradle
          grep -Fq 'androidx.health.connect:connect-client:1.1.0' android-wrapper/app/build.gradle
          grep -Fq 'HealthConnectClient.getHealthConnectManageDataIntent(activity, HEALTH_CONNECT_PACKAGE)' android-wrapper/app/src/main/java/com/crewcheck/app/CrewCheckHealthBridge.kt
          grep -Fq 'fun refreshFromHost()' android-wrapper/app/src/main/java/com/crewcheck/app/CrewCheckHealthBridge.kt
          grep -Fq 'healthBridge.refreshFromHost()' android-wrapper/app/src/main/java/com/crewcheck/app/MainActivity.java
          ! grep -Fq 'android.health.connect.action.MANAGE_HEALTH_PERMISSIONS' android-wrapper/app/src/main/java/com/crewcheck/app/CrewCheckHealthBridge.kt

          test -s server/v14316/controlCenter.mjs
          test -s server/v14316/telegramLocation.mjs
          test -s client/src/components/v14316/GuardianCenterView.tsx
          test -s client/src/components/v14316/SupportCenterView.tsx
          test -s client/src/components/v14316/AdminControlCenter.tsx
          test -s client/src/pages/GuardianPublicPage.tsx
          test -s client/src/lib/themeRuntime.ts
          test -s client/src/theme-v14-3-17.css
          test -s client/src/theme-v14-3-19.css
          test -s migrations/20260723_014_v14316_guardian_support_metrics.sql

          grep -Fq 'aes-256-gcm' server/v14316/controlCenter.mjs
          grep -Fq 'CREWCHECK_SUPPORT_TICKET_V1' server/v14316/controlCenter.mjs
          grep -Fq "privacyMode: 'aggregate-only'" server/v14316/controlCenter.mjs
          grep -Fq "rankPreference: 'DISTANCE'" server/v14316/telegramLocation.mjs
          grep -Fq 'request_location: true' server/v14316/telegramLocation.mjs
          grep -Fq 'data-health-sync="continuous"' client/src/components/v1434/CrewCheckLifeView.tsx
          grep -Fq 'window.setInterval(refresh, 60_000)' client/src/components/v1434/CrewCheckLifeView.tsx
          grep -Fq 'refreshSmartDepartureLocation' client/src/pages/Home.tsx
          grep -Fq '.filter(visitorRealDay)' client/src/pages/VisitorAccessPage.tsx
          grep -Fq 'conciergeLayoverAwareReply' server/v1403/premium-helpers.snippet
          grep -Fq 'CREWCHECK_FOUNDER_PHOTO' client/src/pages/AboutUsPage.tsx
          grep -Fqi 'quem constrói o crewcheck' client/src/pages/AboutUsPage.tsx
          grep -Fq 'CrewCheck v14.3.16' client/public/manual.html
          grep -Fq "ORDER: CrewCheckThemePreference[] = ['system', 'light', 'dark']" client/src/lib/themeRuntime.ts
          grep -Fq 'Aparência: Automático' client/src/theme-v14-3-17.css
          grep -Fq 'theme-v14-3-19.css' client/src/main.tsx
          ! grep -Eq ',[[:space:]]*@media' client/src/theme-v14-3-17.css

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build web client
        run: npx vite build

      - name: Run aviation and family regression
        run: node scripts/regression-v14-3-14-aviation-family.mjs

      - name: Run daily guide regression
        run: node scripts/regression-v14-3-15-daily-guide.mjs

      - name: Run Control Center regression
        run: node scripts/regression-v14-3-16-control-center.mjs

      - name: Run theme and layout regression
        run: node scripts/regression-v14-3-17-theme-layout.mjs

      - name: Run structural layout regression
        run: node scripts/regression-v14-3-19-layout-structure.mjs

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Validate Play Console signing secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${KEYSTORE_BASE64:-}" ]] || missing+=("keystore base64")
          [[ -n "${STORE_PASSWORD:-}" ]] || missing+=("store password")
          [[ -n "${KEY_ALIAS:-}" ]] || missing+=("key alias")
          [[ -n "${KEY_PASSWORD:-}" ]] || missing+=("key password")
          if (( ${#missing[@]} )); then
            printf '::error::Assinatura obrigatória ausente: %s\n' "$(IFS=', '; echo "${missing[*]}")"
            exit 1
          fi

      - name: Decode and validate upload keystore
        shell: bash
        run: |
          set -euo pipefail
          encoded="${KEYSTORE_BASE64#base64:}"
          printf '%s' "$encoded" | tr -d '\r\n ' | base64 --decode > "$CREWCHECK_STORE_FILE"
          test -s "$CREWCHECK_STORE_FILE"
          chmod 600 "$CREWCHECK_STORE_FILE"
          keytool -list -keystore "$CREWCHECK_STORE_FILE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build signed release APK and AAB
        working-directory: android-wrapper
        env:
          CREWCHECK_STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          CREWCHECK_KEY_ALIAS: ${{ env.KEY_ALIAS }}
          CREWCHECK_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        shell: bash
        run: |
          set -uo pipefail
          ./gradlew --version
          set +e
          ./gradlew --no-daemon --console=plain clean :app:assembleRelease :app:bundleRelease --stacktrace 2>&1 | tee "$RUNNER_TEMP/android-build.log"
          build_status=${PIPESTATUS[0]}
          set -e
          if [[ "$build_status" -ne 0 ]]; then
            tail -n 300 "$RUNNER_TEMP/android-build.log" > "$RUNNER_TEMP/android-build-tail.log"
            first_error="$(grep -m1 -E '^e: |^error:|FAILURE:|\* What went wrong:' "$RUNNER_TEMP/android-build.log" || true)"
            echo "::error title=Android release build failed::${first_error:-Consulte CrewCheck-android-build-diagnostics.}"
            exit "$build_status"
          fi

      - name: Upload Android build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CrewCheck-android-build-diagnostics
          path: |
            ${{ runner.temp }}/crewcheck-prepare.log
            ${{ runner.temp }}/android-build.log
            ${{ runner.temp }}/android-build-tail.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Inspect native bridge inside APK
        shell: bash
        run: |
          set -euo pipefail
          apk='android-wrapper/app/build/outputs/apk/release/app-release.apk'
          test -s "$apk"
          inspect_dir="$RUNNER_TEMP/crewcheck-apk-inspect"
          rm -rf "$inspect_dir"
          mkdir -p "$inspect_dir"
          unzip -q "$apk" 'classes*.dex' -d "$inspect_dir"
          find "$inspect_dir" -name 'classes*.dex' -type f -print0 | xargs -0 strings > "$inspect_dir/dex-strings.txt"
          grep -Fq 'CrewCheckHealthBridge' "$inspect_dir/dex-strings.txt"
          grep -Fq 'crewcheck-health-v1' "$inspect_dir/dex-strings.txt"
          grep -Fq 'openHealthConnect' "$inspect_dir/dex-strings.txt"
          grep -Fq 'refreshFromHost' "$inspect_dir/dex-strings.txt"
          grep -Fq 'getHealthConnectManageDataIntent' "$inspect_dir/dex-strings.txt"
          ! grep -Fq 'MANAGE_HEALTH_PERMISSIONS' "$inspect_dir/dex-strings.txt"

      - name: Verify and stage signed artifacts
        shell: bash
        run: |
          set -euo pipefail
          apk='android-wrapper/app/build/outputs/apk/release/app-release.apk'
          aab='android-wrapper/app/build/outputs/bundle/release/app-release.aab'
          test -s "$apk"
          test -s "$aab"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$apk"

          aab_log="$RUNNER_TEMP/aab-jarsigner-verify.log"
          jarsigner -verify -verbose -certs "$aab" > "$aab_log" 2>&1
          cat "$aab_log"
          grep -Eq '^jar verified\.|^jar verified, with signer errors\.$' "$aab_log"
          ! grep -Fqi 'jar is unsigned' "$aab_log"

          mkdir -p "$RUNNER_TEMP/crewcheck-play"
          cp "$apk" "$RUNNER_TEMP/crewcheck-play/CrewCheck-signed-release.apk"
          cp "$aab" "$RUNNER_TEMP/crewcheck-play/CrewCheck-Play-Console.aab"
          (cd "$RUNNER_TEMP/crewcheck-play" && sha256sum CrewCheck-signed-release.apk CrewCheck-Play-Console.aab > SHA256SUMS.txt)

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: CrewCheck-signed-release-apk
          path: |
            ${{ runner.temp }}/crewcheck-play/CrewCheck-signed-release.apk
            ${{ runner.temp }}/crewcheck-play/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed Play Console AAB
        uses: actions/upload-artifact@v4
        with:
          name: CrewCheck-signed-play-console-aab
          path: |
            ${{ runner.temp }}/crewcheck-play/CrewCheck-Play-Console.aab
            ${{ runner.temp }}/crewcheck-play/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
