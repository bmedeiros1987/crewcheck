name: AIMS pre-action comparative diagnosis (DO NOT MERGE)
on:
  pull_request:
    branches: [fix/roster-daily-allowance-scope-20261024]
    paths:
      - 'scripts/ci/prefer-ubuntu-archive.py'
      - 'scripts/ci/test-prefer-ubuntu-archive.py'
      - 'scripts/ci/test-browser-mirror-coverage.py'
      - 'scripts/diagnose-aims-preaction.cjs'
      - '.github/workflows/aims-document-browser.yml'
permissions:
  contents: read
jobs:
  preaction-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: exact-base
            ref: d4deb413e67537a10aed78012bdb6c07fe71a09d
          - name: financial-head
            ref: f0820b705c09d9ceeab3c253ba69ffd9ae54d8d2
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Preserve diagnostic harness outside checkout
        run: cp scripts/diagnose-aims-preaction.cjs "$RUNNER_TEMP/diagnose-aims-preaction.cjs"
      - uses: actions/checkout@v6
        with:
          ref: ${{ matrix.target.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prepare and build exact target
        run: |
          node scripts/v139/apply.mjs
          npx tsc --noEmit
          node scripts/p1-concierge-journey/compile.mjs
          npx vite build
      - name: Prefer Ubuntu archive for browser system dependencies
        run: |
          python3 scripts/ci/test-prefer-ubuntu-archive.py
          python3 scripts/ci/test-browser-mirror-coverage.py
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            python3 scripts/ci/prefer-ubuntu-archive.py /etc/apt/apt-mirrors.txt > "$RUNNER_TEMP/browser-apt-mirrors.txt"
            sudo install -m 644 "$RUNNER_TEMP/browser-apt-mirrors.txt" /etc/apt/apt-mirrors.txt
          fi
      - name: Install isolated browser runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/aims-browser" --ignore-scripts --no-audit --no-fund playwright@1.55.0
          node "$RUNNER_TEMP/aims-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Compare original, stabilization and non-activating actionability preparation
        env:
          MENU_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/aims-browser/package.json
        run: node "$RUNNER_TEMP/diagnose-aims-preaction.cjs"
      - name: Save exact-ref synthetic evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aims-preaction-${{ matrix.target.name }}
          path: artifacts/aims-preaction-compare/
          if-no-files-found: error
