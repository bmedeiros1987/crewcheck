name: P1 #530 mobile active-roster Care parity
on:
  pull_request:
    paths:
      - 'client/src/pages/Home.tsx'
      - 'client/src/components/v1391/RosterLaunchView.tsx'
      - 'scripts/regression-p1-530-mobile-account-roster-care-parity.mjs'
      - 'scripts/roster-startup/**'
      - 'client/src/lib/rosterStartup.ts'
      - 'client/src/lib/rosterPublicationRuntime.ts'
      - '.github/workflows/p1-530-mobile-account-roster-care-parity.yml'
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prepare canonical production runtime
        run: node scripts/v139/apply.mjs
      - name: Reproduce mobile stale-cache and Care parity contract
        run: node scripts/regression-p1-530-mobile-account-roster-care-parity.mjs
      - run: node scripts/regression-account-active-reconciliation.mjs
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Production build of already prepared runtime
        run: npx vite build
