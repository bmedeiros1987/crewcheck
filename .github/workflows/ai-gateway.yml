name: AI Gateway

on:
  pull_request:
    paths:
      - 'server/ai/**'
      - 'docs/AI_GATEWAY.md'
      - '.github/workflows/ai-gateway.yml'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'server/ai/**'
      - 'package.json'

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:ai-gateway
