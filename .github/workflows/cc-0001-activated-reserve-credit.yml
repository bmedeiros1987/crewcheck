name: CrewCheck CC-0001 activated reserve credit

on:
  pull_request:
    paths:
      - 'client/src/lib/financialReserveCredits.ts'
      - 'client/src/pages/Home.tsx'
      - 'scripts/v139/apply.mjs'
      - 'scripts/v14385/apply.mjs'
      - 'scripts/regression-cc-0001-activated-reserve-credit.mjs'
      - '.github/workflows/cc-0001-activated-reserve-credit.yml'
  push:
    branches:
      - fix/cc-0001-activated-reserve-credit

jobs:
  activated-reserve-credit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Prepare canonical source
        run: node scripts/v139/apply.mjs
      - name: Dedicated CC-0001 reserve regression
        run: node scripts/regression-cc-0001-activated-reserve-credit.mjs
      - name: TypeScript
        run: npx tsc --noEmit
