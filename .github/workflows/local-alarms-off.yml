name: Local alarms and in-flight rest (OFF)
on:
  pull_request:
    paths:
      - 'android-wrapper/app/src/main/java/com/crewcheck/app/LocalAlarm*.java'
      - 'android-wrapper/app/src/main/java/com/crewcheck/app/NotificationLedger*.java'
      - 'android-wrapper/app/src/main/java/com/crewcheck/app/NotificationIdentity.java'
      - 'android-wrapper/app/src/main/java/com/crewcheck/app/NotificationTiming.java'
      - 'android-wrapper/app/src/main/AndroidManifest.xml'
      - 'shared/inflightRestPlan.mjs'
      - 'shared/inflightRestPlan.d.mts'
      - 'client/src/lib/localAlarms.ts'
      - 'client/src/lib/inflightRestAlarm.ts'
      - 'client/src/components/inflight-rest/**'
      - 'shared/reportReminderPlan.mjs'
      - 'shared/reportReminderPlan.d.mts'
      - 'client/src/lib/reportReminders.ts'
      - 'client/src/pages/Home.tsx'
      - 'scripts/regression-report-reminders.mjs'
      - 'scripts/fixtures/LocalAlarmLedgerFixture.java'
      - 'scripts/regression-local-alarm-ledger.mjs'
      - 'scripts/regression-local-alarm-client.mjs'
      - 'scripts/regression-inflight-rest-plan.mjs'
      - 'docs/local-alarms-off.md'
      - '.github/workflows/local-alarms-off.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: In-flight rest planner
        run: node scripts/regression-inflight-rest-plan.mjs
      - name: Native grouped local alarm ledger (fake OS)
        run: node scripts/regression-local-alarm-ledger.mjs
      - name: Client bridge validation and OFF view
        run: node scripts/regression-local-alarm-client.mjs
      - name: Report reminders (Home clock parity)
        run: node scripts/regression-report-reminders.mjs
      - name: Existing reminder fence and receiver
        run: |
          node scripts/regression-native-reminder-cancellation.mjs
          node scripts/regression-android-alarm-acceptance.mjs
      - run: npm run check
