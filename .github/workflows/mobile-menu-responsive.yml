name: Mobile menu responsive browser

on:
  pull_request:
    branches: [main]
    paths:
      - 'client/src/styles/**'
      - 'client/src/lib/textSizePreference.ts'
      - 'client/src/lib/overlayLifecycle.ts'
      - 'client/src/components/TextSizeSetting.tsx'
      - 'client/src/components/MoneyText.tsx'
      - 'scripts/regression-financial-ui-browser.cjs'
      - 'scripts/regression-ui-reading-overlays.cjs'
      - 'scripts/regression-fixed-navigation-headers.cjs'
      - 'scripts/fixed-navigation-headers.mjs'
      - 'client/src/components/navigation/InternalHeaderFrame.tsx'
      - 'client/src/components/v1391/HomeLayoutShell.tsx'
      - 'client/src/components/v1391/MenuPersonalization.tsx'
      - 'scripts/v14387d/apply.mjs'
      - 'scripts/p1-home-layout/apply.mjs'
      - 'client/src/pages/Home.tsx'
      - 'client/src/components/v1391/menu-5s.css'
      - 'client/src/components/v1391/menu-personalization.css'
      - 'scripts/regression-hotel-controls-browser.mjs'
      - 'client/src/lib/menuPreference.ts'
      - 'client/src/lib/menuNestedSearch.ts'
      - 'client/src/components/platform/PlatformCenter.tsx'
      - 'client/src/components/v1391/RosterLaunchView.tsx'
      - 'scripts/p1-menu-organization/**'
      - 'scripts/regression-share-discovery-browser.cjs'
      - 'client/src/lib/rosterPublication*.ts'
      - 'client/src/lib/rosterStartup.ts'
      - 'scripts/roster-startup/**'
      - 'client/src/components/v1391/AimsRosterTable.tsx'
      - 'scripts/regression-publication-import-flow.cjs'
      - 'scripts/regression-roster-publication-review.mjs'
      - 'scripts/p1-menu-premium/**'
      - 'scripts/p1-menu-5s/**'
      - 'scripts/v14344/**'
      - 'scripts/v14394/**'
      - 'scripts/regression-menu-responsive-browser.mjs'
      - 'scripts/regression-menu-5s.mjs'
      - 'scripts/regression-menu-role-favorites.mjs'
      - 'scripts/regression-menu-favorites-interaction.mjs'
      - 'scripts/regression-shell-navigation-browser.mjs'
      - 'scripts/regression-web-desktop-shell.mjs'
      - '.github/workflows/mobile-menu-responsive.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-menu-responsive-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  menu-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # PR checkout tests the merge result with the current main, not a stale base.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Record canonical hotel stylesheet before preparation
        run: sha256sum client/src/components/v1391/menu-personalization.css > "$RUNNER_TEMP/hotel-controls-css.sha256"
      # This regression prepares the full chain itself. Do not prepare twice.
      - name: Prepare once through the iPad source regression
        run: node scripts/regression-v14-3-94-ipad-menu-layout.mjs
      - name: Verify hotel stylesheet survives canonical preparation
        run: sha256sum -c "$RUNNER_TEMP/hotel-controls-css.sha256"
      - name: Preserve navigation inventory and source contracts
        run: |
          node scripts/regression-p1-menu-premium.mjs
          node scripts/regression-web-desktop-shell.mjs
          node scripts/regression-web-desktop-menu-panel-specificity.mjs
          node scripts/regression-menu-5s.mjs
      - name: TypeScript and web build
        run: |
          npx tsc --noEmit
          npx vite build
      - name: Install isolated browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/menu-browser" --ignore-scripts --no-audit --no-fund playwright@1.55.0
          node "$RUNNER_TEMP/menu-browser/node_modules/playwright/cli.js" install --with-deps chromium webkit
      - name: Validate hotel selector and reset spacing with actual prepared components
        env:
          MENU_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/menu-browser/package.json
        run: node scripts/regression-hotel-controls-browser.mjs
      - name: Render menu in desktop, tablet and rotating phone viewports
        env:
          MENU_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/menu-browser/package.json
        run: node scripts/regression-menu-responsive-browser.mjs
      - name: Exercise favorites, account isolation and keyboard interaction
        env:
          MENU_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/menu-browser/package.json
        run: node scripts/regression-menu-favorites-interaction.mjs
      - name: Render canonical footer and content clearance in Chromium and WebKit
        env:
          MENU_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/menu-browser/package.json
        run: node scripts/regression-shell-navigation-browser.mjs
      - name: Exercise reading preference and overlay scroll recovery with synthetic accounts
        env:
          MENU_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/menu-browser/package.json
        run: node scripts/regression-ui-reading-overlays.cjs
      - name: Verify pinned navigation and import theme with actual app
        env:
          MENU_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/menu-browser/package.json
        run: node scripts/regression-fixed-navigation-headers.cjs
      - name: Validate publication import to history with synthetic PDFs
        env:
          MENU_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/menu-browser/package.json
        run: |
          node scripts/regression-roster-publication-review.mjs
          node scripts/regression-publication-import-flow.cjs
      - name: Validate sharing discovery without real invitations
        env:
          MENU_PLAYWRIGHT_PACKAGE: ${{ runner.temp }}/menu-browser/package.json
        run: node scripts/regression-share-discovery-browser.cjs
      - name: Save actual viewport evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CrewCheck-menu-responsive-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/hotel-controls
            artifacts/menu-responsive
            artifacts/menu-interaction
            artifacts/ui-reading-overlays
            artifacts/fixed-headers
            artifacts/publication-import-flow
            artifacts/share-discovery
          if-no-files-found: warn
          retention-days: 7

