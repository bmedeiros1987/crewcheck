name: CrewCheck roster fingerprint parity

on:
  pull_request:
    branches: [main]
    paths:
      - 'client/src/lib/offlineSync.ts'
      - 'server/platform.mjs'
      - 'scripts/v139/apply.mjs'
      - 'scripts/v14372/**'
      - 'scripts/regression-v14-3-72-roster-fingerprint-parity.mjs'
      - '.github/workflows/roster-fingerprint-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fingerprint-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm
      - run: npm ci
      - name: Prepare canonical sources
        run: node scripts/v139/apply.mjs
      - name: Validate Web APK server fingerprint parity
        run: node scripts/regression-v14-3-72-roster-fingerprint-parity.mjs
      - name: TypeScript check
        run: npx tsc --noEmit
