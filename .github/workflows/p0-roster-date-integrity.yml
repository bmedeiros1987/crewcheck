name: CrewCheck P0 roster date integrity

on:
  pull_request:
    paths:
      - 'scripts/fixtures/crew-roster-august-2026-current-p0.txt'
      - 'scripts/regression-p0-roster-date-integrity.mjs'
      - 'scripts/regression-v14-3-81-operational-date-anchor.mjs'
      - 'scripts/v14380/**'
      - 'scripts/v14381/**'
      - 'scripts/v139/apply.mjs'
      - 'client/src/pages/Home.tsx'
      - 'client/src/lib/canonicalRoster.ts'
      - 'client/src/lib/complianceEngine.ts'
      - 'client/src/lib/pdfParser.ts'
      - 'server/rosterParser.mjs'
      - '.github/workflows/p0-roster-date-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  roster-date-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
      - run: npm ci --ignore-scripts
      - name: Prepare canonical source and run P0 date regression
        run: node scripts/v139/apply.mjs && node scripts/regression-p0-roster-date-integrity.mjs && node scripts/regression-v14-3-81-operational-date-anchor.mjs
