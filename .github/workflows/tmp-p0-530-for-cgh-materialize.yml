name: TMP P0 530 FOR-CGH materializer

on:
  push:
    branches:
      - fix/p0-530-for-cgh-timezone
    paths:
      - .github/workflows/tmp-p0-530-for-cgh-materialize.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/p0-530-for-cgh-timezone
          fetch-depth: 0

      - name: Verify baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "4cbc79d2834085e6218cc5680c7ffab331a22c7a"

      - name: Apply exact timezone-independent transforms
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one anchor, got {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'client/src/lib/canonicalRoster.ts',
              """function dateAt(day: RosterDay, time: string | null, fallbackHour: number) {
            const parsed = parseRosterDate(day.date, day.month || 1, day.year || new Date().getFullYear());
            const date = new Date(parsed.year, parsed.month - 1, parsed.day, fallbackHour, 0, 0, 0);
            const normalized = normalizeTime(time);
            if (normalized) {
              const [h, m] = normalized.split(':').map(Number);
              date.setHours(h, m, 0, 0);
            }
            return date;
          }""",
              """const BRAZIL_UTC_OFFSET_MINUTES = 3 * 60;

          /**
           * Horários publicados na escala são relógio operacional do Brasil.
           * Convertemos a parede BRT (UTC-03) diretamente para instante UTC para
           * que Node, browser, CI e servidor produzam o mesmo ISO independentemente
           * do timezone do processo (#530).
           */
          function dateAt(day: RosterDay, time: string | null, fallbackHour: number) {
            const parsed = parseRosterDate(day.date, day.month || 1, day.year || new Date().getFullYear());
            const normalized = normalizeTime(time);
            const [hour, minute] = normalized ? normalized.split(':').map(Number) : [fallbackHour, 0];
            return new Date(Date.UTC(
              parsed.year,
              parsed.month - 1,
              parsed.day,
              hour,
              minute + BRAZIL_UTC_OFFSET_MINUTES,
              0,
              0,
            ));
          }"""
          )

          # Once dateAt returns an absolute UTC instant, day offsets must also be
          # applied in UTC or the runtime timezone is reintroduced at midnight/DST.
          p = Path('client/src/lib/canonicalRoster.ts')
          text = p.read_text()
          text = text.replace('start.setDate(start.getDate() + physicalDayOffset);', 'start.setUTCDate(start.getUTCDate() + physicalDayOffset);')
          text = text.replace('end.setDate(end.getDate() + arrivalOffset);', 'end.setUTCDate(end.getUTCDate() + arrivalOffset);')
          text = text.replace('end.setDate(end.getDate() + 1);', 'end.setUTCDate(end.getUTCDate() + 1);')
          text = text.replace('isNextDay: end.getDate() !== start.getDate(),', 'isNextDay: end.getUTCDate() !== start.getUTCDate(),')
          p.write_text(text)

          replace_once(
              'client/src/lib/rosterContinuity.ts',
              """function dateAt(day: RosterDay, roster: CrewRoster, value: string | null, fallbackHour: number) {
            const date = localDate(day, roster);
            const time = normalizeTime(value);
            if (time) {
              const [hours, minutes] = time.split(':').map(Number);
              date.setHours(hours, minutes, 0, 0);
            } else date.setHours(fallbackHour, 0, 0, 0);
            return date;
          }""",
              """const BRAZIL_UTC_OFFSET_MINUTES = 3 * 60;
          function dateAt(day: RosterDay, roster: CrewRoster, value: string | null, fallbackHour: number) {
            const parsed = parseDate(day.date, day.month || roster.month || 1, day.year || roster.year || new Date().getFullYear());
            const time = normalizeTime(value);
            const [hours, minutes] = time ? time.split(':').map(Number) : [fallbackHour, 0];
            return new Date(Date.UTC(
              parsed.year,
              parsed.month - 1,
              parsed.day,
              hours,
              minutes + BRAZIL_UTC_OFFSET_MINUTES,
              0,
              0,
            ));
          }"""
          )

          replace_once(
              'client/src/lib/complianceEngine.ts',
              """function nightKeysTouchedByInterval(start: number, end: number): number[] {
            if (!Number.isFinite(start) || !Number.isFinite(end) || end <= start) return [];
            const keys: number[] = [];
            const cursor = new Date(start);
            cursor.setHours(0, 0, 0, 0);
            for (let nightKey = cursor.getTime(); nightKey < end; nightKey += NIGHT_DAY_MS) {
              const windowStart = nightKey;
              const windowEnd = nightKey + 6 * NIGHT_HOUR_MS;
              if (start < windowEnd && end > windowStart) keys.push(nightKey);
            }
            return keys;
          }""",
              """const BRAZIL_UTC_OFFSET_MS = -3 * NIGHT_HOUR_MS;

          function nightKeysTouchedByInterval(start: number, end: number): number[] {
            if (!Number.isFinite(start) || !Number.isFinite(end) || end <= start) return [];
            const keys: number[] = [];
            // Move o instante para um relógio civil BRT e ancora 00:00 via UTC;
            // depois converte a janela de volta para instante absoluto. Assim a
            // madrugada operacional 00:00–06:00 Brasil não depende de process.env.TZ.
            const civilCursor = new Date(start + BRAZIL_UTC_OFFSET_MS);
            civilCursor.setUTCHours(0, 0, 0, 0);
            for (let civilNightKey = civilCursor.getTime(); civilNightKey < end + BRAZIL_UTC_OFFSET_MS; civilNightKey += NIGHT_DAY_MS) {
              const windowStart = civilNightKey - BRAZIL_UTC_OFFSET_MS;
              const windowEnd = windowStart + 6 * NIGHT_HOUR_MS;
              if (start < windowEnd && end > windowStart) keys.push(windowStart);
            }
            return keys;
          }"""
          )

          regression = r'''import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { execFileSync } from 'node:child_process';
          import { pathToFileURL } from 'node:url';

          const root = process.cwd();
          const tmp = fs.mkdtempSync(path.join(os.tmpdir(), 'crewcheck-p0-530-tz-'));
          const bundle = path.join(tmp, 'canonical.mjs');
          execFileSync(path.join(root, 'node_modules', '.bin', 'esbuild'), [
            'client/src/lib/canonicalRoster.ts', '--bundle', '--platform=node', '--format=esm',
            '--outfile=' + bundle,
          ], { stdio: 'inherit' });

          const mod = await import(pathToFileURL(bundle).href + '?v=' + Date.now());
          const roster = {
            crewName: 'Synthetic Crew', base: 'AAA', month: 9, year: 2026, rawText: '',
            days: [{
              date: '10/09/2026', dayNumber: 10, month: 9, year: 2026, dayOfWeek: 'qui',
              type: 'VOO', pairingCode: 'SYNTH', dutyReport: '17:30', dutyDebrief: '22:30',
              legs: [{ flightNumber: 'LA9001', origin: 'AAA', destination: 'BBB', departureTime: '18:00', arrivalTime: '21:00', presentationTime: '17:30' }],
              dutyHours: 5, flyingHours: 3, isNextDay: false, hotel: null, base: 'AAA', rawText: 'synthetic',
            }],
          };
          const events = mod.buildCanonicalRosterEvents(roster).filter(e => e.kind === 'flight');
          assert.equal(events.length, 1);
          assert.equal(events[0].startDateTime, '2026-09-10T21:00:00.000Z');
          assert.equal(events[0].endDateTime, '2026-09-11T00:00:00.000Z');
          const active = mod.selectNextRosterEvent(events, new Date('2026-09-10T22:00:00.000Z'));
          assert.equal(active?.flightNumber, 'LA9001');
          console.log(JSON.stringify({ start: events[0].startDateTime, end: events[0].endDateTime, active: active?.flightNumber }));
          '''
          Path('scripts/regression-p0-530-journey-instant-timezone-independence.mjs').write_text(regression)

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Prove timezone independence
        shell: bash
        run: |
          set -euo pipefail
          for zone in UTC America/Sao_Paulo Pacific/Kiritimati; do
            echo "=== TZ=$zone ==="
            TZ="$zone" node scripts/regression-p0-530-journey-instant-timezone-independence.mjs
          done
          npx tsc --noEmit
          git diff --check

      - name: Commit materialized fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-p0-530-for-cgh-materialize.yml
          git config user.name "CrewCheck P0 Gatekeeper"
          git config user.email "crewcheck@users.noreply.github.com"
          git add client/src/lib/canonicalRoster.ts client/src/lib/rosterContinuity.ts client/src/lib/complianceEngine.ts scripts/regression-p0-530-journey-instant-timezone-independence.mjs .github/workflows/tmp-p0-530-for-cgh-materialize.yml
          git commit -m "fix(#530): make roster journey instants timezone-independent"
          git push origin HEAD:fix/p0-530-for-cgh-timezone
