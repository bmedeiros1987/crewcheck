name: CrewCheck Mobile self-heal signed build

on:
  pull_request:
    paths:
      - 'scripts/p0-android-self-heal/**'
      - '.github/workflows/mobile-self-heal-signed.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-mobile:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KEYSTORE_BASE64: ${{ secrets.CREWCHECK_KEYSTORE_BASE64 }}
      STORE_PASSWORD: ${{ secrets.CREWCHECK_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.CREWCHECK_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.CREWCHECK_KEY_PASSWORD }}
      CREWCHECK_STORE_FILE: ${{ github.workspace }}/android-wrapper/crewcheck-release.jks

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Install dependencies
        run: npm ci

      - name: Materialize canonical Mobile shell
        run: node scripts/v139/apply.mjs

      - name: Self-heal regression
        run: node scripts/p0-android-self-heal/regression.mjs

      - name: TypeScript and web build
        run: |
          npx tsc --noEmit
          npx vite build

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'

      - name: Restore existing signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64:-}"
          test -n "${STORE_PASSWORD:-}"
          test -n "${KEY_ALIAS:-}"
          test -n "${KEY_PASSWORD:-}"
          umask 077
          printf '%s' "${KEYSTORE_BASE64#base64:}" | tr -d '\r\n ' | base64 --decode > "$CREWCHECK_STORE_FILE"
          test -s "$CREWCHECK_STORE_FILE"
          keytool -list -keystore "$CREWCHECK_STORE_FILE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build signed Mobile APK and AAB
        working-directory: android-wrapper
        env:
          CREWCHECK_STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          CREWCHECK_KEY_ALIAS: ${{ env.KEY_ALIAS }}
          CREWCHECK_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: gradle --no-daemon --console=plain :app:assembleRelease :app:bundleRelease

      - name: Verify and stage Mobile artifacts
        shell: bash
        run: |
          set -euo pipefail
          apk='android-wrapper/app/build/outputs/apk/release/app-release.apk'
          aab='android-wrapper/app/build/outputs/bundle/release/app-release.aab'
          test -s "$apk"
          test -s "$aab"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$apk"

          verify_log="$RUNNER_TEMP/mobile-aab.verify.log"
          jarsigner -verify -verbose -certs "$aab" > "$verify_log" 2>&1
          grep -Fq 'jar verified.' "$verify_log"
          ! grep -Fqi 'jar is unsigned' "$verify_log"

          out="$RUNNER_TEMP/crewcheck-mobile-self-heal"
          mkdir -p "$out"
          cp "$apk" "$out/CrewCheck-Mobile-self-heal-signed.apk"
          cp "$aab" "$out/CrewCheck-Mobile-self-heal-Play-Console.aab"
          (cd "$out" && sha256sum *.apk *.aab > SHA256SUMS.txt)

      - name: Upload signed Mobile test build
        uses: actions/upload-artifact@v4
        with:
          name: CrewCheck-Mobile-self-heal-signed
          path: |
            ${{ runner.temp }}/crewcheck-mobile-self-heal/CrewCheck-Mobile-self-heal-signed.apk
            ${{ runner.temp }}/crewcheck-mobile-self-heal/CrewCheck-Mobile-self-heal-Play-Console.aab
            ${{ runner.temp }}/crewcheck-mobile-self-heal/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing material
        if: always()
        run: rm -f "$CREWCHECK_STORE_FILE"
