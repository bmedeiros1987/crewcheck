name: CrewWatch premium consolidated

on:
  pull_request:
    paths:
      - 'android-wrapper/wear/**'
      - 'android-wrapper/watchface/**'
      - 'android-wrapper/app/**'
      - 'client/src/components/v1434/CrewCheckLifeView.tsx'
      - 'android-wrapper/settings.gradle'
      - 'scripts/regression-crewwatch-premium-consolidated.mjs'
      - '.github/workflows/crewwatch-premium-consolidated.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.CREWCHECK_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 || secrets.KEYSTORE_FILE_BASE64 || secrets.SIGNING_KEY }}
      STORE_PASSWORD: ${{ secrets.CREWCHECK_STORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || secrets.ANDROID_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD || secrets.KEY_STORE_PASSWORD || secrets.SIGNING_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.CREWCHECK_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS || secrets.KEY_ALIAS || secrets.ALIAS }}
      KEY_PASSWORD: ${{ secrets.CREWCHECK_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD || secrets.SIGNING_KEY_PASSWORD }}
      CREWCHECK_STORE_FILE: ${{ github.workspace }}/android-wrapper/crewcheck-release.jks

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Install web dependencies
        run: npm ci

      - name: Prepare canonical CrewCheck sources
        run: node scripts/v139/apply.mjs

      - name: Premium consolidated regression
        run: node scripts/regression-crewwatch-premium-consolidated.mjs

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Build web
        run: npx vite build

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Decode signing key
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64:-}"
          test -n "${STORE_PASSWORD:-}"
          test -n "${KEY_ALIAS:-}"
          test -n "${KEY_PASSWORD:-}"
          encoded="${KEYSTORE_BASE64#base64:}"
          {
            echo "CrewCheck Mobile"
            echo "  package: com.crewcheck.app"
            echo "  file: CrewCheck-Mobile-com.crewcheck.app-Play-Console.aab"
            echo
            echo "CrewWatch Wear OS"
            echo "  package: com.crewcheck.app"
            echo "  file: CrewCheck-CrewWatch-com.crewcheck.app-Play-Console.aab"
            echo
            echo "CrewCheck Watch Face"
            echo "  package: com.crewcheck.watch.app"
            echo "  file: CrewCheck-WatchFace-com.crewcheck.watch.app-Play-Console.aab"
          } > "$out/PACKAGE_MAP.txt"
          (cd "$out" && sha256sum *.apk *.aab > SHA256SUMS.txt)

      - name: Upload signed pilot
        uses: actions/upload-artifact@v6
        with:
          name: crewwatch-premium-consolidated-signed
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/crewwatch-premium/*.apk
            ${{ runner.temp }}/crewwatch-premium/*.aab
            ${{ runner.temp }}/crewwatch-premium/PACKAGE_MAP.txt
            ${{ runner.temp }}/crewwatch-premium/SHA256SUMS.txt
