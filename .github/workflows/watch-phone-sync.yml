name: Watch phone sync bridge

on:
  pull_request:
    paths:
      - 'android-wrapper/app/**'
      - 'client/src/lib/watchContext.ts'
      - 'client/src/pages/Home.tsx'
      - 'scripts/regression-mobile-watch-*.mjs'
      - 'scripts/regression-mobile-watch-*.cjs'
      - '.github/workflows/watch-phone-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-watch-phone-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Install web dependencies
        run: npm ci

      - name: Validate selective Radar to Watch projection
        run: |
          node scripts/regression-mobile-watch-publish-cadence.mjs
          node scripts/regression-mobile-watch-gate-contract.mjs
          TZ=UTC node scripts/regression-mobile-watch-gate-identity.cjs

      - name: Prepare CrewCheck sources
        run: node scripts/v139/apply.mjs

      - name: Validate prepared Radar to Watch projection
        run: |
          node scripts/regression-mobile-watch-publish-cadence.mjs
          node scripts/regression-mobile-watch-gate-contract.mjs
          TZ=UTC node scripts/regression-mobile-watch-gate-identity.cjs

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build web client
        run: npx vite build

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Compile phone companion
        run: gradle -p android-wrapper --no-daemon --console=plain :app:assembleDebug

      - name: Inspect Android test artifact
        shell: bash
        run: |
          set -euo pipefail
          apk='android-wrapper/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$apk"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          out="$RUNNER_TEMP/watch-gate-test"
          mkdir -p "$out"
          cp "$apk" "$out/CrewCheck-gate-test-debug.apk"
          "$tools/aapt" dump badging "$apk" > "$out/package.txt"
          "$tools/apksigner" verify --verbose --print-certs "$apk" > "$out/signature.txt"
          git rev-parse HEAD > "$out/source-sha.txt"
          (cd "$out" && sha256sum *.apk > SHA256SUMS.txt)
          printf '%s\n' 'DEBUG TEST ARTIFACT: not a Play update. Verify installed package, versionCode and certificate before any installation; do not uninstall or clear data.' > "$out/INSTALLATION-NOT-APPROVED.txt"

      - name: Preserve Android test artifact and evidence
        uses: actions/upload-artifact@v4
        with:
          name: CrewCheck-gate-test-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/watch-gate-test/
          if-no-files-found: error
          retention-days: 7
