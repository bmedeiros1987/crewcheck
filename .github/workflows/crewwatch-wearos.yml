name: CrewWatch Wear OS MVP

on:
  pull_request:
    paths:
      - 'android-wrapper/wear/**'
      - 'android-wrapper/settings.gradle'
      - 'android-wrapper/build.gradle'
      - '.github/workflows/crewwatch-wearos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wear:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Compile CrewWatch debug APK
        run: gradle -p android-wrapper :wear:assembleDebug

      - name: Build CrewWatch release AAB
        run: gradle -p android-wrapper :wear:bundleRelease

      - name: Upload CrewWatch artifacts
        uses: actions/upload-artifact@v6
        with:
          name: crewwatch-wearos-mvp
          path: |
            android-wrapper/wear/build/outputs/apk/debug/*.apk
            android-wrapper/wear/build/outputs/bundle/release/*.aab
