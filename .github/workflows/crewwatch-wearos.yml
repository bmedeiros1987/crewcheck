name: CrewWatch Wear OS MVP

on:
  pull_request:
    paths:
      - 'android-wrapper/wear/**'
      - 'android-wrapper/app/build.gradle'
      - 'android-wrapper/app/src/main/java/com/crewcheck/app/MainActivity.java'
      - 'android-wrapper/app/src/main/java/com/crewcheck/app/CrewCheckWatchPublisher.java'
      - 'android-wrapper/settings.gradle'
      - 'android-wrapper/build.gradle'
      - '.github/workflows/crewwatch-wearos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wear:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Compile CrewCheck phone debug APK
        run: gradle -p android-wrapper :app:assembleDebug

      - name: Compile CrewWatch debug APK
        run: gradle -p android-wrapper :wear:assembleDebug

      - name: Build CrewWatch release AAB
        run: gradle -p android-wrapper :wear:bundleRelease

      - name: Validate watch transport markers
        run: |
          grep -q 'syncWatchSnapshot' android-wrapper/app/src/main/java/com/crewcheck/app/MainActivity.java
          grep -q 'play-services-wearable:20.0.1' android-wrapper/app/build.gradle
          grep -q '/crewcheck/watch-context/v1' android-wrapper/app/src/main/java/com/crewcheck/app/CrewCheckWatchPublisher.java
          grep -q '/crewcheck/watch-context/v1' android-wrapper/wear/src/main/java/com/crewcheck/watch/sync/CrewCheckDataLayerService.java

      - name: Upload CrewCheck phone and watch artifacts
        uses: actions/upload-artifact@v6
        with:
          name: crewwatch-wearos-mvp
          path: |
            android-wrapper/app/build/outputs/apk/debug/*.apk
            android-wrapper/wear/build/outputs/apk/debug/*.apk
            android-wrapper/wear/build/outputs/bundle/release/*.aab
            android-wrapper/app/src/main/java/com/crewcheck/app/CrewCheckWatchPublisher.java
            android-wrapper/wear/sample/watch-context-v1.json
