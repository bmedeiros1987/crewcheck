name: CrewWatch Galaxy compatibility

on:
  pull_request:
    paths:
      - 'android-wrapper/wear/**'
      - 'android-wrapper/watchface/**'
      - 'docs/crewwatch_galaxy_compatibility.md'
      - 'docs/peripherals/device_status_v1.md'
      - 'scripts/regression-crewwatch-galaxy-compatibility.mjs'
      - '.github/workflows/crewwatch-galaxy-compatibility.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  galaxy-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.0'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Ownership fence
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${GITHUB_BASE_REF}"
          forbidden="$(git diff --name-only "origin/${GITHUB_BASE_REF}"...HEAD | grep -E '^(android-wrapper/app/|client/)' || true)"
          if [ -n "$forbidden" ]; then
            echo 'Galaxy peripheral PR contains Mobile-owned files:' >&2
            echo "$forbidden" >&2
            exit 1
          fi
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Validate Galaxy Watch4+ contract
        run: node scripts/regression-crewwatch-galaxy-compatibility.mjs
      - name: Compile CrewWatch debug
        run: gradle -p android-wrapper --no-daemon --console=plain :wear:assembleDebug
      - name: Wear unit tests
        run: gradle -p android-wrapper --no-daemon --console=plain :wear:testDebugUnitTest
