name: CrewCheck hotel location separation

on:
  pull_request:
    paths:
      - 'scripts/v14389/apply.mjs'
      - 'scripts/regression-hotel-report-location-separation.mjs'
      - '.github/workflows/hotel-location-separation.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/v14389/apply.mjs'
      - 'scripts/regression-hotel-report-location-separation.mjs'
      - '.github/workflows/hotel-location-separation.yml'

jobs:
  hotel-location-separation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
      - name: Syntax
        run: node --check scripts/regression-hotel-report-location-separation.mjs
      - name: Guard hotel vs report/training location
        run: node scripts/regression-hotel-report-location-separation.mjs
