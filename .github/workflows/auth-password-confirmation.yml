name: Auth password confirmation

on:
  pull_request:
    paths:
      - 'server/v139/auth.mjs'
      - 'client/src/pages/AuthPage.tsx'
      - 'scripts/v139/apply.mjs'
      - 'scripts/v14397/apply.mjs'
      - 'scripts/regression-auth-password-confirmation.mjs'
      - '.github/workflows/auth-password-confirmation.yml'
  push:
    branches: [main]
    paths:
      - 'server/v139/auth.mjs'
      - 'client/src/pages/AuthPage.tsx'
      - 'scripts/v139/apply.mjs'
      - 'scripts/v14397/apply.mjs'
      - 'scripts/regression-auth-password-confirmation.mjs'
      - '.github/workflows/auth-password-confirmation.yml'

jobs:
  password-confirmation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply canonical preparation
        run: node scripts/v139/apply.mjs
      - name: Syntax check
        run: node --check server/v139/auth.mjs && node --check scripts/v14397/apply.mjs
      - name: Password confirmation contract
        run: node scripts/regression-auth-password-confirmation.mjs
      - name: Idempotence
        run: node scripts/v14397/apply.mjs && node scripts/regression-auth-password-confirmation.mjs
