name: Brasília transit provider pack

on:
  pull_request:
    paths:
      - 'server/integrations/brasiliaTransit.mjs'
      - 'scripts/regression-brasilia-transit-provider-pack.mjs'
      - '.github/workflows/brasilia-transit-provider-pack.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/regression-brasilia-transit-provider-pack.mjs
