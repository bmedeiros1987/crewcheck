name: Cirium Sky trial adapter

on:
  pull_request:
    paths:
      - 'server/cirium-diagnostic.mjs'
      - 'server/cirium-flight-adapter.mjs'
      - 'server/radar-occurrence-identity.mjs'
      - 'server/radar-field-provenance.mjs'
      - 'server/v1412/ciriumHealth.mjs'
      - 'server/v139/index.mjs'
      - 'scripts/regression-cirium-evaluation-diagnostic.mjs'
      - 'scripts/regression-cirium-canonical-adapter.mjs'
      - 'scripts/regression-radar-occurrence-identity.mjs'
      - 'scripts/regression-radar-field-provenance.mjs'
      - '.env.example'
      - 'render.yaml'
      - '.github/workflows/cirium-sky-trial.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
      - name: Cirium diagnostic contract
        run: npm run regression:cirium-diagnostic
      - name: Cirium canonical adapter contract
        run: npm run regression:cirium-adapter
      - name: Radar occurrence identity contract
        run: node scripts/regression-radar-occurrence-identity.mjs
      - name: Radar field provenance contract
        run: node scripts/regression-radar-field-provenance.mjs
      - name: Cirium admin route syntax
        run: node --check server/v1412/ciriumHealth.mjs && node --check server/v139/index.mjs && node --check server/radar-occurrence-identity.mjs && node --check server/radar-field-provenance.mjs
