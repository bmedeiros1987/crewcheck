name: Voyage MVP shell

on:
  pull_request:
    paths:
      - 'shared/voyageJourney.mjs'
      - 'scripts/regression-voyage-live-state.mjs'
      - 'scripts/regression-voyage-brand-system.mjs'
      - 'scripts/regression-voyage-web-route.mjs'
      - 'voyage-preview/**'
      - 'client/public/voyage/**'
      - 'client/index.html'
      - '.github/workflows/voyage-mvp-shell.yml'

jobs:
  voyage-live-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Voyage live-state regression
        run: node scripts/regression-voyage-live-state.mjs
      - name: Voyage premium brand-system contract
        run: node scripts/regression-voyage-brand-system.mjs
      - name: Voyage production route contract
        run: node scripts/regression-voyage-web-route.mjs
