name: Official webOS toolchain export
on:
  push:
    branches: ['build/webos-toolchain-20260918']
    paths: ['.github/workflows/webos-toolchain-export.yml']
permissions: {}
concurrency:
  group: isolated-webos-toolchain-export
  cancel-in-progress: true
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Obtain official CLI and dependencies only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lg-toolchain" "$RUNNER_TEMP/export"
          cd "$RUNNER_TEMP/lg-toolchain"
          npm init -y
          npm install --omit=dev --no-audit --no-fund @webos-tools/cli@3.2.6
          node node_modules/@webos-tools/cli/bin/ares.js --version > "$RUNNER_TEMP/export/CLI-VERSION.txt"
          tar -czf "$RUNNER_TEMP/export/official-webos-cli-3.2.6.tar.gz" node_modules package.json package-lock.json
          cd "$RUNNER_TEMP/export"
          sha256sum official-webos-cli-3.2.6.tar.gz > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Official-webOS-CLI-3.2.6-offline-toolchain
          path: ${{ runner.temp }}/export/
          retention-days: 1
          if-no-files-found: error
# Tooling only. No repository checkout, app content, personal data, secrets,
# service credentials, deployments, production changes, or merge.
