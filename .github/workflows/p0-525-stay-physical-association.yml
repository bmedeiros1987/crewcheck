name: "P0 #525 stay physical association"

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'client/src/lib/rosterContinuity.ts'
      - 'client/src/lib/canonicalRoster.ts'
      - 'scripts/regression-p0-525-stay-physical-association.mjs'
      - 'scripts/regression-p0-525-continuity-incremental.mjs'
      - 'scripts/lib/ts-module-harness.mjs'
      - 'scripts/v139/**'
      - '.github/workflows/p0-525-stay-physical-association.yml'
  push:
    branches: [main]
    paths:
      - 'client/src/lib/rosterContinuity.ts'
      - 'client/src/lib/canonicalRoster.ts'
      - 'scripts/regression-p0-525-stay-physical-association.mjs'
      - 'scripts/regression-p0-525-continuity-incremental.mjs'
      - 'scripts/lib/ts-module-harness.mjs'
      - 'scripts/v139/**'
      - '.github/workflows/p0-525-stay-physical-association.yml'

permissions:
  contents: read

jobs:
  stay-physical-association:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Source physical boundary regression
        run: node scripts/regression-p0-525-stay-physical-association.mjs
      - name: Source incremental continuity
        run: node scripts/regression-p0-525-continuity-incremental.mjs
      - name: Existing journey-rest contract
        run: node scripts/regression-p0-530-journey-rest-cleanroom.mjs
      - name: Prepare canonical source
        run: node scripts/v139/apply.mjs
      - name: Prepared physical and journey-rest contracts
        run: |
          set -euo pipefail
          node scripts/regression-p0-525-stay-physical-association.mjs
          node scripts/regression-p0-530-journey-rest-cleanroom.mjs
      - name: Prepared incremental continuity across runtime timezones
        run: |
          set -euo pipefail
          for zone in UTC America/Sao_Paulo America/Los_Angeles; do
            TZ="$zone" node scripts/regression-p0-525-continuity-incremental.mjs
          done
      - name: Preserve existing sovereign VC and carry-over guards
        run: |
          set -euo pipefail
          node scripts/regression-p0-580-real-vc-legend-boundary.mjs
          node scripts/regression-p0-580-transposed-vc-boundary.mjs
          node scripts/regression-p0-580-overlap-reimport.mjs
          node scripts/regression-p0-580-exact-competence-open.mjs
          node scripts/regression-p0-580-adjacent-crew-identity.mjs
          node scripts/regression-p0-580-active-body-fingerprint.mjs
          node scripts/regression-p0-580-previous-source-order.mjs
          node scripts/regression-p0-580-invalid-placeholders.mjs
          node scripts/regression-p0-580-residual-source-order.mjs
          node scripts/regression-p0-580-post-anchor-residual.mjs
          node scripts/p0-580-transposed-vc-boundary/regression-airport-sentinel.mjs
          node scripts/regression-p0-580-residual-object-identity.mjs
          node scripts/regression-p0-580-boundary-clock-independence.mjs
          node scripts/regression-p0-580-local-identity-collision.mjs
          node scripts/regression-p0-580-local-period-identity.mjs
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Full existing timezone and 168h contract (no bypass)
        run: node scripts/regression-p0-530-journey-instant-timezone-independence.mjs

  # Comparative evidence only: do not change the test or expected regulatory
  # value merely because a candidate and its base disagree with that contract.
  baseline-timezone-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prepare unchanged PR base
        run: node scripts/v139/apply.mjs
      - name: Run identical timezone and 168h assertion on base
        run: node scripts/regression-p0-530-journey-instant-timezone-independence.mjs
