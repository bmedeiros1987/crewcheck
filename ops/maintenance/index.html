<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>CrewCheck · Manutenção</title>
<style>
  :root { --bg:#f5f8fb; --panel:#ffffff; --text:#08203a; --muted:#42566b; --line:#c9d6e2; }
  @media (prefers-color-scheme: dark) { :root { --bg:#061426; --panel:#0c2036; --text:#edf4fb; --muted:#a9bccd; --line:#1f3954; } }
  * { box-sizing:border-box; }
  html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text); }
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:16px;
    font:400 1rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  main { width:100%; max-width:32rem; padding:24px; border:1px solid var(--line); border-radius:16px; background:var(--panel); }
  h1 { margin:0 0 8px; font-size:1.375rem; line-height:1.3; }
  p { margin:0; color:var(--muted); overflow-wrap:break-word; }
</style>
</head>
<body>
<main>
  <h1>CrewCheck</h1>
  <p role="status">Sistema em manutenção. Estamos trabalhando para restabelecer o acesso.</p>
</main>
</body>
</html>
