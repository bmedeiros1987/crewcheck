plugins { id 'com.android.application' }
android {
    namespace 'online.crewcheck.tv'
    compileSdk 35
    defaultConfig { applicationId 'online.crewcheck.tv'; minSdk 28; targetSdk 35; versionCode 1; versionName '0.1.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (System.getenv('TV_KEYSTORE')) {
                storeFile file(System.getenv('TV_KEYSTORE'))
                storePassword System.getenv('TV_STORE_PASSWORD')
                keyAlias System.getenv('TV_KEY_ALIAS')
                keyPassword System.getenv('TV_KEY_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
tasks.configureEach { task ->
    if (task.name == 'validateSigningRelease') task.doFirst {
        if (!System.getenv('TV_KEYSTORE')) throw new GradleException('Signed TV release requires TV_KEYSTORE and credentials')
    }
}
