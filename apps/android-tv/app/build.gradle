plugins { id 'com.android.application' }
android {
    namespace 'online.crewcheck.tv'
    compileSdk 35
    defaultConfig {
        applicationId 'online.crewcheck.tv'
        minSdk 28
        targetSdk 35
        versionCode 2
        versionName '0.2.1'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        manifestPlaceholders = [tvLabel: 'CrewCheck TV']
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (System.getenv('TV_KEYSTORE')) {
                storeFile file(System.getenv('TV_KEYSTORE'))
                storePassword System.getenv('TV_STORE_PASSWORD')
                keyAlias System.getenv('TV_KEY_ALIAS')
                keyPassword System.getenv('TV_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix project.hasProperty('tvDemo') ? '.demo' : '.debug'
            versionNameSuffix '-test'
            manifestPlaceholders = [tvLabel: project.hasProperty('tvDemo') ? 'CrewCheck TV Demo' : 'CrewCheck TV Test']
        }
        release { signingConfig signingConfigs.release; minifyEnabled false }
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
tasks.configureEach { task ->
    if (task.name == 'validateSigningRelease') task.doFirst {
        if (!System.getenv('TV_KEYSTORE')) throw new GradleException('Signed TV release requires TV_KEYSTORE and credentials')
    }
}
