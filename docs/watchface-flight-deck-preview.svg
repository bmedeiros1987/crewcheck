<svg xmlns="http://www.w3.org/2000/svg" width="900" height="900" viewBox="0 0 450 450" role="img" aria-labelledby="title desc">
  <title id="title">CrewCheck Flight Deck Watch Face</title>
  <desc id="desc">Prévia conceitual do Watch Face premium com relógio, status de portão, bateria, próximo passo, CrewLife, passos e rotina.</desc>
  <defs>
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="hero-stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity=".46"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity=".46"/>
    </linearGradient>
    <linearGradient id="green-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#86EFAC"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <clipPath id="dial"><circle cx="225" cy="225" r="225"/></clipPath>
  </defs>

  <circle cx="225" cy="225" r="225" fill="#000000"/>
  <g clip-path="url(#dial)" font-family="Inter, Arial, sans-serif">
    <!-- Quiet instrument frame -->
    <circle cx="225" cy="225" r="201" fill="none" stroke="#22D3EE" stroke-opacity=".33" stroke-width="2"/>
    <circle cx="225" cy="225" r="191" fill="none" stroke="#8B5CF6" stroke-opacity=".26" stroke-width="1"/>
    <rect x="220" y="8" width="10" height="18" rx="5" fill="#22D3EE" filter="url(#glow-cyan)"/>
    <rect x="8" y="220" width="18" height="10" rx="5" fill="#60A5FA"/>
    <rect x="424" y="220" width="18" height="10" rx="5" fill="#A78BFA"/>
    <rect x="220" y="424" width="10" height="18" rx="5" fill="#EC4899"/>

    <!-- Brand -->
    <text x="225" y="42" text-anchor="middle" font-size="12" font-weight="800" letter-spacing="3" fill="#22D3EE">CREWCHECK</text>

    <!-- Top status rail -->
    <rect x="68" y="56" width="142" height="36" rx="18" fill="#0C1726" stroke="#4C8DF8" stroke-opacity=".42"/>
    <text x="139" y="79" text-anchor="middle" font-size="16" font-weight="800" fill="#FBBF24">P14 · REMOTA</text>
    <rect x="240" y="56" width="142" height="36" rx="18" fill="#0C1726" stroke="#4B647C" stroke-opacity=".38"/>
    <text x="311" y="79" text-anchor="middle" font-size="15" font-weight="800" fill="#B7C9DA">84% · 11:25</text>

    <!-- Clock stage -->
    <rect x="56" y="88" width="338" height="126" rx="34" fill="#0D1B2F" fill-opacity=".13" stroke="url(#hero-stroke)" stroke-opacity=".52"/>
    <text x="225" y="164" text-anchor="middle" font-size="88" font-weight="800" letter-spacing="-3" fill="#FFFFFF">11:25</text>
    <text x="225" y="202" text-anchor="middle" font-size="16" font-weight="700" letter-spacing="2" fill="#A78BFA">QUI · 26 SET</text>

    <!-- Operational hero -->
    <rect x="40" y="224" width="370" height="104" rx="32" fill="#0C1726" stroke="#4C8DF8" stroke-opacity=".34"/>
    <rect x="48" y="242" width="4" height="68" rx="2" fill="#EC4899"/>
    <text x="225" y="253" text-anchor="middle" font-size="13" font-weight="800" letter-spacing="2" fill="#EC4899">PRÓXIMO PASSO</text>
    <text x="225" y="285" text-anchor="middle" font-size="28" font-weight="800" fill="#FFFFFF">SAIR 12:42</text>
    <text x="225" y="307" text-anchor="middle" font-size="12" font-weight="600" fill="#B7C9DA">APZ 13:30 · BSB · trânsito normal</text>

    <!-- Bottom glance dock -->
    <g>
      <rect x="48" y="342" width="104" height="64" rx="24" fill="#0C1726" stroke="#34D399" stroke-opacity=".30"/>
      <text x="100" y="362" text-anchor="middle" font-size="10" font-weight="800" letter-spacing="1.2" fill="#7A9AB8">CREWLIFE</text>
      <text x="100" y="390" text-anchor="middle" font-size="22" font-weight="800" fill="#34D399">78</text>
    </g>
    <g>
      <rect x="173" y="342" width="104" height="64" rx="24" fill="#0C1726" stroke="#22D3EE" stroke-opacity=".30"/>
      <text x="225" y="362" text-anchor="middle" font-size="10" font-weight="800" letter-spacing="1.2" fill="#7A9AB8">PASSOS</text>
      <text x="225" y="390" text-anchor="middle" font-size="22" font-weight="800" fill="#22D3EE">6.2k</text>
    </g>
    <g>
      <rect x="298" y="342" width="104" height="64" rx="24" fill="#0C1726" stroke="#A78BFA" stroke-opacity=".34"/>
      <text x="350" y="362" text-anchor="middle" font-size="10" font-weight="800" letter-spacing="1.2" fill="#7A9AB8">ROTINA</text>
      <text x="350" y="390" text-anchor="middle" font-size="21" font-weight="800" fill="#A78BFA">20m</text>
    </g>

    <!-- Small semantic status mark -->
    <circle cx="225" cy="424" r="2.5" fill="#EC4899"/>
  </g>
</svg>
